<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NQ 假設日誌</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;700&display=swap">
<style>
/* Layout: 兩欄研究筆記本 — 左側假設索引；右側假設本文，分頁切換「假設與驗證」與「策略」；另有策略總覽 */
:root{
  --bg:#eef1f4; --panel:#ffffff; --ink:#18212b; --muted:#5d6b79; --line:#d4dbe2;
  --accent:#1f4e8c; --accent-soft:#e3ebf6;
  --up:#1d7a4f; --up-soft:#e2f2ea; --down:#b43c2e; --down-soft:#f8e5e2; --mid:#8a6a12; --mid-soft:#f6efd9;
  --plum:#6b3f8f; --plum-soft:#efe6f6; --teal:#0f6f78; --teal-soft:#dff1f2;
  --f-display:"Noto Serif TC","Songti TC",serif;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:8px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#12171d; --panel:#1a2129; --ink:#e4e9ee; --muted:#93a1ae; --line:#2c3743;
  --accent:#7fa8e0; --accent-soft:#1f2e42;
  --up:#5cc494; --up-soft:#16302a; --down:#ec8577; --down-soft:#3a1f1c; --mid:#d9b55a; --mid-soft:#352c16;
  --plum:#c39ae3; --plum-soft:#2e2238; --teal:#5fc4cc; --teal-soft:#15302f;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12171d; --panel:#1a2129; --ink:#e4e9ee; --muted:#93a1ae; --line:#2c3743;
  --accent:#7fa8e0; --accent-soft:#1f2e42;
  --up:#5cc494; --up-soft:#16302a; --down:#ec8577; --down-soft:#3a1f1c; --mid:#d9b55a; --mid-soft:#352c16;
  --plum:#c39ae3; --plum-soft:#2e2238; --teal:#5fc4cc; --teal-soft:#15302f;
  color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.6 var(--f-body);padding-inline:16px;padding-block:0 40px}
button,input,select,textarea{font:inherit;color:inherit}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

header.top{max-width:1180px;margin:0 auto;display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;padding-block:20px 16px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:baseline;gap:10px;flex:1 1 auto;min-width:0;flex-wrap:wrap}
.brand h1{font:700 22px/1.2 var(--f-display);margin:0;letter-spacing:.02em}
.brand .tick{font-family:var(--f-mono);font-size:12px;color:var(--muted);letter-spacing:.04em}
.views{display:flex;background:var(--line);border-radius:8px;padding:3px;gap:2px}
.view{border:0;background:transparent;border-radius:6px;padding:5px 14px;cursor:pointer;font-size:14px;font-weight:500;color:var(--muted);white-space:nowrap}
.view[aria-selected="true"]{background:var(--panel);color:var(--ink);box-shadow:0 1px 2px rgb(0 0 0 / .08)}
.toolbar{display:flex;flex-wrap:wrap;gap:8px}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:6px 12px;cursor:pointer;font-size:14px;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--panel)}
.btn.danger{color:var(--down)}
.btn.danger.armed{background:var(--down);color:var(--panel);border-color:var(--down)}

.sync{max-width:1180px;margin:10px auto 0;font-size:13px;color:var(--muted);display:flex;gap:8px;align-items:center}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted);flex:none}
.dot.ok{background:var(--up)} .dot.dirty{background:var(--mid)} .dot.err{background:var(--down)}

main{max-width:1180px;margin:16px auto 0;display:grid;grid-template-columns:minmax(0,340px) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:820px){main{grid-template-columns:minmax(0,1fr)}}

/* 左側索引 */
aside{display:flex;flex-direction:column;gap:10px;min-width:0}
.search input{width:100%;border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:7px 10px}
.filters{display:flex;flex-wrap:wrap;gap:6px}
.chipbtn{border:1px solid var(--line);background:transparent;border-radius:999px;padding:2px 10px;font-size:13px;cursor:pointer;color:var(--muted)}
.chipbtn[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.list{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:var(--r);background:var(--panel);overflow:hidden}
.item{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 10px;padding:12px 14px;border-bottom:1px solid var(--line);cursor:pointer;text-align:left;background:none;border-left:3px solid transparent;border-top:0;border-right:0}
.item:last-child{border-bottom:0}
.item:hover{background:var(--accent-soft)}
.item.sel{background:var(--accent-soft);border-left-color:var(--accent)}
.item .code{font-family:var(--f-mono);font-size:12px;color:var(--muted);padding-top:2px}
.item .t{font-weight:500;line-height:1.45}
.item .meta{grid-column:2;display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;font-size:12px;color:var(--muted)}
.empty{padding:24px 14px;color:var(--muted);font-size:14px;text-align:center}

.status{display:inline-block;font-size:12px;font-weight:500;padding:1px 8px;border-radius:4px;white-space:nowrap}
.s-pending{background:var(--accent-soft);color:var(--accent)}
.s-testing,.s-partial{background:var(--mid-soft);color:var(--mid)}
.s-hold{background:var(--up-soft);color:var(--up)}
.s-reject{background:var(--down-soft);color:var(--down)}
.st-draft{background:var(--accent-soft);color:var(--muted)}
.st-backtest{background:var(--mid-soft);color:var(--mid)}
.st-paper{background:var(--teal-soft);color:var(--teal)}
.st-live{background:var(--up-soft);color:var(--up)}
.st-off{background:var(--down-soft);color:var(--down)}
.tf{display:inline-block;font-family:var(--f-mono);font-size:12px;font-weight:500;padding:0 7px;border-radius:4px;border:1px solid var(--line);color:var(--ink);background:var(--bg);white-space:nowrap}

/* 右側本文 */
.doc{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);min-width:0}
.doc-head{padding:22px 24px 0;display:flex;flex-direction:column;gap:10px}
.doc-head .row{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center}
.doc-head h2{font:700 24px/1.35 var(--f-display);margin:0;text-wrap:balance}
.stamps{display:flex;flex-wrap:wrap;gap:4px 18px;font-size:12px;color:var(--muted);align-items:center}
.stamps b{font-weight:500;color:var(--ink);margin-left:4px}
.tfrow{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12px;color:var(--muted)}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{font-size:12px;border:1px solid var(--line);border-radius:4px;padding:0 6px;color:var(--muted)}

.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-top:8px;overflow-x:auto}
.tab{background:none;border:0;border-bottom:2px solid transparent;padding:10px 14px;margin-bottom:-1px;cursor:pointer;font-size:15px;font-weight:500;color:var(--muted);white-space:nowrap;display:flex;gap:8px;align-items:center}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.tab .n{font-family:var(--f-mono);font-size:12px;font-weight:400}

.statement{padding:20px 24px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:14px}
.field{border:1px solid var(--line);border-radius:var(--r);overflow:hidden;min-width:0}
.field .lbl{display:flex;align-items:center;gap:8px;padding:8px 14px;font-size:14px;font-weight:700;letter-spacing:.04em;border-bottom:1px solid var(--line)}
.field .lbl::before{content:"";width:4px;height:16px;border-radius:2px;background:currentColor;flex:none}
.field .lbl .sub{margin-left:auto;font-weight:400;font-size:12px;letter-spacing:0;font-family:var(--f-mono)}
.field .val{padding:14px 16px;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.8;max-width:72ch}
.field.claim .lbl{background:var(--accent-soft);color:var(--accent)}
.field.claim .val{font-size:17px;font-weight:500}
.field.cond .lbl{background:var(--mid-soft);color:var(--mid)}
.none{color:var(--muted)!important;font-weight:400!important;font-size:14px!important}

.section{padding:18px 24px;border-bottom:1px solid var(--line)}
.section:last-child{border-bottom:0}
.sec-head{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;margin-bottom:12px}
.sec-head h3{font:600 16px/1.3 var(--f-display);margin:0}
.tally{display:flex;gap:10px;font-size:13px;font-family:var(--f-mono)}
.bar{flex:1 1 140px;height:6px;border-radius:3px;background:var(--line);display:flex;overflow:hidden;min-width:100px}
.bar i{display:block;height:100%}
.sec-head .btn{margin-left:auto}

.entry{display:grid;grid-template-columns:96px minmax(0,1fr);gap:12px;padding:12px 0;border-top:1px dashed var(--line)}
.entry:first-child{border-top:0}
.entry .when{font-family:var(--f-mono);font-size:12px;color:var(--muted);line-height:1.5}
.entry .when .d{color:var(--ink);font-size:13px}
.entry .body{min-width:0}
.entry .top{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;margin-bottom:4px}
.verdict{font-size:12px;font-weight:500;padding:0 7px;border-radius:4px}
.v-support{background:var(--up-soft);color:var(--up)}
.v-against{background:var(--down-soft);color:var(--down)}
.v-neutral{background:var(--mid-soft);color:var(--mid)}
.kind{font-size:12px;color:var(--accent);font-weight:500}
.entry .txt{white-space:pre-wrap;overflow-wrap:anywhere}
.entry .foot{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:11px;color:var(--muted);margin-top:6px;align-items:center}
.linkbtn{background:none;border:0;padding:0;color:var(--accent);cursor:pointer;font-size:12px}
.linkbtn.danger{color:var(--down)}

/* 策略分頁 */
.strat-head{padding:18px 24px;border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center}
.strat-head h3{font:600 18px/1.3 var(--f-display);margin:0}
.strat-head .acts{margin-left:auto;display:flex;gap:8px}
.sgrid{padding:20px 24px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.sgrid .span{grid-column:1/-1}
@media (max-width:980px){.sgrid{grid-template-columns:minmax(0,1fr)}}
.f-tf .lbl{background:var(--accent-soft);color:var(--accent)}
.f-io .lbl{background:var(--up-soft);color:var(--up)}
.f-pos .lbl{background:var(--plum-soft);color:var(--plum)}
.f-risk .lbl{background:var(--down-soft);color:var(--down)}
.f-time .lbl{background:var(--teal-soft);color:var(--teal)}
.kv{display:grid;grid-template-columns:minmax(84px,auto) minmax(0,1fr);gap:10px 16px;padding:14px 16px;margin:0}
.kv dt{font-size:13px;color:var(--muted);padding-top:2px}
.kv dd{margin:0;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.7;min-width:0}
.kv dd .chips{display:flex;flex-wrap:wrap;gap:6px}
.calc{margin:0 16px 14px;padding:10px 12px;border-radius:6px;background:var(--down-soft);font-size:13px;line-height:1.6}
.calc b{font-family:var(--f-mono);font-size:15px}
.dir{font-weight:700}
.dir.long{color:var(--up)} .dir.short{color:var(--down)} .dir.both{color:var(--accent)}
.strat-empty{padding:48px 24px;display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;color:var(--muted)}
.strat-empty p{margin:0;max-width:42ch}

/* 表單 */
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;padding:14px;border:1px solid var(--accent);border-radius:var(--r);background:var(--accent-soft);margin-bottom:12px}
.form.plain{background:transparent;border:0;padding:0;margin:0}
.form label,.form .lab{display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:500;color:var(--ink);min-width:0}
.form .wide{grid-column:1/-1}
.form input,.form select,.form textarea{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:7px 9px;font-size:14px;width:100%;min-width:0;font-weight:400}
.form textarea{min-height:90px;resize:vertical;line-height:1.55}
.form .actions{grid-column:1/-1;display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
fieldset.grp{grid-column:1/-1;border:1px solid var(--line);border-radius:var(--r);padding:0;margin:0;background:var(--panel);min-width:0}
fieldset.grp legend{padding:0 8px;margin-left:10px;font-size:15px;font-weight:700}
fieldset.grp .in{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;padding:10px 14px 14px}
fieldset.grp.c-tf legend{color:var(--accent)} fieldset.grp.c-io legend{color:var(--up)} fieldset.grp.c-pos legend{color:var(--plum)}
fieldset.grp.c-risk legend{color:var(--down)} fieldset.grp.c-time legend{color:var(--teal)}
.hint{font-size:12px;color:var(--muted);font-weight:400}

/* 複選下拉 */
details.ms{position:relative;min-width:0}
details.ms summary{list-style:none;cursor:pointer;border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:5px 30px 5px 8px;min-height:36px;display:flex;flex-wrap:wrap;gap:4px;align-items:center;position:relative;font-weight:400}
details.ms summary::-webkit-details-marker{display:none}
details.ms summary::after{content:"";position:absolute;right:12px;top:50%;width:7px;height:7px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:translateY(-70%) rotate(45deg)}
details.ms[open] summary::after{transform:translateY(-20%) rotate(225deg)}
details.ms summary .ph{color:var(--muted);font-size:14px}
.ms-pop{position:absolute;z-index:6;top:calc(100% + 4px);left:0;min-width:100%;background:var(--panel);border:1px solid var(--line);border-radius:6px;box-shadow:0 8px 24px rgb(0 0 0 / .14);padding:6px;display:flex;flex-direction:column}
.ms-pop label{flex-direction:row!important;align-items:center;gap:8px!important;padding:6px 8px;border-radius:4px;cursor:pointer;font-weight:400!important;white-space:nowrap}
.ms-pop label:hover{background:var(--accent-soft)}
.ms-pop input{width:auto!important;accent-color:var(--accent)}
.ms-pop .ms-foot{display:flex;justify-content:space-between;border-top:1px solid var(--line);margin-top:4px;padding:6px 8px 2px}

/* 策略總覽 */
.ov{max-width:1180px;margin:16px auto 0;display:flex;flex-direction:column;gap:16px}
.ov-sum{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:2px;cursor:pointer;text-align:left}
.stat:hover{border-color:var(--accent)}
.stat[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.stat .k{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:6px}
.stat .k i{width:8px;height:8px;border-radius:2px;display:block}
.stat .v{font:500 24px/1.2 var(--f-mono)}
.ov-bar{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between}
.ov-bar h2{font:700 20px/1.3 var(--f-display);margin:0}
.ov-bar .hint{font-size:13px}
.tbl-wrap{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);overflow-x:auto}
table.ovt{width:100%;border-collapse:collapse;min-width:980px;font-size:14px}
.ovt th{text-align:left;font-size:12px;font-weight:500;color:var(--muted);padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--bg)}
.ovt td{padding:12px;border-bottom:1px solid var(--line);vertical-align:top}
.ovt tr:last-child td{border-bottom:0}
.ovt tbody tr{cursor:pointer}
.ovt tbody tr:hover td{background:var(--accent-soft)}
.ovt .num{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.ovt .ttl{font-weight:500;line-height:1.45;max-width:30ch}
.ovt .code{font-family:var(--f-mono);font-size:12px;color:var(--muted);display:block}
.ovt .chips{display:flex;flex-wrap:wrap;gap:4px}
.ovt .sub{font-size:12px;color:var(--muted);margin-top:2px}
.ovt .entry-sum{font-size:13px;color:var(--muted);max-width:36ch;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pending-list{background:var(--panel);border:1px dashed var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.pending-list h3{font:600 15px/1.3 var(--f-display);margin:0}
.pending-list .rowp{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;font-size:14px}
.pending-list .rowp .linkbtn{font-size:13px;margin-left:auto}

/* GitHub 面板 */
.overlay{position:fixed;inset:0;background:rgb(0 0 0 / .35);display:flex;align-items:flex-start;justify-content:center;padding:max(40px,env(safe-area-inset-top,0px)) 16px 16px;z-index:10;overflow:auto}
.sheet{background:var(--panel);border:1px solid var(--line);border-radius:10px;width:100%;max-width:560px;padding:20px;display:flex;flex-direction:column;gap:14px}
.sheet h3{font:700 18px/1.3 var(--f-display);margin:0}
.log{font-family:var(--f-mono);font-size:12px;color:var(--muted);white-space:pre-wrap;min-height:1.5em}
.sample{font-size:11px;letter-spacing:.06em;color:var(--mid);border:1px solid var(--mid);border-radius:4px;padding:0 5px}
@media (max-width:520px){.entry{grid-template-columns:minmax(0,1fr)} .doc-head,.statement,.section,.sgrid,.strat-head{padding-inline:16px} .kv{grid-template-columns:minmax(0,1fr);gap:2px 0} .kv dd{margin-bottom:8px}}
@media (prefers-reduced-motion:no-preference){.item,.btn,.tab{transition:background .12s,border-color .12s,color .12s}}
</style>
</head>
<body>

<header class="top">
  <div class="brand">
    <h1>NQ 假設日誌</h1>
    <span class="tick">NQ 1 pt = $20 · MNQ 1 pt = $2 · 跳動 0.25 pt</span>
  </div>
  <nav class="views" role="tablist" aria-label="檢視">
    <button class="view" role="tab" data-view="hyp" aria-selected="true">假設</button>
    <button class="view" role="tab" data-view="overview" aria-selected="false">策略總覽</button>
  </nav>
  <div class="toolbar">
    <button class="btn primary" id="btnNew">＋ 新增假設</button>
    <button class="btn" id="btnGit">GitHub 同步</button>
    <button class="btn" id="btnExport">匯出 JSON</button>
    <label class="btn" for="fileImport" style="margin:0">匯入 JSON</label>
    <input type="file" id="fileImport" accept="application/json,.json" hidden>
  </div>
</header>
<div class="sync"><span class="dot" id="syncDot"></span><span id="syncText">尚未連線 GitHub，資料暫存在此瀏覽器</span></div>

<main id="mainHyp">
  <aside>
    <div class="search"><input id="q" type="search" placeholder="搜尋假設、標籤、內容…" aria-label="搜尋"></div>
    <div class="filters" id="filters"></div>
    <div class="list" id="list"></div>
  </aside>
  <section class="doc" id="doc"></section>
</main>
<section class="ov" id="overview" hidden></section>

<div class="overlay" id="gitOverlay" hidden>
  <div class="sheet" role="dialog" aria-labelledby="gitTitle">
    <h3 id="gitTitle">GitHub 同步設定</h3>
    <p class="hint" style="margin:0;font-size:13px">資料以一個 JSON 檔存在你的 repo。Token 請用 Fine-grained token，只給這個 repo 的 Contents 讀寫權限。設定只存在這台電腦的瀏覽器。</p>
    <div class="form plain">
      <label>擁有者 (owner)<input id="gOwner" placeholder="your-github-name"></label>
      <label>Repo 名稱<input id="gRepo" placeholder="nq-journal"></label>
      <label>分支<input id="gBranch" value="main"></label>
      <label>檔案路徑<input id="gPath" value="data/nq-hypotheses.json"></label>
      <label class="wide">Personal Access Token<input id="gToken" type="password" placeholder="github_pat_…" autocomplete="off"></label>
      <div class="actions">
        <button class="btn" id="gClose">關閉</button>
        <button class="btn" id="gPull">從 GitHub 下載</button>
        <button class="btn primary" id="gPush">上傳到 GitHub</button>
      </div>
    </div>
    <div class="log" id="gLog"></div>
  </div>
</div>

<script>
/* ---------- 常數 ---------- */
const STORE='nq-hyp-v1', GITCFG='nq-hyp-git';
const STATUS={pending:'待驗證',testing:'驗證中',hold:'成立',partial:'部分成立',reject:'不成立'};
const VERDICT={support:'支持',against:'反駁',neutral:'中性'};
const KIND={extend:'延伸想法',view:'看法'};
const TFS=['1K','5K','15K','30K','60K','日K'];
const SSTATUS={draft:'草稿',backtest:'回測中',paper:'模擬單',live:'實盤',off:'停用'};
const DIR={long:'只做多',short:'只做空',both:'多空皆做'};
const CONTRACT={NQ:20,MNQ:2};
const SESS={asia:'亞盤 18:00–03:00 ET',eu:'歐盤 03:00–09:30 ET',open:'美盤開盤 09:30–10:30 ET',mid:'美盤盤中 10:30–15:00 ET',close:'美盤尾盤 15:00–16:00 ET'};
const SESS_SHORT={asia:'亞盤',eu:'歐盤',open:'美開盤',mid:'美盤中',close:'美尾盤'};
const EVENTS={CPI:'CPI',FOMC:'FOMC',NFP:'非農 NFP',PCE:'PCE',EARN:'權值股財報',ROLL:'換月 / 季底'};

const uid=()=>Math.random().toString(36).slice(2,10);
const now=()=>new Date().toISOString();
const fmt=iso=>{if(!iso)return'—';const p=new Intl.DateTimeFormat('zh-TW',{timeZone:'Asia/Taipei',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false}).formatToParts(new Date(iso));const g=t=>p.find(x=>x.type===t)?.value;return`${g('year')}-${g('month')}-${g('day')} ${g('hour')}:${g('minute')}`};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today=()=>new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Taipei'}).format(new Date());
const tfSort=a=>TFS.filter(t=>(a||[]).includes(t));

/* ---------- 範例資料 ---------- */
function sample(){
  const t=(d,h)=>new Date(`2026-${d}T${h}:00+08:00`).toISOString();
  return {version:2,sample:true,items:[
    {id:uid(),code:'H-003',title:'開盤區間 (OR30) 突破後，當日延續機率高於回補',status:'testing',
     statement:'紐約開盤後 30 分鐘 (09:30–10:00 ET) 的高低點，若 10:00 後以 5K 實體收破，當日收盤仍在突破方向的比例 > 60%。',
     condition:'排除 FOMC、CPI、NFP 當日；OR30 寬度介於 ATR(14) 的 25%–60%。',
     tfs:['5K','日K'],tags:['開盤','突破','日內'],
     createdAt:t('09-08','22:10'),updatedAt:t('09-26','23:40'),
     verifies:[
       {id:uid(),date:'2026-09-24',verdict:'support',text:'OR30 高 24,812.50 / 低 24,701.25。10:15 收破高點，收盤 24,968，延續 +155 pt。',createdAt:t('09-25','06:20'),updatedAt:t('09-25','06:20')},
       {id:uid(),date:'2026-09-23',verdict:'against',text:'10:05 假突破上緣，10:40 跌回區間內，最終收在 OR 低點下方 38 pt。當天盤前有大型權值股財報。',createdAt:t('09-24','07:02'),updatedAt:t('09-24','21:15')},
       {id:uid(),date:'2026-09-19',verdict:'support',text:'四巫日。突破下緣後單邊走低，延續 −210 pt。',createdAt:t('09-20','10:30'),updatedAt:t('09-20','10:30')},
       {id:uid(),date:'2026-09-17',verdict:'neutral',text:'FOMC 當天，依條件應排除，僅記錄：突破後大幅雙向洗盤。',createdAt:t('09-18','08:11'),updatedAt:t('09-18','08:11')}
     ],
     notes:[{id:uid(),kind:'view',text:'反例多出現在盤前有權值股財報的日子，考慮把「前一晚/盤前有 Mag7 財報」加進排除條件。',createdAt:t('09-24','21:18'),updatedAt:t('09-24','21:18')}],
     strategy:{status:'backtest',htf:['60K','日K'],ltf:['5K'],tfNote:'日K 判斷前一日趨勢與關鍵價位；60K 確認突破方向沒有撞到上方壓力；5K 找進場。',
       dir:'both',entry:'10:00 ET 後，5K 實體收破 OR30 高/低點。\n等回測 OR 邊界不破（5K 下影/上影線觸及後收回）才進場。',
       takeProfit:'TP1 = 1 × OR 寬度，出一半部位。\n剩餘部位以 5K 前低/前高做移動停利。',
       stopLoss:'OR30 中線；若距離 > 40 pt 則放棄這筆。',
       contract:'MNQ',qty:4,scaleIn:'不加碼。',scaleOut:'TP1 出 2 口，其餘移動停利。',
       riskPts:30,dailyLoss:400,maxLosses:2,riskNote:'當日連虧 2 筆即停止交易。單筆風險不超過帳戶 1%。',
       sessions:['open','mid'],avoid:['CPI','FOMC','NFP','EARN'],maxHold:'不留倉，15:45 ET 前全部平倉。',timeNote:'11:30 ET 後不再開新倉。',
       createdAt:t('09-21','22:30'),updatedAt:t('09-26','23:40')}},
    {id:uid(),code:'H-002',title:'CPI 公布後首根 5K 的方向，常在 10:00 ET 前反轉',status:'pending',
     statement:'CPI 08:30 ET 公布後第一根 5K 的方向，在 10:00 前被完全回補的機率高於 50%。',
     condition:'只看 CPI 當日；以 08:30–08:35 K 棒實體方向判定。',
     tfs:['1K','5K'],tags:['總經','CPI','反轉'],
     createdAt:t('09-02','21:45'),updatedAt:t('09-02','21:45'),verifies:[],
     notes:[{id:uid(),kind:'view',text:'下一次 CPI 在 10 月，先回測過去 12 次樣本再決定要不要建立策略。',createdAt:t('09-02','21:50'),updatedAt:t('09-02','21:50')}],strategy:null},
    {id:uid(),code:'H-001',title:'亞盤跌破前日低點後，歐盤常回補',status:'reject',
     statement:'亞洲時段 (18:00–03:00 ET) 跌破前一交易日 RTH 低點，歐盤開盤前 2 小時內回到低點之上的比例 > 55%。',
     condition:'無重大事件的一般交易日。',tfs:['15K','60K'],tags:['夜盤','前日低點'],
     createdAt:t('08-11','23:02'),updatedAt:t('09-05','20:14'),
     verifies:[{id:uid(),date:'2026-09-03',verdict:'against',text:'統計 20 個樣本，只有 8 次回補 (40%)，低於假設門檻。',createdAt:t('09-05','20:10'),updatedAt:t('09-05','20:10')}],
     notes:[{id:uid(),kind:'extend',text:'結論不成立。反而跌破後延續的樣本較多，可以反過來當順勢訊號，另開新假設。',createdAt:t('09-05','20:14'),updatedAt:t('09-05','20:14')}],strategy:null}
  ]};
}
function migrate(d){
  (d.items||[]).forEach(h=>{
    if(!Array.isArray(h.tfs)){const s=(h.timeframe||'').toUpperCase();h.tfs=TFS.filter(t=>t==='日K'?/日|D/.test(s):new RegExp('\\b'+parseInt(t)+'\\s*(M|K|分)').test(s))}
    delete h.timeframe;h.verifies=h.verifies||[];h.notes=h.notes||[];
    h.notes.forEach(n=>{if(n.kind==='strategy')n.kind='extend'});
    if(h.strategy===undefined)h.strategy=null;
  });d.version=2;return d;
}

let db=migrate(load()), selId=db.items[0]?.id||null, filter='all', q='', editing=null, tab='hyp';
function load(){try{const s=localStorage.getItem(STORE);if(s)return JSON.parse(s)}catch(e){}return sample()}
function save(){db.savedAt=now();try{localStorage.setItem(STORE,JSON.stringify(db))}catch(e){}setSync('dirty','有變更尚未上傳到 GitHub')}
function setSync(state,text){document.getElementById('syncDot').className='dot '+(state||'');document.getElementById('syncText').textContent=text}
const cur=()=>db.items.find(x=>x.id===selId);
const touch=h=>h.updatedAt=now();
function nextCode(){const n=db.items.map(x=>parseInt((x.code||'').replace(/\D/g,''))||0);return'H-'+String(Math.max(0,...n)+1).padStart(3,'0')}

/* ---------- 複選下拉 ---------- */
function ms(id,opts,sel,ph,mono=true){
  sel=sel||[];const entries=Array.isArray(opts)?opts.map(o=>[o,o]):Object.entries(opts);
  return `<details class="ms" id="${id}" data-ph="${esc(ph)}" data-mono="${mono?1:''}"><summary>${msChips(entries.filter(([k])=>sel.includes(k)).map(e=>e[1]),ph,mono)}</summary>
  <div class="ms-pop">${entries.map(([k,v])=>`<label><input type="checkbox" value="${esc(k)}" ${sel.includes(k)?'checked':''}>${esc(v)}</label>`).join('')}
  <div class="ms-foot"><button type="button" class="linkbtn" data-ms="all">全選</button><button type="button" class="linkbtn" data-ms="none">清除</button></div></div></details>`;
}
function msChips(labels,ph,mono){return labels.length?labels.map(l=>`<span class="tf" ${mono?'':'style="font-family:var(--f-body)"'}>${esc(l)}</span>`).join(''):`<span class="ph">${esc(ph)}</span>`}
function msRefresh(d){const labs=[...d.querySelectorAll('input:checked')].map(i=>i.parentElement.textContent.trim());d.querySelector('summary').innerHTML=msChips(labs,d.dataset.ph,!!d.dataset.mono)}
const msVal=id=>[...document.querySelectorAll(`#${id} input:checked`)].map(i=>i.value);
document.addEventListener('change',e=>{const d=e.target.closest('details.ms');if(d)msRefresh(d)});
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-ms]');
  if(b){const d=b.closest('details.ms');d.querySelectorAll('input').forEach(i=>i.checked=b.dataset.ms==='all');msRefresh(d);return}
  document.querySelectorAll('details.ms[open]').forEach(d=>{if(!d.contains(e.target))d.open=false});
});

/* ---------- 左側列表 ---------- */
function renderFilters(){
  const c={all:db.items.length};Object.keys(STATUS).forEach(k=>c[k]=db.items.filter(x=>x.status===k).length);
  document.getElementById('filters').innerHTML=[['all','全部'],...Object.entries(STATUS)].map(([k,v])=>
    `<button class="chipbtn" data-f="${k}" aria-pressed="${filter===k}">${v} <span class="mono">${c[k]}</span></button>`).join('');
}
function renderList(){
  const qq=q.trim().toLowerCase();
  const items=db.items.filter(h=>(filter==='all'||h.status===filter)&&(!qq||JSON.stringify(h).toLowerCase().includes(qq)))
    .sort((a,b)=>b.updatedAt.localeCompare(a.updatedAt));
  const el=document.getElementById('list');
  if(!items.length){el.innerHTML=`<div class="empty">${db.items.length?'沒有符合的假設':'還沒有假設，按「新增假設」寫下第一個觀察'}</div>`;return}
  el.innerHTML=items.map(h=>`<button class="item ${h.id===selId?'sel':''}" data-id="${h.id}">
    <span class="code">${esc(h.code)}</span><span class="t">${esc(h.title)}</span>
    <span class="meta"><span class="status s-${h.status}">${STATUS[h.status]}</span>
    ${h.strategy?`<span class="status st-${h.strategy.status}">策略·${SSTATUS[h.strategy.status]}</span>`:''}
    <span>驗證 <span class="mono">${h.verifies.length}</span></span>
    ${tfSort(h.tfs).map(t=>`<span class="tf">${t}</span>`).join('')}</span></button>`).join('');
}

/* ---------- 右側本文 ---------- */
function renderDoc(){
  const el=document.getElementById('doc'), h=cur();
  if(editing?.type==='hyp'){el.innerHTML=hypForm(editing.id?h:null);return}
  if(!h){el.innerHTML='<div class="empty" style="padding:60px 20px">選一個假設，或新增一個</div>';return}
  el.innerHTML=`
  <div class="doc-head">
    <div class="row"><span class="mono" style="color:var(--muted)">${esc(h.code)}</span><span class="status s-${h.status}">${STATUS[h.status]}</span>${db.sample?'<span class="sample">範例資料</span>':''}
      <span style="margin-left:auto;display:flex;gap:8px"><button class="btn" data-act="editHyp">編輯假設</button><button class="btn danger" data-act="delHyp">刪除</button></span></div>
    <h2>${esc(h.title)}</h2>
    <div class="stamps mono"><span>建立<b>${fmt(h.createdAt)}</b></span><span>修改<b>${fmt(h.updatedAt)}</b></span></div>
    <div class="tfrow">觀察週期 ${tfSort(h.tfs).map(t=>`<span class="tf">${t}</span>`).join('')||'<span>未設定</span>'}</div>
    ${h.tags?.length?`<div class="tags">${h.tags.map(t=>`<span class="tag">#${esc(t)}</span>`).join('')}</div>`:''}
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" data-tab="hyp" aria-selected="${tab==='hyp'}">假設與驗證 <span class="n">${h.verifies.length}</span></button>
      <button class="tab" role="tab" data-tab="strat" aria-selected="${tab==='strat'}">策略 ${h.strategy?`<span class="status st-${h.strategy.status}">${SSTATUS[h.strategy.status]}</span>`:'<span class="n">未建立</span>'}</button>
    </div>
  </div>
  ${tab==='hyp'?hypTab(h):stratTab(h)}`;
}
function hypTab(h){
  const n={support:0,against:0,neutral:0};h.verifies.forEach(v=>n[v.verdict]++);const tot=h.verifies.length||1;
  return `
  <div class="statement">
    <div class="field claim"><div class="lbl">假設陳述</div><div class="val ${h.statement?'':'none'}">${esc(h.statement||'尚未填寫，按「編輯假設」補上可驗證的具體說法')}</div></div>
    <div class="field cond"><div class="lbl">適用條件 / 排除</div><div class="val ${h.condition?'':'none'}">${esc(h.condition||'尚未設定條件')}</div></div>
  </div>
  <div class="section">
    <div class="sec-head"><h3>驗證紀錄</h3>
      <div class="tally"><span style="color:var(--up)">支持 ${n.support}</span><span style="color:var(--down)">反駁 ${n.against}</span><span style="color:var(--mid)">中性 ${n.neutral}</span></div>
      <div class="bar" aria-hidden="true"><i style="width:${n.support/tot*100}%;background:var(--up)"></i><i style="width:${n.neutral/tot*100}%;background:var(--mid)"></i><i style="width:${n.against/tot*100}%;background:var(--down)"></i></div>
      <button class="btn" data-act="addV">＋ 新增驗證</button></div>
    ${editing?.type==='v'&&!editing.id?entryForm('v'):''}
    <div>${h.verifies.slice().sort((a,b)=>b.date.localeCompare(a.date)).map(v=>editing?.type==='v'&&editing.id===v.id?entryForm('v',v):`
      <div class="entry"><div class="when"><div class="d">${esc(v.date)}</div>行情日</div>
      <div class="body"><div class="top"><span class="verdict v-${v.verdict}">${VERDICT[v.verdict]}</span></div>
      <div class="txt">${esc(v.text)}</div>
      <div class="foot mono"><span>建立 ${fmt(v.createdAt)}</span><span>修改 ${fmt(v.updatedAt)}</span>
      <button class="linkbtn" data-act="editV" data-id="${v.id}">編輯</button><button class="linkbtn danger" data-act="delV" data-id="${v.id}">刪除</button></div></div></div>`).join('')||'<div class="hint" style="font-size:13px">還沒有驗證。每次盤後對照行情，記下一筆支持或反駁的證據。</div>'}</div>
  </div>
  <div class="section">
    <div class="sec-head"><h3>延伸想法與看法</h3><button class="btn" data-act="addN">＋ 新增</button></div>
    ${editing?.type==='n'&&!editing.id?entryForm('n'):''}
    <div>${h.notes.slice().sort((a,b)=>b.updatedAt.localeCompare(a.updatedAt)).map(v=>editing?.type==='n'&&editing.id===v.id?entryForm('n',v):`
      <div class="entry"><div class="when"><div class="d">${fmt(v.createdAt).slice(0,10)}</div>${fmt(v.createdAt).slice(11)}</div>
      <div class="body"><div class="top"><span class="kind">${KIND[v.kind]||'看法'}</span></div>
      <div class="txt">${esc(v.text)}</div>
      <div class="foot mono"><span>建立 ${fmt(v.createdAt)}</span><span>修改 ${fmt(v.updatedAt)}</span>
      <button class="linkbtn" data-act="editN" data-id="${v.id}">編輯</button><button class="linkbtn danger" data-act="delN" data-id="${v.id}">刪除</button></div></div></div>`).join('')||'<div class="hint" style="font-size:13px">記下這個假設的延伸方向，或你對它的看法。</div>'}</div>
  </div>`;
}

/* ---------- 策略分頁 ---------- */
const row=(k,v)=>`<dt>${k}</dt><dd>${v}</dd>`;
const txt=s=>s?esc(s):'<span class="none">未填寫</span>';
const num=(s,u)=>s||s===0?`<span class="mono">${esc(s)}</span> ${u}`:'<span class="none">未填寫</span>';
const chips=(arr,map,mono=true)=>arr?.length?`<span class="chips">${arr.map(k=>`<span class="tf" ${mono?'':'style="font-family:var(--f-body)"'}>${esc(map?map[k]:k)}</span>`).join('')}</span>`:'<span class="none">未選擇</span>';
function riskCalc(s){
  const m=CONTRACT[s.contract]||0,pts=+s.riskPts,q=+s.qty;
  if(!pts||!q)return'';
  const per=pts*m*q, lim=+s.dailyLoss, n=lim?Math.floor(lim/per):null;
  return `<div class="calc">單筆最大虧損 <b>$${per.toLocaleString()}</b>　= ${pts} pt × $${m} × ${q} 口 ${esc(s.contract)}${n!==null?`<br>每日上限 $${lim.toLocaleString()} 約可承受 <b>${n}</b> 筆全額停損`:''}</div>`;
}
function stratTab(h){
  const s=h.strategy;
  if(editing?.type==='strat')return stratForm(h,s);
  if(!s)return `<div class="strat-empty"><p>這個假設還沒有策略。當驗證結果足夠支持假設時，把它轉成可執行的交易規則。</p><button class="btn primary" data-act="editStrat">建立策略</button></div>`;
  return `
  <div class="strat-head"><h3>交易策略</h3><span class="status st-${s.status}">${SSTATUS[s.status]}</span>
    <span class="stamps mono"><span>建立<b>${fmt(s.createdAt)}</b></span><span>修改<b>${fmt(s.updatedAt)}</b></span></span>
    <span class="acts"><button class="btn" data-act="editStrat">編輯策略</button><button class="btn danger" data-act="delStrat">刪除策略</button></span></div>
  <div class="sgrid">
    <div class="field f-tf"><div class="lbl">大小週期</div><dl class="kv">
      ${row('大週期',chips(tfSort(s.htf)))}${row('小週期',chips(tfSort(s.ltf)))}${row('說明',txt(s.tfNote))}</dl></div>
    <div class="field f-time"><div class="lbl">時間</div><dl class="kv">
      ${row('交易時段',chips(Object.keys(SESS).filter(k=>s.sessions?.includes(k)),SESS,false))}
      ${row('避開事件',chips(s.avoid,EVENTS,false))}${row('持倉時間',txt(s.maxHold))}${row('其他',txt(s.timeNote))}</dl></div>
    <div class="field f-io span"><div class="lbl">進出場<span class="sub dir ${s.dir}">${DIR[s.dir]||''}</span></div><dl class="kv">
      ${row('進場條件',txt(s.entry))}${row('停利出場',txt(s.takeProfit))}${row('停損出場',txt(s.stopLoss))}</dl></div>
    <div class="field f-pos"><div class="lbl">部位</div><dl class="kv">
      ${row('合約',s.contract?`<span class="mono">${esc(s.contract)}</span>（1 pt = $${CONTRACT[s.contract]}）`:'<span class="none">未選擇</span>')}
      ${row('口數',num(s.qty,'口'))}${row('加碼',txt(s.scaleIn))}${row('減碼',txt(s.scaleOut))}</dl></div>
    <div class="field f-risk"><div class="lbl">風控</div><dl class="kv">
      ${row('單筆停損',num(s.riskPts,'pt'))}${row('每日虧損上限',s.dailyLoss?`<span class="mono">$${(+s.dailyLoss).toLocaleString()}</span>`:'<span class="none">未填寫</span>')}
      ${row('連虧停止',num(s.maxLosses,'筆'))}${row('其他規則',txt(s.riskNote))}</dl>${riskCalc(s)}</div>
  </div>`;
}
function stratForm(h,s){
  s=s||{status:'draft',htf:[],ltf:tfSort(h.tfs),dir:'both',contract:'MNQ',qty:1,sessions:[],avoid:[]};
  const ta=(id,v,ph,rows=3)=>`<textarea id="${id}" style="min-height:${rows*26}px" placeholder="${esc(ph)}">${esc(v)}</textarea>`;
  return `<div class="section"><div class="sec-head"><h3>${h.strategy?'編輯策略':'建立策略'}</h3></div>
  <form class="form plain" id="stratForm">
    <label>策略狀態<select id="sStatus">${Object.entries(SSTATUS).map(([k,v])=>`<option value="${k}" ${s.status===k?'selected':''}>${v}</option>`).join('')}</select></label>
    <fieldset class="grp c-tf"><legend>大小週期</legend><div class="in">
      <div class="lab">大週期（看方向）${ms('sHtf',TFS,s.htf,'選擇週期')}</div>
      <div class="lab">小週期（找進場）${ms('sLtf',TFS,s.ltf,'選擇週期')}</div>
      <label class="wide">週期說明${ta('sTfNote',s.tfNote,'各週期分別用來判斷什麼',2)}</label></div></fieldset>
    <fieldset class="grp c-io"><legend>進出場</legend><div class="in">
      <label>方向<select id="sDir">${Object.entries(DIR).map(([k,v])=>`<option value="${k}" ${s.dir===k?'selected':''}>${v}</option>`).join('')}</select></label>
      <label class="wide">進場條件${ta('sEntry',s.entry,'觸發條件、確認訊號、進場價位')}</label>
      <label>停利出場${ta('sTp',s.takeProfit,'目標價、分批出場方式')}</label>
      <label>停損出場${ta('sSl',s.stopLoss,'停損位置與依據')}</label></div></fieldset>
    <fieldset class="grp c-pos"><legend>部位</legend><div class="in">
      <label>合約<select id="sContract">${Object.keys(CONTRACT).map(k=>`<option value="${k}" ${s.contract===k?'selected':''}>${k}（1 pt = $${CONTRACT[k]}）</option>`).join('')}</select></label>
      <label>口數<input id="sQty" type="number" min="0" step="1" value="${esc(s.qty)}"></label>
      <label>加碼規則${ta('sIn',s.scaleIn,'何時加碼、加多少',2)}</label>
      <label>減碼規則${ta('sOut',s.scaleOut,'何時減碼、減多少',2)}</label></div></fieldset>
    <fieldset class="grp c-risk"><legend>風控</legend><div class="in">
      <label>單筆停損 (pt)<input id="sRisk" type="number" min="0" step="0.25" value="${esc(s.riskPts)}"></label>
      <label>每日虧損上限 ($)<input id="sDaily" type="number" min="0" step="50" value="${esc(s.dailyLoss)}"></label>
      <label>連虧幾筆停止<input id="sMaxL" type="number" min="0" step="1" value="${esc(s.maxLosses)}"></label>
      <label class="wide">其他風控規則${ta('sRiskNote',s.riskNote,'帳戶風險比例、回撤處理…',2)}</label></div></fieldset>
    <fieldset class="grp c-time"><legend>時間</legend><div class="in">
      <div class="lab">交易時段${ms('sSess',SESS,s.sessions,'選擇時段',false)}</div>
      <div class="lab">避開事件${ms('sAvoid',EVENTS,s.avoid,'選擇事件',false)}</div>
      <label>持倉時間${ta('sHold',s.maxHold,'最長持倉、是否留倉',2)}</label>
      <label>其他時間規則${ta('sTimeNote',s.timeNote,'幾點後不開新倉…',2)}</label></div></fieldset>
    <div class="actions"><button type="button" class="btn" data-act="cancel">取消</button><button type="submit" class="btn primary">儲存策略</button></div>
  </form></div>`;
}

/* ---------- 假設 / 條目表單 ---------- */
function hypForm(h){
  h=h||{code:nextCode(),title:'',statement:'',condition:'',tfs:[],tags:[],status:'pending'};
  return `<div class="section"><div class="sec-head"><h3>${h.id?'編輯假設':'新增假設'}</h3></div>
  <form class="form plain" id="hypForm">
    <label>編號<input id="fCode" value="${esc(h.code)}"></label>
    <label>狀態<select id="fStatus">${Object.entries(STATUS).map(([k,v])=>`<option value="${k}" ${h.status===k?'selected':''}>${v}</option>`).join('')}</select></label>
    <div class="lab">觀察週期（可複選）${ms('fTfs',TFS,h.tfs,'選擇週期')}</div>
    <label class="wide">標題<input id="fTitle" required value="${esc(h.title)}" placeholder="一句話寫下你的假設"></label>
    <label class="wide">假設陳述<textarea id="fStmt" placeholder="可被驗證的具體說法：什麼條件下、會發生什麼、機率或幅度多少">${esc(h.statement)}</textarea></label>
    <label class="wide">適用條件 / 排除<textarea id="fCond" style="min-height:60px">${esc(h.condition)}</textarea></label>
    <label class="wide">標籤（用逗號分隔）<input id="fTags" value="${esc((h.tags||[]).join(', '))}" placeholder="開盤, 突破"></label>
    <div class="actions"><button type="button" class="btn" data-act="cancel">取消</button><button type="submit" class="btn primary">儲存</button></div>
  </form></div>`;
}
function entryForm(t,v){
  v=v||{date:today(),verdict:'support',kind:'view',text:''};
  return `<form class="form" id="entryForm" data-t="${t}">
    ${t==='v'?`<label>行情日<input id="eDate" type="date" value="${esc(v.date)}"></label>
      <label>結果<select id="eVerdict">${Object.entries(VERDICT).map(([k,x])=>`<option value="${k}" ${v.verdict===k?'selected':''}>${x}</option>`).join('')}</select></label>`
    :`<label>類型<select id="eKind">${Object.entries(KIND).map(([k,x])=>`<option value="${k}" ${v.kind===k?'selected':''}>${x}</option>`).join('')}</select></label>`}
    <label class="wide">內容<textarea id="eText" required placeholder="${t==='v'?'價位、時間、走勢，以及為什麼算支持或反駁':'延伸方向或你的看法'}">${esc(v.text)}</textarea></label>
    <div class="actions"><button type="button" class="btn" data-act="cancel">取消</button><button type="submit" class="btn primary">儲存</button></div>
  </form>`;
}
function render(){renderFilters();renderList();renderDoc();renderOverview()}

/* ---------- 策略總覽 ---------- */
let view='hyp', sFilter='all';
const SORDER=['live','paper','backtest','draft','off'];
const SCOLOR={draft:'var(--muted)',backtest:'var(--mid)',paper:'var(--teal)',live:'var(--up)',off:'var(--down)'};
function renderOverview(){
  const el=document.getElementById('overview');if(view!=='overview')return;
  const withS=db.items.filter(h=>h.strategy), without=db.items.filter(h=>!h.strategy);
  const cnt={};SORDER.forEach(k=>cnt[k]=withS.filter(h=>h.strategy.status===k).length);
  const rows=withS.filter(h=>sFilter==='all'||h.strategy.status===sFilter)
    .sort((a,b)=>SORDER.indexOf(a.strategy.status)-SORDER.indexOf(b.strategy.status)||b.strategy.updatedAt.localeCompare(a.strategy.updatedAt));
  const dash='<span class="none">—</span>';
  const tr=h=>{const s=h.strategy,m=CONTRACT[s.contract]||0,risk=(+s.riskPts&&+s.qty)?s.riskPts*m*s.qty:null;
    const sup=h.verifies.filter(v=>v.verdict==='support').length, tot=h.verifies.length;
    return `<tr tabindex="0" data-go="${h.id}">
      <td><span class="code">${esc(h.code)}</span><div class="ttl">${esc(h.title)}</div><div class="sub"><span class="status s-${h.status}">假設·${STATUS[h.status]}</span></div></td>
      <td><span class="status st-${s.status}">${SSTATUS[s.status]}</span></td>
      <td><span class="dir ${s.dir}">${DIR[s.dir]||''}</span></td>
      <td><div class="chips">${tfSort(s.htf).map(t=>`<span class="tf">${t}</span>`).join('')||dash}</div><div class="sub">↓</div><div class="chips">${tfSort(s.ltf).map(t=>`<span class="tf">${t}</span>`).join('')||dash}</div></td>
      <td><div class="chips">${Object.keys(SESS).filter(k=>s.sessions?.includes(k)).map(k=>`<span class="tf" style="font-family:var(--f-body)">${SESS_SHORT[k]}</span>`).join('')||dash}</div>${s.avoid?.length?`<div class="sub">避開 ${s.avoid.map(k=>EVENTS[k]).join('、')}</div>`:''}</td>
      <td><div class="entry-sum">${s.entry?esc(s.entry):dash}</div></td>
      <td class="num">${s.qty!==''&&s.qty!=null?`${s.qty} 口 ${esc(s.contract)}`:'—'}</td>
      <td class="num">${s.riskPts!==''&&s.riskPts!=null?`${s.riskPts} pt`:'—'}${risk!==null?`<div class="sub">$${risk.toLocaleString()}</div>`:''}</td>
      <td class="num">${s.dailyLoss?`$${(+s.dailyLoss).toLocaleString()}`:'—'}${s.maxLosses?`<div class="sub">連虧 ${s.maxLosses} 停</div>`:''}</td>
      <td class="num">${tot?`${sup}/${tot}`:'—'}<div class="sub">支持/總數</div></td>
      <td class="num" style="font-size:12px">${fmt(s.updatedAt)}</td></tr>`};
  el.innerHTML=`
  <div class="ov-bar"><h2>策略總覽</h2><span class="hint">共 ${withS.length} 個策略 · 點任一列開啟策略細節</span></div>
  <div class="ov-sum">
    <button class="stat" data-sf="all" aria-pressed="${sFilter==='all'}"><span class="k">全部策略</span><span class="v">${withS.length}</span></button>
    ${SORDER.map(k=>`<button class="stat" data-sf="${k}" aria-pressed="${sFilter===k}"><span class="k"><i style="background:${SCOLOR[k]}"></i>${SSTATUS[k]}</span><span class="v">${cnt[k]}</span></button>`).join('')}
  </div>
  <div class="tbl-wrap">${rows.length?`<table class="ovt"><thead><tr>
    <th>假設</th><th>策略狀態</th><th>方向</th><th>大 → 小週期</th><th>交易時段</th><th>進場條件</th>
    <th class="num">部位</th><th class="num">單筆停損</th><th class="num">每日上限</th><th class="num">驗證</th><th class="num">策略修改</th></tr></thead>
    <tbody>${rows.map(tr).join('')}</tbody></table>`
    :`<div class="empty">${withS.length?'這個狀態下沒有策略':'還沒有任何策略。到假設的「策略」分頁建立第一個。'}</div>`}</div>
  ${without.length?`<div class="pending-list"><h3>尚未建立策略的假設（${without.length}）</h3>
    ${without.sort((a,b)=>(['hold','partial'].includes(b.status)-['hold','partial'].includes(a.status))||b.updatedAt.localeCompare(a.updatedAt)).map(h=>`<div class="rowp">
      <span class="mono" style="color:var(--muted);font-size:12px">${esc(h.code)}</span><span>${esc(h.title)}</span><span class="status s-${h.status}">${STATUS[h.status]}</span>
      <button class="linkbtn" data-mk="${h.id}">建立策略 →</button></div>`).join('')}</div>`:''}`;
}
function setView(v){
  view=v;document.querySelectorAll('.view').forEach(b=>b.setAttribute('aria-selected',b.dataset.view===v));
  document.getElementById('mainHyp').hidden=v!=='hyp';document.getElementById('overview').hidden=v!=='overview';
  render();
}
function openStrategy(id,edit){selId=id;tab='strat';editing=edit?{type:'strat'}:null;filter='all';setView('hyp');window.scrollTo(0,0)}
document.querySelector('.views').onclick=e=>{const b=e.target.closest('[data-view]');if(b)setView(b.dataset.view)};
document.getElementById('overview').addEventListener('click',e=>{
  const f=e.target.closest('[data-sf]');if(f){sFilter=f.dataset.sf;renderOverview();return}
  const m=e.target.closest('[data-mk]');if(m){openStrategy(m.dataset.mk,true);return}
  const r=e.target.closest('[data-go]');if(r)openStrategy(r.dataset.go);
});
document.getElementById('overview').addEventListener('keydown',e=>{const r=e.target.closest('[data-go]');if(r&&(e.key==='Enter'||e.key===' ')){e.preventDefault();openStrategy(r.dataset.go)}});

/* ---------- 事件 ---------- */
document.getElementById('filters').onclick=e=>{const b=e.target.closest('[data-f]');if(b){filter=b.dataset.f;render()}};
document.getElementById('list').onclick=e=>{const b=e.target.closest('[data-id]');if(b){selId=b.dataset.id;editing=null;render()}};
document.getElementById('q').oninput=e=>{q=e.target.value;renderList()};
document.getElementById('btnNew').onclick=()=>{editing={type:'hyp'};tab='hyp';setView('hyp');document.getElementById('fTitle')?.focus()};
let armed=null;
document.getElementById('doc').addEventListener('click',e=>{
  const tb=e.target.closest('[data-tab]');if(tb){tab=tb.dataset.tab;editing=null;renderDoc();return}
  const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act,h=cur(),id=b.dataset.id;
  const confirmDel=()=>{if(armed===b){armed=null;return true}armed=b;b.classList.add('armed');const o=b.textContent;b.textContent='再按一次確認';setTimeout(()=>{if(armed===b){armed=null;b.classList.remove('armed');b.textContent=o}},3000);return false};
  if(a==='cancel'){editing=null;renderDoc()}
  if(a==='editHyp'){editing={type:'hyp',id:h.id};renderDoc()}
  if(a==='delHyp'&&confirmDel()){db.items=db.items.filter(x=>x!==h);selId=db.items[0]?.id||null;save();render()}
  if(a==='addV'||a==='addN'){editing={type:a==='addV'?'v':'n'};renderDoc();document.getElementById('eText').focus()}
  if(a==='editV'){editing={type:'v',id};renderDoc()}
  if(a==='editN'){editing={type:'n',id};renderDoc()}
  if(a==='delV'&&confirmDel()){h.verifies=h.verifies.filter(x=>x.id!==id);touch(h);save();render()}
  if(a==='delN'&&confirmDel()){h.notes=h.notes.filter(x=>x.id!==id);touch(h);save();render()}
  if(a==='editStrat'){editing={type:'strat'};renderDoc()}
  if(a==='delStrat'&&confirmDel()){h.strategy=null;touch(h);save();render()}
});
document.getElementById('doc').addEventListener('submit',e=>{
  e.preventDefault();const f=e.target,val=id=>(document.getElementById(id)?.value??'').trim(),h0=cur();
  if(f.id==='hypForm'){
    if(!val('fTitle'))return;
    let h=editing.id?h0:null;
    if(!h){h={id:uid(),createdAt:now(),verifies:[],notes:[],strategy:null};db.items.unshift(h);selId=h.id}
    Object.assign(h,{code:val('fCode'),status:val('fStatus'),tfs:msVal('fTfs'),title:val('fTitle'),statement:val('fStmt'),condition:val('fCond'),tags:val('fTags').split(/[,，]/).map(s=>s.trim()).filter(Boolean)});
    touch(h);
  }else if(f.id==='stratForm'){
    const s=h0.strategy||{createdAt:now()};const n=id=>val(id)===''?'':+val(id);
    Object.assign(s,{status:val('sStatus'),htf:msVal('sHtf'),ltf:msVal('sLtf'),tfNote:val('sTfNote'),dir:val('sDir'),entry:val('sEntry'),takeProfit:val('sTp'),stopLoss:val('sSl'),
      contract:val('sContract'),qty:n('sQty'),scaleIn:val('sIn'),scaleOut:val('sOut'),riskPts:n('sRisk'),dailyLoss:n('sDaily'),maxLosses:n('sMaxL'),riskNote:val('sRiskNote'),
      sessions:msVal('sSess'),avoid:msVal('sAvoid'),maxHold:val('sHold'),timeNote:val('sTimeNote'),updatedAt:now()});
    h0.strategy=s;touch(h0);
  }else{
    const t=f.dataset.t,list=t==='v'?h0.verifies:h0.notes;if(!val('eText'))return;
    let en=editing.id?list.find(x=>x.id===editing.id):null;
    if(!en){en={id:uid(),createdAt:now()};list.push(en)}
    en.text=val('eText');if(t==='v'){en.date=val('eDate');en.verdict=val('eVerdict')}else en.kind=val('eKind');
    en.updatedAt=now();touch(h0);
  }
  delete db.sample;editing=null;save();render();
});

/* ---------- 本機匯出 / 匯入 ---------- */
document.getElementById('btnExport').onclick=()=>{
  const blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`nq-hypotheses-${today()}.json`;a.click();
};
document.getElementById('fileImport').onchange=async e=>{
  const f=e.target.files[0];if(!f)return;
  try{const d=JSON.parse(await f.text());if(!Array.isArray(d.items))throw 0;db=migrate(d);selId=db.items[0]?.id||null;save();render();setSync('dirty',`已匯入 ${f.name}，尚未上傳到 GitHub`)}
  catch{setSync('err','匯入失敗：這不是本工具匯出的 JSON 檔')}
  e.target.value='';
};

/* ---------- GitHub 同步 (Contents API) ---------- */
const $=id=>document.getElementById(id);
const gFields=['gOwner','gRepo','gBranch','gPath','gToken'];
function loadCfg(){try{const c=JSON.parse(localStorage.getItem(GITCFG)||'{}');gFields.forEach(k=>{if(c[k])$(k).value=c[k]})}catch(e){}}
function saveCfg(){const c={};gFields.forEach(k=>c[k]=$(k).value.trim());try{localStorage.setItem(GITCFG,JSON.stringify(c))}catch(e){}return c}
const b64enc=s=>{const b=new TextEncoder().encode(s);let r='';for(let i=0;i<b.length;i+=0x8000)r+=String.fromCharCode(...b.subarray(i,i+0x8000));return btoa(r)};
const b64dec=s=>new TextDecoder().decode(Uint8Array.from(atob(s.replace(/\n/g,'')),c=>c.charCodeAt(0)));
function api(c,method='GET',body){
  const url=`https://api.github.com/repos/${encodeURIComponent(c.gOwner)}/${encodeURIComponent(c.gRepo)}/contents/${c.gPath.split('/').map(encodeURIComponent).join('/')}`+(method==='GET'?`?ref=${encodeURIComponent(c.gBranch)}`:'');
  return fetch(url,{method,headers:{Authorization:`Bearer ${c.gToken}`,Accept:'application/vnd.github+json'},body:body&&JSON.stringify(body)});
}
const glog=t=>$('gLog').textContent=t;
function need(c){if(!c.gOwner||!c.gRepo||!c.gToken){glog('請填寫擁有者、Repo 名稱與 Token。');return false}return true}
$('btnGit').onclick=()=>{loadCfg();$('gitOverlay').hidden=false;$('gOwner').focus()};
$('gClose').onclick=()=>$('gitOverlay').hidden=true;
$('gitOverlay').onclick=e=>{if(e.target.id==='gitOverlay')$('gitOverlay').hidden=true};
$('gPull').onclick=async()=>{
  const c=saveCfg();if(!need(c))return;glog('下載中…');
  try{const r=await api(c);if(r.status===404){glog('Repo 裡還沒有這個檔案，先按「上傳到 GitHub」建立。');return}
    if(!r.ok)throw new Error(`${r.status} ${(await r.json()).message||''}`);
    const j=await r.json();db=migrate(JSON.parse(b64dec(j.content)));selId=db.items[0]?.id||null;editing=null;
    try{localStorage.setItem(STORE,JSON.stringify(db))}catch(e){}render();
    glog(`已下載 ${db.items.length} 個假設。`);setSync('ok',`已與 GitHub 同步 · ${fmt(now())}`);
  }catch(err){glog('下載失敗：'+err.message+'\n請確認 repo、分支、路徑與 Token 權限。');setSync('err','GitHub 下載失敗')}
};
$('gPush').onclick=async()=>{
  const c=saveCfg();if(!need(c))return;glog('上傳中…');
  try{let sha;const g=await api(c);if(g.ok)sha=(await g.json()).sha;else if(g.status!==404)throw new Error(`${g.status} ${(await g.json()).message||''}`);
    const r=await api(c,'PUT',{message:`更新 NQ 假設日誌 ${fmt(now())}`,content:b64enc(JSON.stringify(db,null,2)),branch:c.gBranch,sha});
    if(!r.ok)throw new Error(`${r.status} ${(await r.json()).message||''}`);
    glog(`已上傳到 ${c.gOwner}/${c.gRepo}/${c.gPath}`);setSync('ok',`已與 GitHub 同步 · ${fmt(now())}`);
  }catch(err){glog('上傳失敗：'+err.message+'\n請確認 Token 有 Contents 寫入權限。');setSync('err','GitHub 上傳失敗')}
};
document.addEventListener('keydown',e=>{if(e.key==='Escape'){$('gitOverlay').hidden=true;document.querySelectorAll('details.ms[open]').forEach(d=>d.open=false)}});

render();
</script>
