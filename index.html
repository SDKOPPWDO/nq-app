<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NQ 交易筆記</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
/* 版面：左側頁面清單 / 右側 Notion 風格區塊編輯器 */
:root{
  --bg:#191919;--side:#202020;--panel:#252525;--hover:#2c2c2c;--line:#2f2f2f;--line2:#3d3d3d;
  --ink:#e6e6e3;--ink2:#c4c4c0;--muted:#9b9b97;--faint:#62625f;--accent:#5e9de6;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:16px/1.6 var(--f-body);display:flex;overflow:hidden}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
code{font-family:var(--f-mono);font-size:.86em;background:rgb(135 131 120 / .18);color:#eb8a7f;padding:.1em .35em;border-radius:4px}
a{color:var(--accent)}

/* 顏色（文字 / 背景），Notion 深色系 */
.tc-gray{color:#a3a39f}.tc-brown{color:#c59a84}.tc-orange{color:#e3975c}.tc-yellow{color:#dcb35e}.tc-green{color:#5fbb87}
.tc-blue{color:#6fa6ea}.tc-purple{color:#b386e2}.tc-pink{color:#e47cb0}.tc-red{color:#ec716d}
.bg-gray{background:#2f2f2f}.bg-brown{background:#3b2b23}.bg-orange{background:#45301f}.bg-yellow{background:#433822}.bg-green{background:#1e3729}
.bg-blue{background:#1a3045}.bg-purple{background:#322747}.bg-pink{background:#412737}.bg-red{background:#472523}
.tx span[class*="bg-"]{border-radius:3px;padding:0 2px}

/* 側欄 */
#side{width:258px;flex:none;background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;z-index:20}
.sh{display:flex;align-items:center;gap:8px;padding:14px 14px 8px}
.sh b{font-size:14px;font-weight:700;letter-spacing:.02em}
.sh .x{margin-left:auto}
#search{margin:4px 10px 8px;background:var(--panel);border:1px solid var(--line2);border-radius:6px;padding:5px 9px;font-size:13.5px;outline:none}
#search:focus{border-color:var(--accent)}
#plist{flex:1;overflow:auto;padding:2px 6px 10px;min-height:0}
.pi{display:flex;align-items:center;gap:8px;padding:4px 8px;border-radius:6px;cursor:pointer;font-size:14px;color:var(--ink2)}
.pi:hover{background:var(--hover)}
.pi.on{background:#2f2f2f;color:var(--ink);font-weight:500}
.pi .pic{width:20px;text-align:center;flex:none}
.pi .pt{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pi .pdel{border:0;background:none;color:var(--faint);cursor:pointer;opacity:0;padding:0 4px;font-size:16px;line-height:1}
.pi:hover .pdel{opacity:1}.pi .pdel:hover{color:#ec716d}
.pempty{padding:10px;color:var(--faint);font-size:13px}
.sfoot{border-top:1px solid var(--line);padding:8px 8px 12px;display:flex;flex-direction:column;gap:2px}
.sbtn{border:0;background:none;text-align:left;padding:6px 8px;border-radius:6px;cursor:pointer;color:var(--muted);font-size:14px;display:flex;gap:8px;align-items:center}
.sbtn:hover{background:var(--hover);color:var(--ink)}

/* 主區 */
#main{flex:1;min-width:0;display:flex;flex-direction:column;min-height:0}
header.top{flex:none;height:46px;display:flex;align-items:center;gap:8px;padding:0 12px;border-bottom:1px solid var(--line)}
#crumb{font-size:14px;color:var(--ink2);overflow:hidden;white-space:nowrap;text-overflow:ellipsis;min-width:0;flex:1}
.tools{display:flex;gap:4px;align-items:center;flex-wrap:nowrap}
.btn{border:0;background:none;border-radius:6px;padding:4px 9px;cursor:pointer;font-size:13.5px;color:var(--ink2);white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.btn:hover{background:var(--hover);color:var(--ink)}
.btn.primary{background:var(--accent);color:#0b1626;font-weight:500}
.sync{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);white-space:nowrap;margin-left:6px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--faint)}
.dot.ok{background:#5fbb87}.dot.dirty{background:#dcb35e}.dot.err{background:#ec716d}
#menuBtn{display:none}
#scroll{flex:1;overflow:auto;min-height:0}
.page{max-width:none;margin:0;padding:48px 40px 40vh 72px}

/* 頁面標頭 */
.phead{margin-bottom:10px}
#picon{font-size:66px;line-height:1.1;border:0;background:none;padding:4px;border-radius:8px;cursor:pointer;margin-left:-4px}
#picon:hover{background:var(--hover)}
#picon.none{display:none}
.phbtns{display:flex;gap:4px;margin:6px 0 4px -8px;opacity:0;transition:opacity .15s}
.phead:hover .phbtns{opacity:1}
#ptitle{font-size:40px;font-weight:700;line-height:1.2;outline:none;margin:6px 0 4px;overflow-wrap:anywhere}
#ptitle:empty::before{content:attr(data-ph);color:var(--faint)}
#pmeta{font-size:12.5px;color:var(--faint);margin-bottom:22px}

/* 區塊 */
#blocks{position:relative}
.blk{position:relative;display:flex;margin-left:calc(var(--ind,0)*26px);padding:1px 0}
.blk.hid{display:none}
.gut{position:absolute;left:-50px;top:4px;display:flex;gap:1px;opacity:0;transition:opacity .1s}
.blk:hover>.gut,.blk.menu>.gut{opacity:1}
.gut button{width:23px;height:24px;border:0;background:none;color:var(--faint);border-radius:4px;cursor:pointer;padding:0;font-size:16px;line-height:1;display:grid;place-items:center}
.gut button:hover{background:var(--hover);color:var(--ink2)}
.gut [data-hd]{cursor:grab;font-size:13px;letter-spacing:-2px}
.bc{flex:1;min-width:0;display:flex;align-items:flex-start;gap:6px;padding:3px 4px;border-radius:5px}
.tx{flex:1;min-width:0;outline:none;white-space:pre-wrap;overflow-wrap:anywhere;min-height:1.6em;caret-color:var(--ink)}
.tx:empty::before{content:attr(data-ph);color:var(--faint);pointer-events:none}
.t-p .tx:empty:not(:focus)::before{content:""}
.t-h1{margin-top:1.3em}.t-h2{margin-top:1.05em}.t-h3{margin-top:.75em}
.t-h1 .tx{font-size:30px;font-weight:700;line-height:1.3}
.t-h2 .tx{font-size:24px;font-weight:700;line-height:1.35}
.t-h3 .tx{font-size:19.5px;font-weight:700;line-height:1.4}
.t-h1 .gut{top:12px}.t-h2 .gut{top:9px}.t-h3 .gut{top:6px}
.pre{flex:none;min-width:22px;text-align:center;user-select:none}
.dot2{font-size:20px;line-height:1.25}
.no{font-variant-numeric:tabular-nums;min-width:24px;text-align:right;padding-right:2px}
.chk{width:17px;height:17px;min-width:17px;margin:4px 3px 0 3px;border:1.5px solid var(--muted);border-radius:3px;background:none;cursor:pointer;padding:0;color:#fff;font-size:12px;line-height:1;display:grid;place-items:center}
.chk.on{background:var(--accent);border-color:var(--accent)}
.done .tx{text-decoration:line-through;color:var(--faint)}
.tgl{border:0;background:none;cursor:pointer;color:var(--ink2);font-size:11px;padding:0;height:25px;border-radius:4px;transition:transform .12s}
.tgl:hover{background:var(--hover)}
.tgl.open{transform:rotate(90deg)}
.t-quote .bc{border-left:3px solid currentColor;border-radius:0;padding-left:14px;margin-left:2px}
.t-quote .tx{font-size:17px}
.t-callout .bc{padding:14px 16px 14px 12px;gap:10px;border:1px solid rgb(255 255 255 / .05);margin:3px 0}
.emo{border:0;background:none;font-size:20px;line-height:1.3;padding:0 2px;border-radius:4px;cursor:pointer}
.emo:hover{background:rgb(255 255 255 / .08)}
.t-divider .bc{padding:10px 4px;cursor:pointer}
.t-divider hr{border:0;border-top:1px solid var(--line2);margin:0;width:100%}
.t-divider.sel .bc{background:rgb(94 157 230 / .18)}
#tail{min-height:120px;cursor:text}
#dropLine{position:absolute;left:0;right:0;height:3px;background:var(--accent);border-radius:2px;pointer-events:none;opacity:.8}
.blk.dragging{opacity:.35}

/* 浮動選單 */
.pop{position:fixed;z-index:50;background:var(--panel);border:1px solid var(--line2);border-radius:9px;box-shadow:0 12px 36px rgb(0 0 0 / .55);padding:6px}
.pop .mh{font-size:11.5px;color:var(--muted);padding:6px 8px 4px;font-weight:500}
#slash{width:250px;max-height:340px;overflow:auto}
#slash button,.bmt button{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;border-radius:5px;padding:5px 8px;cursor:pointer;text-align:left;font-size:14px}
#slash button.on,#slash button:hover,.bmt button:hover,.bma button:hover{background:var(--hover)}
.si{width:28px;height:28px;flex:none;border:1px solid var(--line2);border-radius:5px;display:grid;place-items:center;font-size:13px;font-weight:700;background:var(--bg)}
#bmenu{width:270px;max-height:min(560px,80vh);overflow:auto}
.bmt{display:grid;grid-template-columns:1fr 1fr;gap:1px}
.bmt button{font-size:13px;padding:4px 6px;gap:7px}
.bmt .si{width:22px;height:22px;font-size:11px}
.sws{display:flex;flex-wrap:wrap;gap:4px;padding:2px 6px 6px}
.sw{width:24px;height:24px;border-radius:5px;border:1px solid var(--line2);cursor:pointer;font-weight:700;font-size:13px;padding:0}
.sw:not([class*="bg-"]){background:var(--bg)}
.sw[class*="bg-"]{border-color:rgb(255 255 255 / .14)}
.sw[aria-pressed="true"]{outline:2px solid var(--accent);outline-offset:1px}
.bma{display:flex;flex-direction:column;border-top:1px solid var(--line);margin-top:4px;padding-top:4px}
.bma button{border:0;background:none;text-align:left;padding:5px 8px;border-radius:5px;cursor:pointer;font-size:13.5px}
.bma .danger{color:#ec716d}
#emoji{width:330px}
.eg{display:grid;grid-template-columns:repeat(9,1fr);gap:2px;padding:4px}
.eg button{border:0;background:none;font-size:22px;line-height:1;padding:5px 0;border-radius:5px;cursor:pointer}
.eg button:hover{background:var(--hover)}
.erow{display:flex;gap:6px;padding:6px 4px 2px}
.erow input{flex:1;min-width:0;background:var(--bg);border:1px solid var(--line2);border-radius:6px;padding:4px 8px;font-size:14px;outline:none}
#newMenu{width:240px}
#newMenu button{display:flex;gap:10px;align-items:center;width:100%;border:0;background:none;border-radius:5px;padding:7px 8px;cursor:pointer;text-align:left;font-size:14px}
#newMenu button:hover{background:var(--hover)}
#newMenu small{display:block;color:var(--muted);font-size:12px}

/* 選取文字的格式工具列 */
#fmt{display:flex;gap:2px;padding:4px;align-items:center;flex-wrap:wrap;max-width:330px}
#fmt button{border:0;background:none;min-width:28px;height:28px;border-radius:5px;cursor:pointer;font-size:14px;padding:0 6px}
#fmt button:hover{background:var(--hover)}
#fmt .sep{width:1px;height:18px;background:var(--line2);margin:0 3px}
#fmtColors{width:100%;border-top:1px solid var(--line);margin-top:4px;padding-top:2px}
#fmtColors .sws{padding:2px}

/* GitHub 面板 / 提示 */
.overlay{position:fixed;inset:0;background:rgb(0 0 0 / .55);display:flex;align-items:flex-start;justify-content:center;padding:60px 16px 16px;z-index:60;overflow:auto}
.sheet{background:var(--panel);border:1px solid var(--line2);border-radius:12px;width:100%;max-width:540px;padding:20px;display:flex;flex-direction:column;gap:14px}
.sheet h3{margin:0;font-size:18px}
.gform{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.gform .wide,.gform .actions{grid-column:1/-1}
.gform .actions{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.fl{display:flex;flex-direction:column;gap:5px;font-size:12.5px;color:var(--muted)}
.fl input{background:var(--bg);border:1px solid var(--line2);border-radius:6px;padding:7px 9px;font-size:14px;color:var(--ink);outline:none}
.fl input:focus{border-color:var(--accent)}
.sheet .btn{border:1px solid var(--line2)}
.hint{font-size:12.5px;color:var(--muted)}
.log{font:12px var(--f-mono);color:var(--muted);white-space:pre-wrap;min-height:1.5em}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#333;border:1px solid var(--line2);border-radius:8px;padding:8px 14px;display:flex;gap:12px;align-items:center;z-index:70;box-shadow:0 8px 24px rgb(0 0 0 / .5);font-size:14px;max-width:calc(100vw - 32px)}
.linkb{background:none;border:0;color:var(--accent);cursor:pointer;font-size:14px;padding:0}

/* 區塊多選 */
.blk.bsel>.bc{background:rgb(94 157 230 / .2)!important;box-shadow:inset 0 0 0 1px rgb(94 157 230 / .35)}
body.bselecting,body.bselecting *{user-select:none!important;-webkit-user-select:none!important}
#rubber{position:fixed;border:1px solid rgb(94 157 230 / .75);background:rgb(94 157 230 / .12);pointer-events:none;z-index:40;border-radius:2px}
.blk.flash>.bc{animation:flash 1.4s ease-out}
@keyframes flash{0%{background:rgb(94 157 230 / .45)}100%{background:transparent}}

/* 標籤（關鍵詞） */
.tg{display:inline-block;padding:0 6px;margin:0 2px;border-radius:4px;font-size:.86em;font-weight:500;line-height:1.55;white-space:nowrap;background:#2f2f2f;color:#c4c4c0;cursor:pointer;vertical-align:baseline}
.tg-gray{background:#373737;color:#b8b8b4}.tg-brown{background:#3b2b23;color:#d4a990}.tg-orange{background:#4a3020;color:#f0a368}.tg-yellow{background:#463a20;color:#e8c26a}.tg-green{background:#1d3a2a;color:#5fd08f}
.tg-blue{background:#1a3350;color:#7cb4f5}.tg-purple{background:#35284d;color:#c39af0}.tg-pink{background:#46283b;color:#f08cc0}.tg-red{background:#4b2422;color:#f5807b}

/* 情境走勢 */
.t-scn{margin-top:1.2em}
.t-scn .bc{align-items:center;border-left:3px solid #e47cb0;border-radius:0 7px 7px 0;background:rgb(228 124 176 / .07);padding:6px 8px}
.t-scn .tx{font-size:21px;font-weight:700;line-height:1.35}
.t-scn:not([class*=" tc-"]) .tx{color:#ec8cbd}
.t-scn .tgl{height:28px}
.scnlbl{flex:none;font-size:11px;font-weight:700;padding:1px 6px;border-radius:4px;background:rgb(228 124 176 / .18);color:#ec8cbd}
.t-scn .gut{top:9px}
.act{flex:none;border:1px solid var(--line2);background:none;border-radius:5px;font-size:12.5px;font-weight:700;padding:1px 9px;cursor:pointer;color:var(--faint);white-space:nowrap}
.act.long{background:#4b2422;border-color:#6e302c;color:#ff6b6b}.act.short{background:#1d3a2a;border-color:#2b5a40;color:#4ade80}.act.wait{background:#463a20;border-color:#6b5a2e;color:#e8c26a}
.act.none{opacity:0}.blk:hover .act.none{opacity:1}
.sno{flex:none;width:22px;min-width:22px;height:22px;margin-top:2px;border-radius:50%;background:#3d2834;color:#f3a6cc;font:600 12px/22px var(--f-mono);text-align:center}
.chip{flex:none;min-width:0;font-size:12px;font-weight:700;padding:1px 7px;border-radius:4px;margin-top:3px;line-height:1.5;white-space:nowrap}
.chip.win{background:#4d1c1c;color:#ff5c5c}.chip.lose{background:#163d27;color:#3ddc84}
.chip.nwarn{background:#4b2422;color:#f5807b}.chip.nmemo{background:#333;color:#a3a39f}.chip.nkey{background:#463a20;color:#e8c26a}
.t-nwarn .tx{color:#f09591}.t-nkey .tx{color:#ecc97f}.t-nmemo .tx{color:var(--ink2);font-size:15px}
.t-win .bc{box-shadow:inset 2px 0 0 #ff5c5c;border-radius:0 5px 5px 0;background:rgb(255 92 92 / .05)}
.t-lose .bc{box-shadow:inset 2px 0 0 #3ddc84;border-radius:0 5px 5px 0;background:rgb(61 220 132 / .05)}
.qadd{display:flex;gap:3px;flex:none;opacity:0;transition:opacity .1s;margin-top:1px}
.blk:hover>.bc>.qadd{opacity:1}
.qadd button{border:1px solid var(--line2);background:var(--bg);border-radius:4px;font-size:11.5px;padding:0 6px;cursor:pointer;color:var(--muted);height:22px;white-space:nowrap}
.qadd button:hover{color:var(--ink);border-color:var(--muted)}
#tgPop{padding:4px}#tgPop button{border:0;background:none;padding:5px 9px;border-radius:5px;cursor:pointer;font-size:13.5px;width:100%;text-align:left}#tgPop button:hover{background:var(--hover)}

/* 標籤設定 */
#tagSheet .mh{font-size:12px;color:var(--muted);margin:4px 0 -6px}
.tl{display:flex;flex-wrap:wrap;gap:6px}
.tgi{display:inline-flex;align-items:center}
.tgi .x{border:0;background:none;color:var(--faint);cursor:pointer;padding:0 3px;font-size:15px;line-height:1}.tgi .x:hover{color:#ec716d}
.tgadd{display:flex;gap:6px;flex-wrap:wrap}
.tgadd input{flex:1;min-width:120px;background:var(--bg);border:1px solid var(--line2);border-radius:6px;padding:5px 8px;font-size:14px;outline:none}
.tgauto{display:flex;gap:8px;align-items:center;font-size:14px;cursor:pointer}

/* 情境總覽 */
#ovw .sheet{max-width:1280px;gap:12px}
.ovtop{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.ovbar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:13px}
.ovbar .lb{color:var(--muted);font-size:12px;margin-left:4px}
.ovbar input[type=search]{background:var(--bg);border:1px solid var(--line2);border-radius:6px;padding:4px 8px;font-size:13.5px;outline:none;width:170px}
.ovbar .tg{opacity:.4}.ovbar .tg.on{opacity:1;box-shadow:0 0 0 1px currentColor}
.seg2{display:inline-flex;border:1px solid var(--line2);border-radius:6px;overflow:hidden}
.seg2 button{border:0;background:none;padding:3px 10px;cursor:pointer;font-size:12.5px;color:var(--muted)}
.seg2 button.on{background:var(--hover);color:var(--ink)}
.ovgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:12px;align-items:start}
.ovc{background:var(--bg);border:1px solid var(--line2);border-radius:10px;padding:11px 13px;display:flex;flex-direction:column;gap:6px;min-width:0}
.ovc.pick{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.ovh{display:flex;align-items:center;gap:8px}
.ovh .tt{font-weight:700;color:#ec8cbd;font-size:16px;flex:1;min-width:0;cursor:pointer}
.ovh .tt:hover{text-decoration:underline}
.ovpk{font-size:12px;color:var(--muted);display:flex;gap:4px;align-items:center;cursor:pointer;white-space:nowrap}
.ovpg{font-size:11.5px;color:var(--faint)}
.ovtags{display:flex;flex-wrap:wrap;gap:3px}
.ovl{display:flex;gap:7px;align-items:flex-start;font-size:14px;line-height:1.55;margin-left:calc(var(--d,0)*20px)}
.ovl .sno{width:20px;min-width:20px;height:20px;line-height:20px;font-size:11px;margin-top:1px}
.ovl .chip{margin-top:1px;font-size:11px;padding:0 6px}
.ovl .ovx{flex:1;min-width:0;overflow-wrap:anywhere}
.ovl.o-nwarn .ovx{color:#f09591}.ovl.o-nkey .ovx{color:#ecc97f}.ovl.o-nmemo .ovx{color:var(--ink2)}
.ovempty{color:var(--muted);padding:30px 10px;text-align:center;line-height:1.8}
.ovt{overflow:auto;border:1px solid var(--line2);border-radius:10px;max-height:70vh}
.ovt table{border-collapse:separate;border-spacing:0;min-width:100%}
.ovt th,.ovt td{border-bottom:1px solid var(--line);border-right:1px solid var(--line);padding:8px 10px;vertical-align:top;text-align:left;min-width:260px;font-size:14px}
.ovt th{position:sticky;top:0;background:#2a2a2a;z-index:2}
.ovt th:first-child,.ovt td:first-child{min-width:64px;width:64px;color:var(--muted);font-size:12.5px;position:sticky;left:0;background:#232323;z-index:1}
.ovt th:first-child{z-index:3}
.ovt td .ovl{margin-left:0}

/* 分歧點 / 分支 */
.t-fork{margin-top:.4em}
.t-fork .bc{align-items:center;padding:3px 6px}
.t-fork .tx{font-size:14px;color:var(--muted)}

function norm(d){

    const q=mkPage(p);q.id=p.id||uid();q.title=String(p.title||'');q.icon=String(p.icon||'');
    q.blocks=(Array.isArray(p.blocks)?p.blocks:[]).filter(b=>b&&typeof b==='object').map(b=>{
      const t=TYPES[b.type]?b.type:'p';
      const n=Object.assign({},b,{id:b.id||uid(),type:t,html:t==='divider'?'':clean(b.html),indent:clamp(parseInt(b.indent)||0,0,8)});
      if(n.color&&!CK.has(n.color))delete n.color;
      if(n.bg&&!CK.has(n.bg))delete n.bg;
      if(n.emoji!==undefined)n.emoji=String(n.emoji).slice(0,16);
      if(n.act&&!ACTL[n.act])delete n.act;
      if(n.view&&!VIEWS.some(v=>v[0]===n.view))delete n.view;
      return n});
    if(!q.blocks.length)q.blocks=[mkB('p')];
    return q});
  if(!d.pages.length)d.pages=[mkPage({blocks:[mkB('p')]})];
  if(!d.pages.some(p=>p.id===d.currentId))d.currentId=d.pages[0].id;
  d.tags=(Array.isArray(d.tags)?d.tags:TAG_DEF.map(([t,c,g])=>({t,c,g}))).filter(x=>x&&String(x.t||'').trim()).map(x=>({t:String(x.t).trim().slice(0,20),c:CK.has(x.c)?x.c:'gray',g:String(x.g||'自訂').slice(0,12)}));
  d.tagAuto=d.tagAuto!==false;
  if(!VIEWS.some(v=>v[0]===d.forkView))d.forkView='side';
  d.version=1;return d;
}

/* 把 [i,j) 的區塊畫成 HTML；遇到分歧點就把底下的分支排成欄 */
function renderRange(bs,i,j,o){
  let h='',hide=null,seeded=!o.seed||!o.seed.n;const cnt=[],prev=[];
  for(let k=i;k<j;k++){
    const b=bs[k],ind=b.indent||0;let hidden=o.hidden;
    if(hide!=null&&ind>hide)hidden=true;else hide=null;
    if(!hidden&&COLL.has(b.type)&&b.collapsed)hide=ind;
    cnt.length=ind+1;prev.length=ind+1;let n=0;
    /* 分支裡的步驟接著共同步驟的編號往下數 */
    if(!seeded&&ind===o.seed.lvl){seeded=true;if(prev[ind]===undefined){prev[ind]='step';cnt[ind]=o.seed.n}}
    const before=prev[ind]==='step'?(cnt[ind]||0):0;
    if(b.type==='num'||b.type==='step'){n=prev[ind]===b.type?(cnt[ind]||0)+1:1;cnt[ind]=n}
    prev[ind]=b.type;
    const rel=ind-o.off;
    h+=blockHTML(b,{n,hidden,rel});
    if(b.type==='fork'){const e=subEnd(bs,k);h+=forkHTML(bs,k,e,{hidden:hidden||!!b.collapsed,rel,base:before});k=e-1;hide=null}
  }
  return h;
}
function forkGroups(bs,i,e){const g=[];for(let k=i+1;k<e;){const en=subEnd(bs,k);g.push([k,en]);k=en}return g}
function forkHTML(bs,i,e,o){
  const f=bs[i],v=f.view||'side',groups=forkGroups(bs,i,e),tab=clamp(f.tab||0,0,Math.max(0,groups.length-1));
  let h='';
  if(v==='tab'&&groups.length)h+=`<div class="fktabs${o.hidden?' hid':''}" style="--ind:${o.rel}">${groups.map(([s],x)=>{const g=bs[s];return `<button type="button" data-ftab="${f.id}" data-ti="${x}" class="${x===tab?'on':''}">${esc(plain(g.html).trim()||'未命名分支')}${g.act?'・'+ACTL[g.act]:''}</button>`}).join('')}</div>`;
  h+=`<div class="fkwrap v-${v}${o.hidden?' hid':''}" style="--ind:${o.rel};--n:${Math.max(1,Math.min(6,groups.length))}">`;
  groups.forEach(([s,en],x)=>{const g=bs[s],off=g.indent||0,off2=v==='tab'&&x!==tab;
    h+=`<div class="brcol${g.act?' a-'+g.act:''}${off2?' off':''}">`+renderRange(bs,s,en,{off,hidden:o.hidden||off2,seed:{lvl:off+1,n:o.base}})+'</div>'});
  return h+'</div>';
}

function onEnter(b,i,el){

    const nb=mkB(LISTY.includes(b.type)?b.type:'p','',{indent:b.indent||0});

  }
  const s=sel(),r=s.getRangeAt(0);r.deleteContents();

  const s=sel();if(!s.rangeCount||s.isCollapsed)return;const r=s.getRangeAt(0),el=curTx();if(!el)return;
  const w=document.createElement(tag);if(cls)w.className=cls;w.appendChild(r.extractContents());

}

/* ================= 舊版畫布 → 頁面 ================= */
function fromCanvas(d){
  const N=Array.isArray(d.nodes)?d.nodes:[],by=t=>N.filter(n=>n.type===t),B=[],e=esc,br=s=>e(s).replace(/\n/g,'<br>');
  const add=(type,html,o={})=>B.push(mkB(type,html,o));
  const dates=[...new Set(by('obs').map(o=>o.date).filter(Boolean))].sort().reverse();
  if(dates.length)add('h1','👀 觀察');
  dates.forEach(dt=>{add('h2','🗓️ '+e(dt));
    by('obs').filter(o=>o.date===dt).sort((a,b)=>(a.createdAt||'').localeCompare(b.createdAt||'')).forEach(o=>{
      const head=[o.time?`<b>${e(o.time)} ET</b>`:'',o.title?`<b>${e(o.title)}</b>`:''].filter(Boolean).join(' ');
      const pts=(o.pts||[]).filter(x=>String(x).trim()),lines=String(o.text||'').split('\n');
      add('bullet',head||e(lines[0])||'（空白）');
      pts.forEach(x=>add('num',br(x),{indent:1}));
      const rest=head?o.text:lines.slice(1).join('\n');if(rest&&rest.trim())add('p',br(rest.trim()),{indent:1});
    })});
  const ideas=by('idea');if(ideas.length)add('h1','🧠 觀點');
  ideas.forEach(i=>{add('h3',e(i.title||'（未命名觀點）'));if(i.text)add('p',br(i.text));if(i.condition)add('callout','適用條件：'+br(i.condition),{bg:'gray',emoji:'📌'})});
  const strats=by('strat');if(strats.length)add('h1','🎯 策略');
  const ACT={long:'做多',short:'做空',wait:'等待觀察',skip:'放棄不做'},AC={long:'green',short:'red',wait:'yellow',skip:'gray'};
  const rec=(l,dp)=>(l||[]).forEach((s,k)=>{const lab=l.length>1?'如果'+('①②③④⑤⑥⑦⑧⑨'[k]||''):dp===0?'先看到':'然後';add('bullet',`<b>${lab}</b>：${e(s.text||'')}${s.act&&ACT[s.act]?` → <span class="tc-${AC[s.act]}"><b>${ACT[s.act]}</b></span>`:''}`,{indent:Math.min(dp,8)});rec(s.kids,dp+1)});
  strats.forEach(s=>{add('h3',e(s.title||'（未命名策略）'));if(s.text)add('p',br(s.text));rec(s.sop,0)});
  const vals=by('val').sort((a,b)=>(b.date||'').localeCompare(a.date||''));if(vals.length)add('h1','✅ 驗證');
  const VD={support:['支持','green','✅'],against:['反駁','red','❌'],neutral:['中性','yellow','➖']};
  vals.forEach(v=>{const x=VD[v.verdict]||['','gray','💬'];add('callout',`<b>${x[0]}</b>・${e(v.date||'')}${v.title?'<br><b>'+e(v.title)+'</b>':''}${v.text?'<br>'+br(v.text):''}`,{bg:x[1],emoji:x[2]})});
  const exts=by('ext');if(exts.length)add('h1','💭 延伸');
  exts.forEach(x=>{add('bullet',e(x.title||'（未命名）'));if(x.text)add('p',br(x.text),{indent:1})});
  return mkPage({icon:'🗂️',title:'舊畫布匯入',blocks:B.length?B:[mkB('p')]});
}

/* ================= GitHub 同步 (Contents API) ================= */
const gFields=['gOwner','gRepo','gBranch','gPath','gToken'];
function loadCfg(){
  let c={};try{c=JSON.parse(localStorage.getItem(GITCFG)||'null')||{}}catch(e){}
  if(!c.gOwner){try{const o=JSON.parse(localStorage.getItem(OLDGIT)||'{}');if(o.gOwner)c=Object.assign({},o,{gPath:'data/nq-notes.json'})}catch(e){}}
  gFields.forEach(k=>{if(c[k])$(k).value=c[k]});return c;
}
function saveCfg(){const c={};gFields.forEach(k=>c[k]=$(k).value.trim());try{localStorage.setItem(GITCFG,JSON.stringify(c))}catch(e){}return c}
const b64enc=s=>{const b=new TextEncoder().encode(s);let r='';for(let i=0;i<b.length;i+=0x8000)r+=String.fromCharCode(...b.subarray(i,i+0x8000));return btoa(r)};
const b64dec=s=>new TextDecoder().decode(Uint8Array.from(atob(s.replace(/\n/g,'')),c=>c.charCodeAt(0)));
function api(c,method='GET',body){
  const url=`https://api.github.com/repos/${encodeURIComponent(c.gOwner)}/${encodeURIComponent(c.gRepo)}/contents/${c.gPath.split('/').map(encodeURIComponent).join('/')}`+(method==='GET'?`?ref=${encodeURIComponent(c.gBranch)}`:'');
  return fetch(url,{method,headers:{Authorization:`Bearer ${c.gToken}`,Accept:'application/vnd.github+json'},body:body&&JSON.stringify(body)});
}
const glog=t=>$('gLog').textContent=t;
function need(c){if(!c.gOwner||!c.gRepo||!c.gToken){glog('請填寫擁有者、Repo 名稱與 Token。');return false}return true}
$('btnGit').onclick=()=>{loadCfg();$('gitOverlay').hidden=false;$('gOwner').focus()};
$('gClose').onclick=()=>$('gitOverlay').hidden=true;
$('gitOverlay').onclick=e=>{if(e.target.id==='gitOverlay')$('gitOverlay').hidden=true};
$('gPull').onclick=async()=>{
  const c=saveCfg();if(!need(c))return;glog('下載中…');
  try{const r=await api(c);if(r.status===404){glog('Repo 裡還沒有這個檔案，先按「上傳到 GitHub」建立。');return}
    if(!r.ok)throw new Error(`${r.status} ${(await r.json()).message||''}`);
    const j=await r.json(),res=ingest(JSON.parse(b64dec(j.content)));db=res.db;saveNow();render();
    glog(res.fromOld?'已把舊畫布資料轉成一個新頁面（記得把路徑改回 data/nq-notes.json 再上傳）。':`已下載 ${db.pages.length} 個頁面。`);setSync('ok',`已與 GitHub 同步・${fmt(now())}`);
  }catch(err){glog('下載失敗：'+err.message+'\n請確認 repo、分支、路徑與 Token 權限。');setSync('err','GitHub 下載失敗')}
};
$('gPush').onclick=async()=>{
  const c=saveCfg();if(!need(c))return;glog('上傳中…');saveNow();
  try{let sha;const g=await api(c);if(g.ok)sha=(await g.json()).sha;else if(g.status!==404)throw new Error(`${g.status} ${(await g.json()).message||''}`);
    const r=await api(c,'PUT',{message:`更新 NQ 交易筆記 ${fmt(now())}`,content:b64enc(JSON.stringify(db,null,2)),branch:c.gBranch,sha});
    if(!r.ok)throw new Error(`${r.status} ${(await r.json()).message||''}`);

/* ================= 區塊多選（跨行反白） =================
   拖曳文字到別行、從空白處框選、Shift＋點、Esc、Ctrl+A 兩次、Shift＋↑↓ 都會進入多選。
   選取時：拖 ⋮⋮ 整段移動、Alt＋↑↓ 或 Ctrl+Shift＋↑↓ 移動、Tab 縮排、Delete 刪除、Ctrl+C／X／V／D、Enter 回到編輯、Esc 取消 */
var bsel=new Set(),bAnchor=null,bFocus=null;

function enterBSel(a,f){F.hidden=true;closeSlash();const ae=document.activeElement;if(ae&&ae.closest&&ae.closest('.tx,#ptitle'))ae.blur();sel().removeAllRanges();setBSel(a,f||a)}
/* 選取範圍在資料裡的 [i,j)，包含收合起來的子內容 */

function endAtEnd(el){const s=sel();if(!s.rangeCount)return false;const r=s.getRangeAt(0),p=document.createRange();p.selectNodeContents(el);p.setStart(r.endContainer,r.endOffset);return p.toString().length===0}

  if(d>0){const pv=bs[i-1];if(!pv||(bs[i].indent||0)>(pv.indent||0))return}
  if(d<0&&!(bs[i].indent>0))return;
  for(let k=i;k<j;k++)bs[k].indent=clamp((bs[k].indent||0)+d,0,8);touch();render()}

  if((k==='ArrowUp'||k==='ArrowDown')&&e.shiftKey){e.preventDefault();const f=clamp(v.indexOf(bFocus)+(k==='ArrowUp'?-1:1),0,v.length-1);setBSel(bAnchor,v[f]);scrollSelIntoView();return}

/* 複製／剪下／貼上 整段區塊 */
let clip=null;
function blocksText(seg){const base=Math.min(...seg.map(b=>b.indent||0)),cnt=[],prev=[];
  return seg.map(b=>{const ind=(b.indent||0)-base;cnt.length=ind+1;prev.length=ind+1;let pre='';
    if(b.type==='num'||b.type==='step'){cnt[ind]=prev[ind]===b.type?(cnt[ind]||0)+1:1;pre=cnt[ind]+'. '}
    else pre={bullet:'• ',todo:b.checked?'[x] ':'[ ] ',quote:'> ',nkey:'重點：',nwarn:'注意：',nmemo:'備註：',win:'成功：',lose:'失敗：',h1:'# ',h2:'## ',h3:'### ',scn:'【情境】',fork:'【分歧】',branch:'【分支】'}[b.type]||'';
    prev[ind]=b.type;if(b.type==='divider')return '  '.repeat(ind)+'---';
    const t=document.createElement('template');t.innerHTML=(b.html||'').replace(/<br\s*\/?>/gi,'\n');
    return '  '.repeat(ind)+pre+(t.content.textContent||'')+((b.type==='scn'||b.type==='branch')&&b.act?`（${ACTL[b.act]}）`:'');}).join('\n')}
function readClip(dt){let L=null;try{const j=dt.getData('application/x-nq-blocks');if(j)L=JSON.parse(j)}catch(_){}
  const t=(dt.getData('text/plain')||'').replace(/\r/g,'');if(!L&&clip&&t&&t===clip.text)L=clip.blocks;return Array.isArray(L)&&L.length?L:null}
function pasteAt(L,at,base,removeIdx){
  const bs=cur().blocks,d0=L[0].indent||0;
  const nb=L.map(b=>{const t=TYPES[b.type]?b.type:'p';return Object.assign(structuredClone(b),{id:uid(),type:t,html:t==='divider'?'':clean(b.html),indent:clamp((b.indent||0)-d0+base,0,8)})});
  if(removeIdx>=0)bs.splice(removeIdx,1);bs.splice(at,0,...nb);touch();
  bsel=new Set(nb.map(x=>x.id));bAnchor=nb[0].id;bFocus=nb[nb.length-1].id;render();document.activeElement?.blur?.();
  toast(`已貼上 ${nb.length} 個區塊`);
}
function copySel(e,cut){
  if(!bsel.size||(e.target.closest&&e.target.closest('.tx,input,textarea,#ptitle')))return;
  const r=bRange();if(!r)return;const seg=cur().blocks.slice(r[0],r[1]),text=blocksText(seg);
  e.preventDefault();e.clipboardData.setData('text/plain',text);try{e.clipboardData.setData('application/x-nq-blocks',JSON.stringify(seg))}catch(_){}
  clip={text,blocks:structuredClone(seg)};
  if(cut)delSeg(r[0],r[1]);else toast(`已複製 ${seg.length} 個區塊（到別的地方 Ctrl+V 貼上）`);

document.addEventListener('copy',e=>copySel(e,false));

  if(!bsel.size||(e.target.closest&&e.target.closest('.tx,input,textarea,#ptitle')))return;
  const L=readClip(e.clipboardData);if(!L)return;e.preventDefault();const r=bRange();if(!r)return;
  pasteAt(L,r[1],cur().blocks[r[0]].indent||0,-1);

/* ================= 標籤（關鍵詞） ================= */
var lastAuto=null,skipAuto=false;
const tagOf=t=>{const k=String(t||'').trim().toLowerCase();return db.tags.find(x=>x.t.toLowerCase()===k)};
const tagColor=t=>(tagOf(t)||{}).c||'gray';
function decorateTags(root){root.querySelectorAll('.tg').forEach(s=>{s.className='tg tg-'+tagColor(s.textContent);if(s.closest('.tx'))s.contentEditable='false'})}
function mkTag(txt){const sp=document.createElement('span');sp.className='tg tg-'+tagColor(txt);sp.contentEditable='false';sp.textContent=txt;return sp}
function caretAfter(node){const s=sel(),after=document.createTextNode('');node.after(after);const r=document.createRange();r.setStart(after,0);r.collapse(true);s.removeAllRanges();s.addRange(r)}
/* 打字打到標籤庫裡的詞，就把它變成標籤 */
function autoTag(el){
  if(!db.tagAuto)return false;const s=sel();if(!s.rangeCount||!s.isCollapsed)return false;
  const r=s.getRangeAt(0),n=r.startContainer;if(n.nodeType!==3||!el.contains(n)||n.parentElement.closest('.tg,code,a'))return false;
  const low=n.data.slice(0,r.startOffset).toLowerCase();
  const hit=[...db.tags].sort((a,b)=>b.t.length-a.t.length).find(t=>low.endsWith(t.t.toLowerCase()));if(!hit)return false;
  const st=r.startOffset-hit.t.length,mid=n.splitText(st);mid.splitText(hit.t.length);
  const sp=mkTag(hit.t);mid.replaceWith(sp);caretAfter(sp);lastAuto={span:sp};return true;
}

  if(keepCaret){const r=document.createRange();r.setStart(tn,tn.length);r.collapse(true);sel().removeAllRanges();sel().addRange(r)}
  skipAuto=true;tx?.dispatchEvent(new Event('input',{bubbles:true}));skipAuto=false}

  const s=sel();if(!s.rangeCount||s.isCollapsed)return;const r=s.getRangeAt(0),el=curTx();if(!el)return;
  const txt=r.toString().trim();if(!txt)return;if(txt.length>20){toast('標籤請選短一點（20 字以內）');return}
  if(!tagOf(txt)){db.tags.push({t:txt,c:'gray',g:'自訂'});saveSoon();toast(`「${txt}」已加入標籤庫，之後打到會自動變標籤（到「🏷 標籤」換顏色）`)}
  r.deleteContents();const sp=mkTag(txt);r.insertNode(sp);caretAfter(sp);F.hidden=true;
  skipAuto=true;el.dispatchEvent(new Event('input',{bubbles:true}));skipAuto=false;

/* ================= 情境總覽 ================= */
const OV={tags:new Set(),act:'all',q:'',pick:new Set(),mode:'cards',list:[]};
function scnList(){
  const out=[];
  db.pages.forEach(p=>{const bs=p.blocks;bs.forEach((b,i)=>{
    if(b.type!=='scn')return;const ind=b.indent||0;let j=subEnd(bs,i),nested=j>i+1;
    if(!nested){j=i+1;while(j<bs.length&&(bs[j].indent||0)===ind&&!['scn','h1','h2','h3','divider'].includes(bs[j].type))j++}
    const body=bs.slice(i+1,j),text=[b,...body].map(x=>plain(x.html)).join('\n').toLowerCase();
    out.push({key:p.id+':'+b.id,p,b,body,base:ind+(nested?1:0),text,tags:db.tags.filter(t=>text.includes(t.t.toLowerCase()))});

  return {bullet:'<span style="color:var(--muted)">•</span>',num:`<span style="color:var(--muted)">${n}.</span>`,todo:x.checked?'☑':'☐',quote:'<span style="color:var(--muted)">❝</span>',callout:esc(x.emoji||'💡'),toggle:'<span style="color:var(--muted)">▸</span>'}[x.type]||'';

    <span class="seg2">${seg('act','all','全部')}${seg('act','long','做多')}${seg('act','short','做空')}${seg('act','wait','觀望')}${seg('act','none','未標')}</span>
    ${groups.map(g=>`<span class="lb">${esc(g)}</span>${db.tags.filter(t=>t.g===g&&used.has(t.t)).map(t=>`<span class="tg tg-${t.c}${OV.tags.has(t.t)?' on':''}" data-ft="${esc(t.t)}">${esc(t.t)}</span>`).join('')}`).join('')}
    ${OV.tags.size?'<button class="btn" data-clr>清除標籤篩選</button>':''}
    <span style="margin-left:auto"></span>
    ${OV.pick.size>=2?'<button class="btn" data-merge title="同一頁的情境才能合併">⑂ 合併成分支</button>':''}
    ${OV.mode==='cmp'?'<button class="btn primary" data-mode="cards">← 回到卡片</button>':`<button class="btn${OV.pick.size>=2?' primary':''}" data-mode="cmp" ${OV.pick.size<2?'disabled style="opacity:.5;cursor:default"':''}>並排比較（已勾 ${OV.pick.size}）</button>`}`;
  const L=ovFiltered();
  $('ovCount').textContent=`共 ${OV.list.length} 個情境${L.length!==OV.list.length?`，符合 ${L.length} 個`:''}`;
  const body=$('ovBody');
  if(!OV.list.length){body.innerHTML='<div class="ovempty">還沒有任何情境。<br>在頁面裡輸入 <code>/情境</code> 建立一個，或從左下角「＋ 新增頁面 → 情境走勢」開始。</div>';return}
  if(OV.mode==='cmp'){body.innerHTML=ovCompare(OV.list.filter(s=>OV.pick.has(s.key)));decorateTags(body);return}
  body.innerHTML=L.length?`<div class="ovgrid">${L.map(sc=>`<div class="ovc${OV.pick.has(sc.key)?' pick':''}">
      <div class="ovh"><span class="tt" data-go="${sc.key}" title="跳到這個情境">${sc.b.html||'（未命名情境）'}</span>${actChip(sc.b)}<label class="ovpk"><input type="checkbox" data-pk="${sc.key}"${OV.pick.has(sc.key)?' checked':''}>比較</label></div>
      <div class="ovpg">${esc(sc.p.icon||'📄')} ${esc(sc.p.title||'未命名')}</div>
      ${sc.tags.length?`<div class="ovtags">${sc.tags.map(t=>`<span class="tg">${esc(t.t)}</span>`).join('')}</div>`:''}
      <div>${ovLines(sc,sc.body)}</div></div>`).join('')}</div>`:'<div class="ovempty">沒有符合篩選的情境</div>';
  decorateTags(body);
}
/* 並排比較：每一列是同一個步驟編號，方便看不同情境在同一步的差別 */
function ovCompare(S){
  const P=S.map(sc=>{const g={pre:[],steps:[],win:[],lose:[]};let cur2=null;
    sc.body.forEach(x=>{const d=(x.indent||0)-sc.base;
      if(d<=0&&x.type==='step'){cur2=[x];g.steps.push(cur2);return}
      if(d<=0&&(x.type==='win'||x.type==='lose')){g[x.type].push(x);cur2=null;return}
      if(cur2)cur2.push(x);else g.pre.push(x)});return g});
  const M=Math.max(0,...P.map(g=>g.steps.length)),cell=(sc,list)=>list.length?ovLines(sc,list):'<span style="color:var(--faint)">—</span>';
  const stepCell=(sc,grp)=>{if(!grp)return '<span style="color:var(--faint)">—</span>';const [s0,...rest]=grp;
    return `<div class="ovl"><div class="ovx" style="font-weight:500">${s0.html||'（空白）'}</div></div>`+ovLines({base:(s0.indent||0)+1},rest)};
  let h=`<div class="ovt"><table><thead><tr><th></th>${S.map(sc=>`<th><div class="ovh"><span class="tt" data-go="${sc.key}">${sc.b.html||'（未命名）'}</span>${actChip(sc.b)}</div><div class="ovpg">${esc(sc.p.title||'')}</div></th>`).join('')}</tr></thead><tbody>`;
  if(P.some(g=>g.pre.length))h+=`<tr><td>前提</td>${S.map((sc,k)=>`<td>${cell(sc,P[k].pre)}</td>`).join('')}</tr>`;
  for(let n=0;n<M;n++)h+=`<tr><td><span class="sno" style="display:inline-block">${n+1}</span></td>${S.map((sc,k)=>`<td>${stepCell(sc,P[k].steps[n])}</td>`).join('')}</tr>`;
  h+=`<tr><td><span class="chip win">成功</span></td>${S.map((sc,k)=>`<td>${cell({base:sc.base},P[k].win.map(x=>({...x,type:'p'})))}</td>`).join('')}</tr>`;
  h+=`<tr><td><span class="chip lose">失敗</span></td>${S.map((sc,k)=>`<td>${cell({base:sc.base},P[k].lose.map(x=>({...x,type:'p'})))}</td>`).join('')}</tr>`;
  return h+'</tbody></table></div>';
}
function goScn(key){const sc=OV.list.find(s=>s.key===key);if(!sc)return;$('ovw').hidden=true;db.currentId=sc.p.id;saveSoon();closeSlash();render();
  requestAnimationFrame(()=>{const el=blkEl(sc.b.id);if(!el)return;el.scrollIntoView({block:'start'});$('scroll').scrollTop-=60;el.classList.add('flash');setTimeout(()=>el.classList.remove('flash'),1500)})}
$('btnOvw').onclick=()=>{saveNow();drawOv();$('ovw').hidden=false};
$('ovClose').onclick=()=>$('ovw').hidden=true;
$('ovw').addEventListener('click',e=>{
  if(e.target.id==='ovw'){$('ovw').hidden=true;return}
  const t=e.target;
  if(t.closest('[data-go]')){goScn(t.closest('[data-go]').dataset.go);return}
  if(t.dataset.ov){OV[t.dataset.ov]=t.dataset.v;drawOv();return}
  if(t.dataset.ft!==undefined){OV.tags.has(t.dataset.ft)?OV.tags.delete(t.dataset.ft):OV.tags.add(t.dataset.ft);drawOv();return}
  if(t.dataset.clr!==undefined){OV.tags.clear();drawOv();return}
  if(t.dataset.merge!==undefined){const S=OV.list.filter(s=>OV.pick.has(s.key)),pg=new Set(S.map(s=>s.p.id));
    if(pg.size>1){toast('只能合併同一頁裡的情境');return}
    $('ovw').hidden=true;db.currentId=S[0].p.id;OV.pick.clear();OV.mode='cards';mergeScn(S.map(s=>s.b.id));return}
  if(t.dataset.mode&&!t.disabled){OV.mode=t.dataset.mode;drawOv();return}
});
$('ovw').addEventListener('change',e=>{if(e.target.dataset.pk){const k=e.target.dataset.pk;e.target.checked?OV.pick.add(k):OV.pick.delete(k);const y=$('ovBody').scrollTop;drawOv();$('ovBody').scrollTop=y}});
$('ovw').addEventListener('input',e=>{if(e.target.id==='ovQ'){OV.q=e.target.value;const pos=e.target.selectionStart;drawOv();const q=$('ovQ');q.focus();q.setSelectionRange(pos,pos)}});

/* ================= 啟動 ================= */
render();
try{if(localStorage.getItem(GITCFG)||localStorage.getItem(OLDGIT))setSync('','已設定 GitHub，有變更時記得上傳')}catch(e){}
</script>
</body>
