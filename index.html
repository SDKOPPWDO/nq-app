<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NQ 交易筆記</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
/* 版面：左側頁面清單 / 右側 Notion 風格區塊編輯器 */
:root{
  --bg:#191919;--side:#202020;--panel:#252525;--hover:#2c2c2c;--line:#2f2f2f;--line2:#3d3d3d;
  --ink:#e6e6e3;--ink2:#c4c4c0;--muted:#9b9b97;--faint:#62625f;--accent:#5e9de6;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:16px/1.6 var(--f-body);display:flex;overflow:hidden}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
code{font-family:var(--f-mono);font-size:.86em;background:rgb(135 131 120 / .18);color:#eb8a7f;padding:.1em .35em;border-radius:4px}
a{color:var(--accent)}

/* 顏色（文字 / 背景），Notion 深色系 */
.tc-gray{color:#a3a39f}.tc-brown{color:#c59a84}.tc-orange{color:#e3975c}.tc-yellow{color:#dcb35e}.tc-green{color:#5fbb87}
.tc-blue{color:#6fa6ea}.tc-purple{color:#b386e2}.tc-pink{color:#e47cb0}.tc-red{color:#ec716d}
.bg-gray{background:#2f2f2f}.bg-brown{background:#3b2b23}.bg-orange{background:#45301f}.bg-yellow{background:#433822}.bg-green{background:#1e3729}
.bg-blue{background:#1a3045}.bg-purple{background:#322747}.bg-pink{background:#412737}.bg-red{background:#472523}
.tx span[class*="bg-"]{border-radius:3px;padding:0 2px}

/* 側欄 */
#side{width:258px;flex:none;background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;z-index:20}
.sh{display:flex;align-items:center;gap:8px;padding:14px 14px 8px}
.sh b{font-size:14px;font-weight:700;letter-spacing:.02em}
.sh .x{margin-left:auto}
#search{margin:4px 10px 8px;background:var(--panel);border:1px solid var(--line2);border-radius:6px;padding:5px 9px;font-size:13.5px;outline:none}
#search:focus{border-color:var(--accent)}
#plist{flex:1;overflow:auto;padding:2px 6px 10px;min-height:0}
.pi{display:flex;align-items:center;gap:8px;padding:4px 8px;border-radius:6px;cursor:pointer;font-size:14px;color:var(--ink2)}
.pi:hover{background:var(--hover)}
.pi.on{background:#2f2f2f;color:var(--ink);font-weight:500}
.pi .pic{width:20px;text-align:center;flex:none}
.pi .pt{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pi .pdel{border:0;background:none;color:var(--faint);cursor:pointer;opacity:0;padding:0 4px;font-size:16px;line-height:1}
.pi:hover .pdel{opacity:1}.pi .pdel:hover{color:#ec716d}
.pempty{padding:10px;color:var(--faint);font-size:13px}
.sfoot{border-top:1px solid var(--line);padding:8px 8px 12px;display:flex;flex-direction:column;gap:2px}
.sbtn{border:0;background:none;text-align:left;padding:6px 8px;border-radius:6px;cursor:pointer;color:var(--muted);font-size:14px;display:flex;gap:8px;align-items:center}
.sbtn:hover{background:var(--hover);color:var(--ink)}

/* 主區 */
#main{flex:1;min-width:0;display:flex;flex-direction:column;min-height:0}
header.top{flex:none;height:46px;display:flex;align-items:center;gap:8px;padding:0 12px;border-bottom:1px solid var(--line)}
#crumb{font-size:14px;color:var(--ink2);overflow:hidden;white-space:nowrap;text-overflow:ellipsis;min-width:0;flex:1}
.tools{display:flex;gap:4px;align-items:center;flex-wrap:nowrap}
.btn{border:0;background:none;border-radius:6px;padding:4px 9px;cursor:pointer;font-size:13.5px;color:var(--ink2);white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.btn:hover{background:var(--hover);color:var(--ink)}
.btn.primary{background:var(--accent);color:#0b1626;font-weight:500}
.sync{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);white-space:nowrap;margin-left:6px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--faint)}
.dot.ok{background:#5fbb87}.dot.dirty{background:#dcb35e}.dot.err{background:#ec716d}
#menuBtn{display:none}
#scroll{flex:1;overflow:auto;min-height:0}
.page{max-width:900px;margin:0 auto;padding:56px 96px 40vh}

/* 頁面標頭 */
.phead{margin-bottom:10px}
#picon{font-size:66px;line-height:1.1;border:0;background:none;padding:4px;border-radius:8px;cursor:pointer;margin-left:-4px}
#picon:hover{background:var(--hover)}
#picon.none{display:none}
.phbtns{display:flex;gap:4px;margin:6px 0 4px -8px;opacity:0;transition:opacity .15s}
.phead:hover .phbtns{opacity:1}
#ptitle{font-size:40px;font-weight:700;line-height:1.2;outline:none;margin:6px 0 4px;overflow-wrap:anywhere}
#ptitle:empty::before{content:attr(data-ph);color:var(--faint)}
#pmeta{font-size:12.5px;color:var(--faint);margin-bottom:22px}

/* 區塊 */
#blocks{position:relative}
.blk{position:relative;display:flex;margin-left:calc(var(--ind,0)*26px);padding:1px 0}
.blk.hid{display:none}
.gut{position:absolute;left:-50px;top:4px;display:flex;gap:1px;opacity:0;transition:opacity .1s}
.blk:hover>.gut,.blk.menu>.gut{opacity:1}
.gut button{width:23px;height:24px;border:0;background:none;color:var(--faint);border-radius:4px;cursor:pointer;padding:0;font-size:16px;line-height:1;display:grid;place-items:center}
.gut button:hover{background:var(--hover);color:var(--ink2)}
.gut [data-hd]{cursor:grab;font-size:13px;letter-spacing:-2px}
.bc{flex:1;min-width:0;display:flex;align-items:flex-start;gap:6px;padding:3px 4px;border-radius:5px}
.tx{flex:1;min-width:0;outline:none;white-space:pre-wrap;overflow-wrap:anywhere;min-height:1.6em;caret-color:var(--ink)}
.tx:empty::before{content:attr(data-ph);color:var(--faint);pointer-events:none}
.t-p .tx:empty:not(:focus)::before{content:""}
.t-h1{margin-top:1.3em}.t-h2{margin-top:1.05em}.t-h3{margin-top:.75em}
.t-h1 .tx{font-size:30px;font-weight:700;line-height:1.3}
.t-h2 .tx{font-size:24px;font-weight:700;line-height:1.35}
.t-h3 .tx{font-size:19.5px;font-weight:700;line-height:1.4}
.t-h1 .gut{top:12px}.t-h2 .gut{top:9px}.t-h3 .gut{top:6px}
.pre{flex:none;min-width:22px;text-align:center;user-select:none}
.dot2{font-size:20px;line-height:1.25}
.no{font-variant-numeric:tabular-nums;min-width:24px;text-align:right;padding-right:2px}
.chk{width:17px;height:17px;min-width:17px;margin:4px 3px 0 3px;border:1.5px solid var(--muted);border-radius:3px;background:none;cursor:pointer;padding:0;color:#fff;font-size:12px;line-height:1;display:grid;place-items:center}
.chk.on{background:var(--accent);border-color:var(--accent)}
.done .tx{text-decoration:line-through;color:var(--faint)}
.tgl{border:0;background:none;cursor:pointer;color:var(--ink2);font-size:11px;padding:0;height:25px;border-radius:4px;transition:transform .12s}
.tgl:hover{background:var(--hover)}
.tgl.open{transform:rotate(90deg)}
.t-quote .bc{border-left:3px solid currentColor;border-radius:0;padding-left:14px;margin-left:2px}
.t-quote .tx{font-size:17px}
.t-callout .bc{padding:14px 16px 14px 12px;gap:10px;border:1px solid rgb(255 255 255 / .05);margin:3px 0}
.emo{border:0;background:none;font-size:20px;line-height:1.3;padding:0 2px;border-radius:4px;cursor:pointer}
.emo:hover{background:rgb(255 255 255 / .08)}
.t-divider .bc{padding:10px 4px;cursor:pointer}
.t-divider hr{border:0;border-top:1px solid var(--line2);margin:0;width:100%}
.t-divider.sel .bc{background:rgb(94 157 230 / .18)}
#tail{min-height:120px;cursor:text}
#dropLine{position:absolute;left:0;right:0;height:3px;background:var(--accent);border-radius:2px;pointer-events:none;opacity:.8}
.blk.dragging{opacity:.35}

/* 浮動選單 */
.pop{position:fixed;z-index:50;background:var(--panel);border:1px solid var(--line2);border-radius:9px;box-shadow:0 12px 36px rgb(0 0 0 / .55);padding:6px}
.pop .mh{font-size:11.5px;color:var(--muted);padding:6px 8px 4px;font-weight:500}
#slash{width:250px;max-height:340px;overflow:auto}
#slash button,.bmt button{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;border-radius:5px;padding:5px 8px;cursor:pointer;text-align:left;font-size:14px}
#slash button.on,#slash button:hover,.bmt button:hover,.bma button:hover{background:var(--hover)}
.si{width:28px;height:28px;flex:none;border:1px solid var(--line2);border-radius:5px;display:grid;place-items:center;font-size:13px;font-weight:700;background:var(--bg)}
#bmenu{width:270px;max-height:min(560px,80vh);overflow:auto}
.bmt{display:grid;grid-template-columns:1fr 1fr;gap:1px}
.bmt button{font-size:13px;padding:4px 6px;gap:7px}
.bmt .si{width:22px;height:22px;font-size:11px}
.sws{display:flex;flex-wrap:wrap;gap:4px;padding:2px 6px 6px}
.sw{width:24px;height:24px;border-radius:5px;border:1px solid var(--line2);cursor:pointer;font-weight:700;font-size:13px;padding:0}
.sw:not([class*="bg-"]){background:var(--bg)}
.sw[class*="bg-"]{border-color:rgb(255 255 255 / .14)}
.sw[aria-pressed="true"]{outline:2px solid var(--accent);outline-offset:1px}
.bma{display:flex;flex-direction:column;border-top:1px solid var(--line);margin-top:4px;padding-top:4px}
.bma button{border:0;background:none;text-align:left;padding:5px 8px;border-radius:5px;cursor:pointer;font-size:13.5px}
.bma .danger{color:#ec716d}
#emoji{width:330px}
.eg{display:grid;grid-template-columns:repeat(9,1fr);gap:2px;padding:4px}
.eg button{border:0;background:none;font-size:22px;line-height:1;padding:5px 0;border-radius:5px;cursor:pointer}
.eg button:hover{background:var(--hover)}
.erow{display:flex;gap:6px;padding:6px 4px 2px}
.erow input{flex:1;min-width:0;background:var(--bg);border:1px solid var(--line2);border-radius:6px;padding:4px 8px;font-size:14px;outline:none}
#newMenu{width:240px}
#newMenu button{display:flex;gap:10px;align-items:center;width:100%;border:0;background:none;border-radius:5px;padding:7px 8px;cursor:pointer;text-align:left;font-size:14px}
#newMenu button:hover{background:var(--hover)}
#newMenu small{display:block;color:var(--muted);font-size:12px}

/* 選取文字的格式工具列 */
#fmt{display:flex;gap:2px;padding:4px;align-items:center;flex-wrap:wrap;max-width:330px}
#fmt button{border:0;background:none;min-width:28px;height:28px;border-radius:5px;cursor:pointer;font-size:14px;padding:0 6px}
#fmt button:hover{background:var(--hover)}
#fmt .sep{width:1px;height:18px;background:var(--line2);margin:0 3px}
#fmtColors{width:100%;border-top:1px solid var(--line);margin-top:4px;padding-top:2px}
#fmtColors .sws{padding:2px}

/* GitHub 面板 / 提示 */
.overlay{position:fixed;inset:0;background:rgb(0 0 0 / .55);display:flex;align-items:flex-start;justify-content:center;padding:60px 16px 16px;z-index:60;overflow:auto}
.sheet{background:var(--panel);border:1px solid var(--line2);border-radius:12px;width:100%;max-width:540px;padding:20px;display:flex;flex-direction:column;gap:14px}
.sheet h3{margin:0;font-size:18px}
.gform{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.gform .wide,.gform .actions{grid-column:1/-1}
.gform .actions{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.fl{display:flex;flex-direction:column;gap:5px;font-size:12.5px;color:var(--muted)}
.fl input{background:var(--bg);border:1px solid var(--line2);border-radius:6px;padding:7px 9px;font-size:14px;color:var(--ink);outline:none}
.fl input:focus{border-color:var(--accent)}
.sheet .btn{border:1px solid var(--line2)}
.hint{font-size:12.5px;color:var(--muted)}
.log{font:12px var(--f-mono);color:var(--muted);white-space:pre-wrap;min-height:1.5em}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#333;border:1px solid var(--line2);border-radius:8px;padding:8px 14px;display:flex;gap:12px;align-items:center;z-index:70;box-shadow:0 8px 24px rgb(0 0 0 / .5);font-size:14px;max-width:calc(100vw - 32px)}
.linkb{background:none;border:0;color:var(--accent);cursor:pointer;font-size:14px;padding:0}

@media (max-width:860px){
  .page{padding:36px 22px 40vh 44px}
  #side{position:fixed;top:0;bottom:0;left:0;box-shadow:12px 0 30px rgb(0 0 0 / .5);transform:translateX(-105%);transition:transform .18s}
  body.sideopen #side{transform:none}
  #menuBtn{display:inline-flex}
  .gut{left:-44px}
  .sync span:last-child{display:none}
}
@media (hover:none){.gut{opacity:.55}.phbtns{opacity:1}.pi .pdel{opacity:1}}
</style>
</head>
<body>

<aside id="side">
  <div class="sh"><b>📒 NQ 交易筆記</b><button class="btn x" id="sideClose" hidden aria-label="關閉側欄">✕</button></div>
  <input id="search" type="search" placeholder="搜尋頁面或內容…" aria-label="搜尋">
  <div id="plist"></div>
  <div class="sfoot">
    <button class="sbtn" id="newPage">＋ 新增頁面</button>
    <button class="sbtn" id="oldImport" hidden>🗂️ 匯入舊畫布資料</button>
  </div>
</aside>

<div id="main">
  <header class="top">
    <button class="btn" id="menuBtn" aria-label="頁面清單">☰</button>
    <div id="crumb"></div>
    <div class="tools">
      <button class="btn" id="btnGit">GitHub 同步</button>
      <button class="btn" id="btnExport">匯出</button>
      <label class="btn" for="fileImport" style="margin:0">匯入</label>
      <input type="file" id="fileImport" accept="application/json,.json" hidden>
      <span class="sync"><span class="dot" id="syncDot"></span><span id="syncText">自動儲存在此瀏覽器</span></span>
    </div>
  </header>
  <div id="scroll">
    <div class="page">
      <div class="phead">
        <button id="picon" title="更換圖示"></button>
        <div class="phbtns"><button class="btn" id="addIcon">😀 新增圖示</button></div>
        <div id="ptitle" contenteditable="true" spellcheck="false" data-ph="未命名"></div>
        <div id="pmeta"></div>
      </div>
      <div id="blocks"></div>
      <div id="tail" title="點這裡繼續寫"></div>
    </div>
  </div>
</div>

<div class="pop" id="slash" hidden></div>
<div class="pop" id="bmenu" hidden></div>
<div class="pop" id="emoji" hidden></div>
<div class="pop" id="newMenu" hidden></div>
<div class="pop" id="fmt" hidden>
  <button data-f="bold" title="粗體 (Ctrl+B)"><b>B</b></button>
  <button data-f="italic" title="斜體 (Ctrl+I)"><i>i</i></button>
  <button data-f="underline" title="底線 (Ctrl+U)"><u>U</u></button>
  <button data-f="strikeThrough" title="刪除線"><s>S</s></button>
  <button data-f="code" title="程式碼">&lt;/&gt;</button>
  <span class="sep"></span>
  <button data-f="colors" title="文字顏色 / 背景"><span class="tc-orange">A</span> ▾</button>
  <button data-f="clear" title="清除格式">⌫</button>
  <div id="fmtColors" hidden></div>
</div>
<div id="toast" hidden></div>

<div class="overlay" id="gitOverlay" hidden>
  <div class="sheet" role="dialog" aria-labelledby="gitTitle">
    <h3 id="gitTitle">GitHub 同步設定</h3>
    <p class="hint" style="margin:0">資料以一個 JSON 檔存在你的 repo。Token 請用 Fine-grained token，只給這個 repo 的 Contents 讀寫權限。設定只存在這台電腦的瀏覽器。下載舊版畫布的 JSON 時，會自動轉成一個新頁面。</p>
    <div class="gform">
      <label class="fl">擁有者 (owner)<input id="gOwner" placeholder="your-github-name"></label>
      <label class="fl">Repo 名稱<input id="gRepo" placeholder="nq-journal"></label>
      <label class="fl">分支<input id="gBranch" value="main"></label>
      <label class="fl">檔案路徑<input id="gPath" value="data/nq-notes.json"></label>
      <label class="fl wide">Personal Access Token<input id="gToken" type="password" placeholder="github_pat_…" autocomplete="off"></label>
      <div class="actions">
        <button class="btn" id="gClose">關閉</button>
        <button class="btn" id="gPull">從 GitHub 下載</button>
        <button class="btn primary" id="gPush">上傳到 GitHub</button>
      </div>
    </div>
    <div class="log" id="gLog"></div>
  </div>
</div>

<script>
/* ================= 常數 ================= */
const KEY='nq-notes-v1',GITCFG='nq-notes-git',OLDKEY='nq-canvas-v3',OLDGIT='nq-canvas-git';
const TYPES={p:'文字',h1:'大標題',h2:'中標題',h3:'小標題',bullet:'項目清單',num:'編號清單',todo:'待辦事項',toggle:'摺疊清單',quote:'引言',callout:'標示框',divider:'分隔線'};
const PH={p:'輸入文字，或輸入「/」選擇區塊類型',h1:'大標題',h2:'中標題',h3:'小標題',bullet:'清單',num:'清單',todo:'待辦事項',toggle:'摺疊標題',quote:'引言',callout:'輸入內容…',divider:''};
const COLORS=[['','預設'],['gray','灰'],['brown','棕'],['orange','橘'],['yellow','黃'],['green','綠'],['blue','藍'],['purple','紫'],['pink','粉'],['red','紅']];
const CK=new Set(COLORS.map(c=>c[0]).filter(Boolean));
const LISTY=['bullet','num','todo'];
const SLASH=[
  ['p','Aa','文字','text p 文字 段落 wenzi'],
  ['h1','H1','大標題','h1 heading 標題 大'],
  ['h2','H2','中標題','h2 heading 標題 中'],
  ['h3','H3','小標題','h3 heading 標題 小'],
  ['bullet','•','項目清單','bullet list ul 清單 項目'],
  ['num','1.','編號清單','number ol 編號 清單'],
  ['todo','☑','待辦事項','todo check 待辦 勾選'],
  ['toggle','▸','摺疊清單','toggle 摺疊 收合'],
  ['quote','❝','引言','quote 引言 引用'],
  ['callout:gray:💬','💬','標示框（灰）','callout box 框 標示 灰'],
  ['callout:blue:💡','💡','藍色框・觀察','callout blue 藍 觀察 框'],
  ['callout:yellow:🤔','🤔','黃色框・想法','callout yellow 黃 想法 框'],
  ['callout:green:✅','✅','綠色框・成立','callout green 綠 成立 支持 框'],
  ['callout:red:⚠️','⚠️','紅色框・風險','callout red 紅 風險 反駁 框'],
  ['callout:purple:🎯','🎯','紫色框・策略','callout purple 紫 策略 框'],
  ['divider','—','分隔線','divider hr 分隔 線'],
];
const EMOJIS='📒 📈 📉 📊 💹 🧠 💡 🤔 💭 👀 🔍 🎯 🧭 📌 📍 📝 🗓️ ⏰ 🕘 ⏳ ✅ ❌ ⚠️ 🛑 🚫 🔥 ⭐ 🚀 🏁 💰 💸 🛡️ ⚡ 🟢 🔴 🟡 🔵 🟣 ⬆️ ⬇️ ↔️ 🐂 🐻 🌅 🌙 ☕ 🧪 📚 🗂️ 📣 ❓ ❗ 👋 🎉 😤 😌 🙏 💬 ➖'.split(' ');

/* ================= 工具 ================= */
const $=id=>document.getElementById(id);
const uid=()=>Math.random().toString(36).slice(2,10);
const now=()=>new Date().toISOString();
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const tpe=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Taipei'});
const today=()=>tpe.format(new Date());
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));

/* 只保留安全的行內格式 */
const ALLOW={B:1,STRONG:1,I:1,EM:1,U:1,S:1,STRIKE:1,CODE:1,BR:1,SPAN:1,A:1};
function cleanNode(node){
  [...node.childNodes].forEach(c=>{
    if(c.nodeType===3)return;
    if(c.nodeType!==1){c.remove();return}
    cleanNode(c);const tag=c.tagName;
    if(!ALLOW[tag]){if((tag==='DIV'||tag==='P')&&c.previousSibling)c.before(document.createElement('br'));c.replaceWith(...c.childNodes);return}
    [...c.attributes].forEach(a=>{
      if(tag==='SPAN'&&a.name==='class'){const v=a.value.split(/\s+/).filter(x=>/^(tc|bg)-[a-z]+$/.test(x)).join(' ');v?c.setAttribute('class',v):c.removeAttribute('class');return}
      if(tag==='A'&&a.name==='href'&&/^https?:\/\//i.test(a.value))return;
      c.removeAttribute(a.name)});
    if(tag==='SPAN'&&!c.getAttribute('class')){c.replaceWith(...c.childNodes);return}
    if(tag==='A'){c.setAttribute('target','_blank');c.setAttribute('rel','noopener')}
  });
}
function clean(html){const t=document.createElement('template');t.innerHTML=String(html||'');cleanNode(t.content);const s=t.innerHTML;return s==='<br>'?'':s}
const plain=html=>{const t=document.createElement('template');t.innerHTML=html||'';return t.content.textContent||''};

function norm(d){
  d=d&&typeof d==='object'?d:{};
  d.pages=(Array.isArray(d.pages)?d.pages:[]).filter(p=>p&&typeof p==='object').map(p=>{
    const q=mkPage(p);q.id=p.id||uid();q.title=String(p.title||'');q.icon=String(p.icon||'');
    q.blocks=(Array.isArray(p.blocks)?p.blocks:[]).filter(b=>b&&typeof b==='object').map(b=>{
      const t=TYPES[b.type]?b.type:'p';
      const n=Object.assign({},b,{id:b.id||uid(),type:t,html:t==='divider'?'':clean(b.html),indent:clamp(parseInt(b.indent)||0,0,8)});
      if(n.color&&!CK.has(n.color))delete n.color;
      if(n.bg&&!CK.has(n.bg))delete n.bg;
      if(n.emoji!==undefined)n.emoji=String(n.emoji).slice(0,16);
      return n});
    if(!q.blocks.length)q.blocks=[mkB('p')];
    return q});
  if(!d.pages.length)d.pages=[mkPage({blocks:[mkB('p')]})];
  if(!d.pages.some(p=>p.id===d.currentId))d.currentId=d.pages[0].id;
  d.version=1;return d;
}

/* ================= 游標工具 ================= */
const sel=()=>getSelection();
function caretOff(el){const s=sel();if(!s.rangeCount)return 0;const r=s.getRangeAt(0);if(!el.contains(r.startContainer)&&r.startContainer!==el)return 0;const p=document.createRange();p.selectNodeContents(el);p.setEnd(r.startContainer,r.startOffset);return p.toString().length}
function atStart(el){const s=sel();return s.rangeCount&&s.isCollapsed&&caretOff(el)===0}
function atEnd(el){const s=sel();if(!s.rangeCount||!s.isCollapsed)return false;const r=s.getRangeAt(0),p=document.createRange();p.selectNodeContents(el);p.setStart(r.endContainer,r.endOffset);return p.toString().length===0}
function setCaret(el,n){
  const s=sel(),r=document.createRange(),w=document.createTreeWalker(el,NodeFilter.SHOW_TEXT);let t,left=n;
  while((t=w.nextNode())){if(left<=t.length){r.setStart(t,left);r.collapse(true);s.removeAllRanges();s.addRange(r);return}left-=t.length}
  r.selectNodeContents(el);r.collapse(false);s.removeAllRanges();s.addRange(r);
}
function focusBlock(id,pos='end'){
  const el=txOf(id);if(!el)return;el.focus({preventScroll:true});
  if(typeof pos==='number')setCaret(el,pos);else{const r=document.createRange();r.selectNodeContents(el);r.collapse(pos!=='end');sel().removeAllRanges();sel().addRange(r)}
  const b=el.getBoundingClientRect(),sc=$('scroll').getBoundingClientRect();
  if(b.top<sc.top+40||b.bottom>sc.bottom-40)el.scrollIntoView({block:'center'});
}
function stripChars(el,n){const w=document.createTreeWalker(el,NodeFilter.SHOW_TEXT);let t;while(n>0&&(t=w.nextNode())){const k=Math.min(n,t.length);t.deleteData(0,k);n-=k}}

/* ================= 渲染 ================= */
function blockHTML(b,ctx){
  const ind=b.indent||0,gut=`<div class="gut"><button data-plus title="在下方新增區塊">+</button><button data-hd title="點擊：選單　拖曳：移動">⋮⋮</button></div>`;
  if(b.type==='divider')return `<div class="blk t-divider${ctx.hidden?' hid':''}" data-id="${b.id}" style="--ind:${ind}">${gut}<div class="bc"><hr></div></div>`;
  let pre='';
  if(b.type==='bullet')pre=`<span class="pre dot2">${['•','◦','▪'][ind%3]}</span>`;
  if(b.type==='num')pre=`<span class="pre no">${ctx.n}.</span>`;
  if(b.type==='todo')pre=`<button class="pre chk${b.checked?' on':''}" data-chk aria-label="勾選">${b.checked?'✓':''}</button>`;
  if(b.type==='toggle')pre=`<button class="pre tgl${b.collapsed?'':' open'}" data-tog aria-label="展開或收合">▶</button>`;
  if(b.type==='callout')pre=`<button class="pre emo" data-emo title="更換圖示">${esc(b.emoji||'💡')}</button>`;
  const bg=b.bg!==undefined?b.bg:(b.type==='callout'?'gray':'');
  return `<div class="blk t-${b.type}${b.color?' tc-'+b.color:''}${b.type==='todo'&&b.checked?' done':''}${ctx.hidden?' hid':''}" data-id="${b.id}" style="--ind:${ind}">${gut}<div class="bc${bg?' bg-'+bg:''}">${pre}<div class="tx" contenteditable="true" spellcheck="false" data-ph="${esc(PH[b.type])}">${b.html||''}</div></div></div>`;
}
function renderSide(){
  const q=($('search').value||'').trim().toLowerCase();
  const hit=p=>!q||(p.title||'').toLowerCase().includes(q)||p.blocks.some(b=>plain(b.html).toLowerCase().includes(q));
  $('plist').innerHTML=db.pages.filter(hit).map(p=>`<div class="pi${p.id===db.currentId?' on':''}" data-pg="${p.id}"><span class="pic">${esc(p.icon||'📄')}</span><span class="pt">${esc(p.title||'未命名')}</span><button class="pdel" data-pdel="${p.id}" title="刪除頁面" aria-label="刪除頁面">×</button></div>`).join('')||'<div class="pempty">找不到符合的頁面</div>';
  try{$('oldImport').hidden=!localStorage.getItem(OLDKEY)||!!db.importedCanvas}catch(e){}
}
function renderHead(){
  const p=cur();
  $('picon').textContent=p.icon||'';$('picon').classList.toggle('none',!p.icon);$('addIcon').hidden=!!p.icon;
  if(document.activeElement!==$('ptitle'))$('ptitle').textContent=p.title;
  $('pmeta').textContent=`建立 ${fmt(p.createdAt)}・最後編輯 ${fmt(p.updatedAt)}`;
  $('crumb').textContent=`${p.icon||'📄'}  ${p.title||'未命名'}`;
  document.title=(p.title||'未命名')+'・NQ 交易筆記';
}
function renderBlocks(fid,pos){
  const p=cur();let hide=null;const cnt=[],prev=[];
  $('blocks').innerHTML=p.blocks.map(b=>{
    const ind=b.indent||0;let hidden=false;
    if(hide!=null&&ind>hide)hidden=true;else hide=null;
    if(!hidden&&b.type==='toggle'&&b.collapsed)hide=ind;
    cnt.length=ind+1;prev.length=ind+1;let n=0;
    if(b.type==='num'){n=prev[ind]==='num'?(cnt[ind]||0)+1:1;cnt[ind]=n}
    prev[ind]=b.type;
    return blockHTML(b,{n,hidden});
  }).join('');
  if(fid)focusBlock(fid,pos);
}
function render(fid,pos){renderSide();renderHead();renderBlocks(fid,pos)}

/* ================= 區塊操作 ================= */
function applyType(b,key){
  const p=cur(),i=p.blocks.indexOf(b);if(i<0)return;
  if(key.startsWith('callout:')){const[,c,e]=key.split(':');b.type='callout';b.bg=c;b.emoji=e}
  else if(key==='divider'){b.type='divider';b.html='';delete b.bg;delete b.color;const nb=mkB('p','',{indent:b.indent||0});p.blocks.splice(i+1,0,nb);touch();render(nb.id,'start');return}
  else{b.type=key;if(key==='toggle')b.collapsed=false;if(key==='callout'){if(b.bg===undefined)b.bg='gray';b.emoji=b.emoji||'💡'}}
  touch();render(b.id,'end');
}
function shiftIndent(i,d,el){
  const bs=cur().blocks,b=bs[i],j=subEnd(bs,i),off=el?caretOff(el):'end';
  if(d>0){const pv=bs[i-1];if(!pv||(b.indent||0)>(pv.indent||0))return}
  if(d<0&&!(b.indent>0))return;
  for(let k=i;k<j;k++)bs[k].indent=clamp((bs[k].indent||0)+d,0,8);
  touch();render(b.id,off);
}
function insertAfter(i,nb){cur().blocks.splice(i+1,0,nb)}

function onEnter(b,i,el){
  const p=cur(),txt=el.textContent;
  if(['bullet','num','todo','toggle','quote'].includes(b.type)&&!txt.trim()){
    if(b.indent>0){shiftIndent(i,-1,el);return}
    b.type='p';touch();render(b.id,'start');return;
  }
  if(txt.trim()&&atStart(el)){
    const nb=mkB(LISTY.includes(b.type)?b.type:'p','',{indent:b.indent||0});
    p.blocks.splice(i,0,nb);touch();render(b.id,'start');return;
  }
  const s=sel(),r=s.getRangeAt(0);r.deleteContents();
  const tail=document.createRange();tail.selectNodeContents(el);tail.setStart(r.startContainer,r.startOffset);
  const box=document.createElement('div');box.appendChild(tail.extractContents());
  b.html=clean(el.innerHTML);
  let type=LISTY.includes(b.type)?b.type:'p',ind=b.indent||0,at=i;
  if(b.type==='toggle'){if(b.collapsed)at=subEnd(p.blocks,i)-1;else ind=ind+1}
  const nb=mkB(type,clean(box.innerHTML),{indent:ind});
  insertAfter(at,nb);touch();render(nb.id,'start');
}
function onBackspace(b,i,el,e){
  const p=cur();
  if(b.type!=='p'){e.preventDefault();b.type='p';touch();render(b.id,'start');return}
  if(b.indent>0){e.preventDefault();shiftIndent(i,-1,el);return}
  let j=i-1;while(j>=0&&blkEl(p.blocks[j].id)?.classList.contains('hid'))j--;
  if(j<0)return;e.preventDefault();
  const pv=p.blocks[j];
  if(pv.type==='divider'){p.blocks.splice(j,1);touch();render(b.id,'start');return}
  const off=plain(pv.html).length;pv.html=clean((pv.html||'')+(b.html||''));
  p.blocks.splice(i,1);touch();render(pv.id,off);
}
function moveBlock(i,dir){
  const bs=cur().blocks,j=subEnd(bs,i),ind=bs[i].indent||0;
  if(dir<0){let k=i-1;while(k>=0&&(bs[k].indent||0)>ind)k--;if(k<0)return;const seg=bs.splice(i,j-i);bs.splice(k,0,...seg)}
  else{if(j>=bs.length)return;const seg=bs.splice(i,j-i),e2=subEnd(bs,i);bs.splice(e2,0,...seg)}
  touch();render();
}
function dupBlock(i){
  const bs=cur().blocks,j=subEnd(bs,i),cp=bs.slice(i,j).map(b=>Object.assign(structuredClone(b),{id:uid()}));
  bs.splice(j,0,...cp);touch();render(cp[0].id,'end');toast('已複製區塊');
}
function delBlock(i){
  const p=cur(),snapB=JSON.stringify(p.blocks),j=subEnd(p.blocks,i),k=j-i;
  p.blocks.splice(i,j-i);if(!p.blocks.length)p.blocks.push(mkB('p'));
  touch();render();
  toast(k>1?`已刪除 ${k} 個區塊`:'已刪除區塊',()=>{p.blocks=JSON.parse(snapB);touch();render()});
}

/* ================= 編輯事件 ================= */
const B$=$('blocks');
const SHORT=[[/^###[\s ]/,'h3'],[/^##[\s ]/,'h2'],[/^#[\s ]/,'h1'],[/^[-*•][\s ]/,'bullet'],[/^1[.．][\s ]/,'num'],[/^(\[\]|【】)[\s ]?/,'todo'],[/^>[\s ]/,'quote'],[/^[!！][\s ]/,'callout']];
B$.addEventListener('input',e=>{
  const el=e.target.closest('.tx');if(!el)return;
  const b=bById(el.closest('.blk').dataset.id);if(!b)return;
  if(el.innerHTML==='<br>')el.innerHTML='';
  b.html=el.innerHTML;
  if(!e.isComposing){

  const q=slash.q.toLowerCase(),items=SLASH.filter(s=>(!cv||s[0]!=='divider')&&(!q||s[2].toLowerCase().includes(q)||s[3].toLowerCase().includes(q)));

  m.innerHTML=`<div class="mh">${cv?(q?`轉換成・搜尋「${esc(slash.q)}」`:'轉換成　↑↓ 選擇・Enter 確定・可打英文篩選（h1、todo…）'):(q?`搜尋「${esc(slash.q)}」`:'選擇區塊類型　↑↓ 選擇・Enter 確定')}</div>`+(items.length?items.map((s,i)=>`<button type="button" data-si="${i}" class="${i===slash.act?'on':''}"><span class="si">${esc(s[1])}</span><span>${esc(s[2])}</span></button>`).join(''):'<div class="mh">沒有符合的區塊，按 Esc 關閉</div>');

  if(selDiv&&(e.key==='Backspace'||e.key==='Delete')&&!e.target.closest('input,textarea,[contenteditable]')){e.preventDefault();const i=cur().blocks.findIndex(b=>b.id===selDiv);selDiv=null;if(i>=0)delBlock(i)}
});

let toastT;
function toast(msg,undoFn){
  const t=$('toast');t.innerHTML=`<span>${esc(msg)}</span>${undoFn?'<button class="linkb" id="toastUndo">復原</button>':''}`;t.hidden=false;
  if(undoFn)$('toastUndo').onclick=()=>{undoFn();t.hidden=true};
  clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,4500);
}

/* ================= 舊版畫布 → 頁面 ================= */
function fromCanvas(d){
  const N=Array.isArray(d.nodes)?d.nodes:[],by=t=>N.filter(n=>n.type===t),B=[],e=esc,br=s=>e(s).replace(/\n/g,'<br>');
  const add=(type,html,o={})=>B.push(mkB(type,html,o));
  const dates=[...new Set(by('obs').map(o=>o.date).filter(Boolean))].sort().reverse();
  if(dates.length)add('h1','👀 觀察');
  dates.forEach(dt=>{add('h2','🗓️ '+e(dt));
    by('obs').filter(o=>o.date===dt).sort((a,b)=>(a.createdAt||'').localeCompare(b.createdAt||'')).forEach(o=>{
      const head=[o.time?`<b>${e(o.time)} ET</b>`:'',o.title?`<b>${e(o.title)}</b>`:''].filter(Boolean).join(' ');
      const pts=(o.pts||[]).filter(x=>String(x).trim()),lines=String(o.text||'').split('\n');
      add('bullet',head||e(lines[0])||'（空白）');
      pts.forEach(x=>add('num',br(x),{indent:1}));
      const rest=head?o.text:lines.slice(1).join('\n');if(rest&&rest.trim())add('p',br(rest.trim()),{indent:1});
    })});
  const ideas=by('idea');if(ideas.length)add('h1','🧠 觀點');
  ideas.forEach(i=>{add('h3',e(i.title||'（未命名觀點）'));if(i.text)add('p',br(i.text));if(i.condition)add('callout','適用條件：'+br(i.condition),{bg:'gray',emoji:'📌'})});
  const strats=by('strat');if(strats.length)add('h1','🎯 策略');
  const ACT={long:'做多',short:'做空',wait:'等待觀察',skip:'放棄不做'},AC={long:'green',short:'red',wait:'yellow',skip:'gray'};
  const rec=(l,dp)=>(l||[]).forEach((s,k)=>{const lab=l.length>1?'如果'+('①②③④⑤⑥⑦⑧⑨'[k]||''):dp===0?'先看到':'然後';add('bullet',`<b>${lab}</b>：${e(s.text||'')}${s.act&&ACT[s.act]?` → <span class="tc-${AC[s.act]}"><b>${ACT[s.act]}</b></span>`:''}`,{indent:Math.min(dp,8)});rec(s.kids,dp+1)});
  strats.forEach(s=>{add('h3',e(s.title||'（未命名策略）'));if(s.text)add('p',br(s.text));rec(s.sop,0)});
  const vals=by('val').sort((a,b)=>(b.date||'').localeCompare(a.date||''));if(vals.length)add('h1','✅ 驗證');
  const VD={support:['支持','green','✅'],against:['反駁','red','❌'],neutral:['中性','yellow','➖']};
  vals.forEach(v=>{const x=VD[v.verdict]||['','gray','💬'];add('callout',`<b>${x[0]}</b>・${e(v.date||'')}${v.title?'<br><b>'+e(v.title)+'</b>':''}${v.text?'<br>'+br(v.text):''}`,{bg:x[1],emoji:x[2]})});
  const exts=by('ext');if(exts.length)add('h1','💭 延伸');
  exts.forEach(x=>{add('bullet',e(x.title||'（未命名）'));if(x.text)add('p',br(x.text),{indent:1})});
  return mkPage({icon:'🗂️',title:'舊畫布匯入',blocks:B.length?B:[mkB('p')]});
}
$('oldImport').onclick=()=>{
  try{const d=JSON.parse(localStorage.getItem(OLDKEY)||'null');if(!d||!Array.isArray(d.nodes)){toast('找不到舊畫布資料');return}
    const p=fromCanvas(d);db.pages.push(p);db.currentId=p.id;db.importedCanvas=true;saveSoon();render();toast(`已把舊畫布的 ${d.nodes.length} 個節點轉成一個頁面`)}
  catch(err){toast('舊畫布資料讀取失敗')}
};

/* ================= 匯出 / 匯入 ================= */
function ingest(d){
  if(d&&Array.isArray(d.pages))return{db:norm(d)};
  if(d&&Array.isArray(d.nodes)){const p=fromCanvas(d);const nd=structuredClone(db);nd.pages.push(p);nd.currentId=p.id;return{db:norm(nd),fromOld:true}}
  throw new Error('格式不符');
}
$('btnExport').onclick=()=>{saveNow();const blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`nq-notes-${today()}.json`;a.click()};
$('fileImport').onchange=async e=>{
  const f=e.target.files[0];if(!f)return;const prev=JSON.stringify(db);
  try{const r=ingest(JSON.parse(await f.text()));db=r.db;saveNow();render();setSync('dirty',`已匯入 ${f.name}`);
    toast(r.fromOld?'已把舊畫布 JSON 轉成新頁面':'已匯入',()=>{db=norm(JSON.parse(prev));saveNow();render()})}
  catch{setSync('err','匯入失敗：不是本工具或舊畫布的 JSON')}
  e.target.value='';
};

/* ================= GitHub 同步 (Contents API) ================= */
const gFields=['gOwner','gRepo','gBranch','gPath','gToken'];
function loadCfg(){
  let c={};try{c=JSON.parse(localStorage.getItem(GITCFG)||'null')||{}}catch(e){}
  if(!c.gOwner){try{const o=JSON.parse(localStorage.getItem(OLDGIT)||'{}');if(o.gOwner)c=Object.assign({},o,{gPath:'data/nq-notes.json'})}catch(e){}}
  gFields.forEach(k=>{if(c[k])$(k).value=c[k]});return c;
}
function saveCfg(){const c={};gFields.forEach(k=>c[k]=$(k).value.trim());try{localStorage.setItem(GITCFG,JSON.stringify(c))}catch(e){}return c}
const b64enc=s=>{const b=new TextEncoder().encode(s);let r='';for(let i=0;i<b.length;i+=0x8000)r+=String.fromCharCode(...b.subarray(i,i+0x8000));return btoa(r)};
const b64dec=s=>new TextDecoder().decode(Uint8Array.from(atob(s.replace(/\n/g,'')),c=>c.charCodeAt(0)));
function api(c,method='GET',body){
  const url=`https://api.github.com/repos/${encodeURIComponent(c.gOwner)}/${encodeURIComponent(c.gRepo)}/contents/${c.gPath.split('/').map(encodeURIComponent).join('/')}`+(method==='GET'?`?ref=${encodeURIComponent(c.gBranch)}`:'');
  return fetch(url,{method,headers:{Authorization:`Bearer ${c.gToken}`,Accept:'application/vnd.github+json'},body:body&&JSON.stringify(body)});
}
const glog=t=>$('gLog').textContent=t;
function need(c){if(!c.gOwner||!c.gRepo||!c.gToken){glog('請填寫擁有者、Repo 名稱與 Token。');return false}return true}
$('btnGit').onclick=()=>{loadCfg();$('gitOverlay').hidden=false;$('gOwner').focus()};
$('gClose').onclick=()=>$('gitOverlay').hidden=true;
$('gitOverlay').onclick=e=>{if(e.target.id==='gitOverlay')$('gitOverlay').hidden=true};
$('gPull').onclick=async()=>{
  const c=saveCfg();if(!need(c))return;glog('下載中…');
  try{const r=await api(c);if(r.status===404){glog('Repo 裡還沒有這個檔案，先按「上傳到 GitHub」建立。');return}
    if(!r.ok)throw new Error(`${r.status} ${(await r.json()).message||''}`);
    const j=await r.json(),res=ingest(JSON.parse(b64dec(j.content)));db=res.db;saveNow();render();
    glog(res.fromOld?'已把舊畫布資料轉成一個新頁面（記得把路徑改回 data/nq-notes.json 再上傳）。':`已下載 ${db.pages.length} 個頁面。`);setSync('ok',`已與 GitHub 同步・${fmt(now())}`);
  }catch(err){glog('下載失敗：'+err.message+'\n請確認 repo、分支、路徑與 Token 權限。');setSync('err','GitHub 下載失敗')}
};
$('gPush').onclick=async()=>{
  const c=saveCfg();if(!need(c))return;glog('上傳中…');saveNow();
  try{let sha;const g=await api(c);if(g.ok)sha=(await g.json()).sha;else if(g.status!==404)throw new Error(`${g.status} ${(await g.json()).message||''}`);
    const r=await api(c,'PUT',{message:`更新 NQ 交易筆記 ${fmt(now())}`,content:b64enc(JSON.stringify(db,null,2)),branch:c.gBranch,sha});
    if(!r.ok)throw new Error(`${r.status} ${(await r.json()).message||''}`);
    glog(`已上傳到 ${c.gOwner}/${c.gRepo}/${c.gPath}`);setSync('ok',`已與 GitHub 同步・${fmt(now())}`);
  }catch(err){glog('上傳失敗：'+err.message+'\n請確認 Token 有 Contents 寫入權限。');setSync('err','GitHub 上傳失敗')}
};

/* ================= 啟動 ================= */
render();
try{if(localStorage.getItem(GITCFG)||localStorage.getItem(OLDGIT))setSync('','已設定 GitHub，有變更時記得上傳')}catch(e){}
</script>
