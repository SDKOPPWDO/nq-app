<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NQ 觀察畫布</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;700&display=swap">
<style>
/* 版面：頂列 / 左側今日草稿 / 中間無限畫布（心智圖節點 + 手繪）/ 右側節點檢視器；另有總覽頁 */
:root{
  --bg:#0d1116;--stage:#0a0e13;--panel:#141a21;--card:#19212a;--card-h:#202a35;
  --ink:#e3e8ed;--ink2:#c3ccd5;--muted:#8794a1;--faint:#55616d;--line:#262f3a;--line2:#33404d;
  --accent:#7fa8e0;
  --c-day:#a3afbb;--c-obs:#6ea8fe;--c-idea:#e3b341;--c-ext:#c39ae3;--c-strat:#4fc1c9;--c-val:#5cc494;
  --up:#5cc494;--down:#ec8577;--mid:#d9b55a;
  --f-display:"Noto Serif TC","Songti TC",serif;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:14px/1.55 var(--f-body);display:flex;flex-direction:column;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.up{color:var(--up)}.down{color:var(--down)}.midc{color:var(--mid)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
kbd{font:11px var(--f-mono);border:1px solid var(--line2);border-radius:4px;padding:0 4px;color:var(--muted)}

/* 頂列 */
header.top{flex:none;display:flex;align-items:center;flex-wrap:wrap;gap:8px 14px;padding:9px 16px;border-bottom:1px solid var(--line);background:var(--panel);z-index:8}
.brand{display:flex;align-items:baseline;gap:10px;min-width:0;margin-right:auto}
.brand h1{font:700 18px/1.2 var(--f-display);margin:0;letter-spacing:.03em;white-space:nowrap}
.brand .tick{font:12px var(--f-mono);color:var(--muted);white-space:nowrap}
.seg{display:flex;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:2px;gap:2px}
.seg button{border:0;background:transparent;border-radius:6px;padding:4px 12px;cursor:pointer;color:var(--muted);font-weight:500;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--card-h);color:var(--ink)}
.tools{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.btn{border:1px solid var(--line2);background:var(--card);border-radius:6px;padding:5px 11px;cursor:pointer;font-size:13px;white-space:nowrap;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#0b1220;font-weight:500}
.btn.danger{color:var(--down)}
.btn:disabled{opacity:.4;cursor:default;border-color:var(--line2)}
.btn.sq{padding:5px 9px}
.sync{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:var(--faint);flex:none}
.dot.ok{background:var(--up)}.dot.dirty{background:var(--mid)}.dot.err{background:var(--down)}
.samplebadge{font-size:12px;color:var(--mid);border:1px solid var(--mid);border-radius:4px;padding:0 6px;background:none;cursor:pointer}

#app{flex:1;min-height:0;display:flex;position:relative}

/* 左側：今日草稿 */
#draft{width:310px;flex:none;border-right:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;min-height:0;z-index:6}
.dh{display:flex;align-items:baseline;gap:10px;padding:14px 16px 6px}
.dh h2{font:700 16px/1.3 var(--f-display);margin:0}
.dh .hint{margin-left:auto}
.drow{display:flex;gap:6px;align-items:center;padding:4px 16px 10px;border-bottom:1px solid var(--line)}
.drow input{flex:1;min-width:0;background:var(--card);border:1px solid var(--line2);border-radius:6px;padding:4px 8px;font-family:var(--f-mono);font-size:13px}
.drow #dWk{font-size:12px;color:var(--muted);width:2.4em;text-align:center}
#dList{list-style:none;margin:0;padding:8px;flex:1;overflow:auto;display:flex;flex-direction:column;gap:6px;min-height:0}
#dList li{display:grid;grid-template-columns:28px minmax(0,1fr);gap:8px;padding:9px 10px;border-radius:8px;border:1px solid var(--line);background:var(--card);cursor:pointer}
#dList li:hover{border-color:var(--line2)}
#dList li.sel{border-color:var(--c-obs);box-shadow:inset 3px 0 0 var(--c-obs)}
#dList li.empty{display:block;text-align:center;color:var(--muted);cursor:default;border-style:dashed;background:none;padding:28px 10px}
#dList .no{font:500 13px var(--f-mono);color:var(--c-obs);padding-top:1px}
#dList .tx{white-space:pre-wrap;overflow-wrap:anywhere;font-size:13.5px}
#dList .m{display:flex;flex-wrap:wrap;gap:4px 8px;margin-top:4px;font-size:12px;color:var(--muted);align-items:center}
.ok{color:var(--up)}.todo{color:var(--faint)}
.dfoot{border-top:1px solid var(--line);padding:10px 12px 12px;display:flex;flex-direction:column;gap:8px}
.dfoot .wide{width:100%}
.dtf{display:flex;flex-wrap:wrap;gap:4px;align-items:center;font-size:12px;color:var(--muted)}
.dtf span{margin-right:2px}
#dInput{width:100%;resize:vertical;min-height:72px;background:var(--card);border:1px solid var(--line2);border-radius:8px;padding:8px 10px;line-height:1.55;font-size:14px}
#dInput:focus{border-color:var(--c-obs);outline:none}
.hint{font-size:12px;color:var(--muted)}

/* 畫布 */
#stage{flex:1;min-width:0;position:relative;overflow:hidden;background-color:var(--stage);background-image:radial-gradient(circle,#232c37 1px,transparent 1.3px);background-size:24px 24px;touch-action:none;cursor:grab}
#stage[data-mode="pen"]{cursor:crosshair}
#stage[data-mode="erase"]{cursor:cell}
#world{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}
#svg{position:absolute;left:0;top:0;width:1px;height:1px;overflow:visible;pointer-events:none}
.ehit{fill:none;stroke:transparent;stroke-width:14;pointer-events:stroke;cursor:pointer}
#stage[data-mode="pen"] .ehit,#stage[data-mode="erase"] .ehit{pointer-events:none}
.edge{fill:none;stroke-width:1.6;opacity:.6}
.edge.sel{stroke-width:2.8;opacity:1}
.edel{pointer-events:all;cursor:pointer}
.edel circle{fill:var(--down)}
.edel path{stroke:#fff;stroke-width:2;fill:none}
#tmpEdge{fill:none;stroke:var(--accent);stroke-width:2;stroke-dasharray:6 5}
.stroke{fill:none;stroke-linecap:round;stroke-linejoin:round;opacity:.92}
#marquee{position:absolute;border:1px dashed var(--accent);background:rgb(127 168 224 / .08);pointer-events:none}

/* 節點 */
.node{position:absolute;background:var(--card);border:1px solid var(--line2);border-top:3px solid var(--tc);border-radius:10px;padding:9px 12px 11px;box-shadow:0 2px 12px rgb(0 0 0 / .4);cursor:grab;user-select:none;-webkit-user-select:none}
.node:hover{background:var(--card-h)}
.node.sel{box-shadow:0 0 0 2px var(--tc),0 8px 24px rgb(0 0 0 / .55)}
.t-day{--tc:var(--c-day)}.t-obs{--tc:var(--c-obs)}.t-idea{--tc:var(--c-idea)}.t-ext{--tc:var(--c-ext)}.t-strat{--tc:var(--c-strat)}.t-val{--tc:var(--c-val)}
.t-val.v-against{--tc:var(--down)}.t-val.v-neutral{--tc:var(--mid)}
.node.t-day{background:rgb(20 26 33 / .7);border-style:dashed;border-top-style:solid}
.badge{display:inline-flex;align-items:center;font-size:12px;font-weight:700;color:var(--tc);background:color-mix(in srgb,var(--tc) 16%,transparent);padding:0 7px;border-radius:4px;letter-spacing:.04em;white-space:nowrap}
.nh{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:6px;font-size:12px;color:var(--muted)}
.nh .r{margin-left:auto}
.nt{font-weight:700;font-size:15px;line-height:1.4;margin-bottom:4px;overflow-wrap:anywhere}
.nx{color:var(--ink2);white-space:pre-wrap;overflow-wrap:anywhere;font-size:13.5px;line-height:1.6}
.t-obs .nx{color:var(--ink);font-size:14px}
.rz{position:absolute;z-index:2}
.rz-e{top:8px;bottom:14px;right:-4px;width:8px;cursor:ew-resize}
.rz-s{left:14px;right:14px;bottom:-4px;height:8px;cursor:ns-resize}
.rz-se{right:-5px;bottom:-5px;width:14px;height:14px;cursor:nwse-resize}
.rz-se::after{content:"";position:absolute;right:5px;bottom:5px;width:7px;height:7px;border-right:2px solid var(--tc);border-bottom:2px solid var(--tc);border-radius:0 0 2px 0;opacity:0}
.node:hover .rz-se::after,.node.sel .rz-se::after{opacity:.8}
.node.sized .nx{min-height:0}
.nx.none,.none{color:var(--faint);font-style:normal}
.nm{display:flex;flex-wrap:wrap;gap:4px 8px;margin-top:8px;align-items:center;font-size:12px;color:var(--muted)}
.dd{font:500 22px/1.25 var(--f-mono);letter-spacing:.02em}
.dw{font-size:12px;color:var(--muted)}
.plus{position:absolute;right:-13px;top:10px;width:24px;height:24px;border-radius:50%;border:1px solid var(--tc);background:var(--panel);color:var(--tc);font-size:16px;line-height:1;cursor:pointer;opacity:0;display:grid;place-items:center;padding:0}
.handle{position:absolute;left:50%;margin-left:-7px;bottom:-8px;z-index:3;width:13px;height:13px;border-radius:50%;background:var(--tc);border:2px solid var(--stage);cursor:crosshair;opacity:0}
.node:hover .plus,.node.sel .plus,.node:hover .handle,.node.sel .handle{opacity:1}
#stage[data-mode="pen"] .plus,#stage[data-mode="pen"] .handle,#stage[data-mode="erase"] .plus,#stage[data-mode="erase"] .handle{display:none}
.tag{font-size:12px;color:var(--muted)}
.tf{display:inline-block;font:500 12px/1.6 var(--f-mono);padding:0 6px;border-radius:4px;border:1px solid var(--line2);color:var(--ink2);background:var(--bg);white-space:nowrap}
.tal{display:flex;gap:10px;font:12px var(--f-mono);margin-top:8px;align-items:center}
.tbar{flex:1;height:4px;border-radius:2px;display:flex;overflow:hidden;background:var(--line);min-width:40px}
.tbar i{display:block;height:100%}
.status,.vd{display:inline-block;font-size:11.5px;font-weight:500;padding:0 7px;border-radius:4px;white-space:nowrap;line-height:1.7}
.s-pending{background:#1f2e42;color:#7fa8e0}
.s-testing,.s-partial{background:#352c16;color:#d9b55a}
.s-hold{background:#16302a;color:#5cc494}
.s-reject{background:#3a1f1c;color:#ec8577}
.st-draft{background:#222b35;color:var(--muted)}
.st-backtest{background:#352c16;color:#d9b55a}
.st-paper{background:#15302f;color:#5fc4cc}
.st-live{background:#16302a;color:#5cc494}
.st-off{background:#3a1f1c;color:#ec8577}
.vd-support{background:#16302a;color:var(--up)}.vd-against{background:#3a1f1c;color:var(--down)}.vd-neutral{background:#352c16;color:var(--mid)}
.dir{font-weight:700;font-size:12px}
.dir.long{color:var(--up)}.dir.short{color:var(--down)}.dir.both{color:var(--accent)}

/* 畫布上的浮動工具 */
.ui{position:absolute;z-index:4}
.tb{top:12px;left:12px;right:12px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;pointer-events:none}
.tb>*{pointer-events:auto}
.grp{display:flex;gap:2px;background:var(--panel);border:1px solid var(--line2);border-radius:8px;padding:3px;box-shadow:0 4px 14px rgb(0 0 0 / .35);align-items:center}
.grp button{border:0;background:transparent;border-radius:6px;padding:4px 10px;cursor:pointer;color:var(--ink2);font-size:13px;white-space:nowrap;display:flex;align-items:center;gap:6px}
.grp button:hover{background:var(--card-h)}
.grp button[aria-pressed="true"]{background:var(--card-h);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line2)}
.grp button:disabled{opacity:.35;cursor:default;background:none}
.sw{width:16px;height:16px;border-radius:50%;padding:0!important;border:2px solid transparent!important}
.sw[aria-pressed="true"]{border-color:var(--ink)!important}
.zoom{left:12px;bottom:12px;display:flex;flex-direction:column;gap:8px;align-items:flex-start}
#zoomPct{font:12px var(--f-mono);min-width:44px;justify-content:center}
#mini{width:200px;height:130px;background:rgb(20 26 33 / .92);border:1px solid var(--line2);border-radius:8px;cursor:pointer;display:block}
.hintbar{left:50%;bottom:12px;transform:translateX(-50%);font-size:12px;color:var(--faint);white-space:nowrap;pointer-events:none}

/* 新增選單 */
#addMenu{position:fixed;z-index:20;background:var(--panel);border:1px solid var(--line2);border-radius:10px;box-shadow:0 12px 32px rgb(0 0 0 / .55);padding:6px;min-width:230px;display:flex;flex-direction:column}
#addMenu .mh{font-size:12px;color:var(--muted);padding:4px 8px 6px}
#addMenu button{border:0;background:none;border-radius:6px;padding:7px 8px;cursor:pointer;display:grid;grid-template-columns:10px auto 1fr auto;gap:8px;align-items:center;text-align:left}
#addMenu button:hover{background:var(--card-h)}
#addMenu i{width:10px;height:10px;border-radius:3px}
#addMenu b{font-weight:500}
#addMenu .hint{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* 右側：檢視器 */
#insp{position:absolute;top:0;right:0;bottom:0;width:370px;background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;z-index:7;box-shadow:-10px 0 28px rgb(0 0 0 / .4)}
.ih{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line)}
.ih .tsel{background:var(--card);border:1px solid var(--line2);border-radius:6px;padding:2px 6px;font-size:13px}
.ih .x{margin-left:auto;border:0;background:none;color:var(--muted);font-size:22px;line-height:1;cursor:pointer;padding:0 4px}
.ib{flex:1;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:12px;min-height:0}
.fl{display:flex;flex-direction:column;gap:5px;font-size:12.5px;color:var(--muted);font-weight:500;min-width:0}
.fl input,.fl select,.fl textarea{background:var(--card);border:1px solid var(--line2);border-radius:6px;padding:7px 9px;font-size:14px;color:var(--ink);width:100%;min-width:0;font-weight:400}
.fl textarea{resize:vertical;line-height:1.6}
.fl input:focus,.fl select:focus,.fl textarea:focus{border-color:var(--accent);outline:none}
.fl input[name="title"],.fl .big{font-size:15px;font-weight:500}
.row2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.row3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.tgs{display:flex;flex-wrap:wrap;gap:5px}
.tg{border:1px solid var(--line2);background:transparent;border-radius:999px;padding:1px 10px;font-size:12.5px;cursor:pointer;color:var(--muted)}
.tg.mono{font-family:var(--f-mono)}
.tg[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.box{border:1px solid var(--line);border-radius:8px;padding:10px 12px 12px;display:flex;flex-direction:column;gap:10px}
.box .gh{font-size:13px;font-weight:700;letter-spacing:.04em;display:flex;align-items:center;gap:6px}
.box .gh::before{content:"";width:4px;height:14px;border-radius:2px;background:currentColor}
.g-tf .gh{color:var(--accent)}.g-io .gh{color:var(--up)}.g-pos .gh{color:var(--c-ext)}.g-risk .gh{color:var(--down)}.g-time .gh{color:var(--c-strat)}
.calc{padding:8px 10px;border-radius:6px;background:#3a1f1c;font-size:13px;line-height:1.6}
.calc b{font-family:var(--f-mono);font-size:15px}
.src{border:1px dashed var(--line2);border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:6px;font-size:13px}
.src .lk{background:none;border:0;padding:0;color:var(--ink2);cursor:pointer;text-align:left;display:flex;gap:6px;align-items:baseline}
.src .lk:hover{color:var(--accent)}
.if{border-top:1px solid var(--line);padding:10px 14px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.if .stamps{font-size:11.5px;color:var(--muted);line-height:1.5;margin-right:auto}
.if .acts{display:flex;gap:6px;flex-wrap:wrap}
.msum{display:flex;flex-wrap:wrap;gap:6px}

/* 總覽 */
#ov{flex:1;overflow:auto;padding:20px 16px 56px;min-height:0}
.ov-in{max-width:1220px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.ov-head{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:baseline}
.ov-head h2{font:700 22px/1.3 var(--f-display);margin:0}
.pipe{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:14px}
.pc{background:var(--panel);border:1px solid var(--line);border-top:3px solid var(--tc);border-radius:10px;padding:12px 14px;position:relative;display:flex;flex-direction:column;gap:2px;min-width:0}
.pc:not(:last-child)::after{content:"→";position:absolute;right:-13px;top:38%;color:var(--faint);font-size:14px}
.pc .k{font-size:13px;font-weight:700;color:var(--tc);letter-spacing:.04em}
.pc .v{font:500 30px/1.15 var(--f-mono)}
.pc .s{font-size:12.5px;color:var(--muted)}
.pc .s b{color:var(--ink);font-family:var(--f-mono);font-weight:500}
.pc .w{font:12px var(--f-mono);color:var(--faint)}
@media (max-width:900px){.pipe{grid-template-columns:repeat(2,minmax(0,1fr))}.pc::after{display:none}}
.grid2{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:900px){.grid2{grid-template-columns:minmax(0,1fr)}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden;min-width:0}
.card h3{font:600 15px/1.3 var(--f-display);margin:0;padding:12px 16px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:center}
.card h3 .c{font:12px var(--f-mono);color:var(--muted)}
.card h3 .linkb{margin-left:auto}
.linkb{background:none;border:0;color:var(--accent);cursor:pointer;font-size:12.5px;padding:0}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;font-size:12px;font-weight:500;color:var(--muted);padding:8px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--bg)}
td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
tbody tr{cursor:pointer}
tbody tr:hover td{background:var(--card)}
.num{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.sm{font-size:12px;color:var(--muted)}
.ttl{font-weight:500;line-height:1.45;max-width:34ch;overflow-wrap:anywhere}
.sub{font-size:12px;color:var(--muted);margin-top:2px}
.clamp{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;max-width:40ch}
.pg{display:flex;gap:8px;align-items:center;font-size:12px}
.pgb{width:70px;height:5px;border-radius:3px;background:var(--line);overflow:hidden;display:block}
.pgb i{display:block;height:100%;background:var(--c-obs)}
.li{display:flex;gap:10px;padding:10px 16px;border-bottom:1px solid var(--line);cursor:pointer;align-items:flex-start}
.li:last-child{border-bottom:0}
.li:hover{background:var(--card)}
.li .d{font:12px var(--f-mono);color:var(--muted);white-space:nowrap;padding-top:2px;min-width:78px}
.li .b{min-width:0;flex:1}
.li .t{white-space:pre-wrap;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.ovempty{padding:22px 16px;color:var(--muted);font-size:13px;text-align:center}

/* GitHub 面板與提示 */
.overlay{position:fixed;inset:0;background:rgb(0 0 0 / .55);display:flex;align-items:flex-start;justify-content:center;padding:max(40px,env(safe-area-inset-top,0px)) 16px 16px;z-index:30;overflow:auto}
.sheet{background:var(--panel);border:1px solid var(--line2);border-radius:12px;width:100%;max-width:560px;padding:20px;display:flex;flex-direction:column;gap:14px}
.sheet h3{font:700 18px/1.3 var(--f-display);margin:0}
.gform{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.gform .wide{grid-column:1/-1}
.gform .actions{grid-column:1/-1;display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.log{font:12px var(--f-mono);color:var(--muted);white-space:pre-wrap;min-height:1.5em}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--card-h);border:1px solid var(--line2);border-radius:8px;padding:8px 14px;display:flex;gap:12px;align-items:center;z-index:40;box-shadow:0 8px 24px rgb(0 0 0 / .5);font-size:13.5px;max-width:calc(100vw - 32px)}

@media (max-width:760px){
  .brand .tick,.hintbar{display:none}
  #draft{position:absolute;top:0;bottom:0;left:0;width:min(330px,88vw);box-shadow:10px 0 28px rgb(0 0 0 / .5)}
  #insp{top:auto;left:0;width:auto;height:64%;border-left:0;border-top:1px solid var(--line2);border-radius:14px 14px 0 0}
  #mini{width:150px;height:96px}
}
@media (prefers-reduced-motion:no-preference){.btn,.grp button,.tg{transition:background .12s,border-color .12s,color .12s}}
</style>
</head>
<body>

<header class="top">
  <div class="brand"><h1>NQ 觀察畫布</h1><span class="tick">NQ 1 pt = $20 · MNQ 1 pt = $2 · 跳動 0.25 pt</span></div>
  <div class="seg" id="pages">
    <button data-page="canvas" aria-pressed="true">畫布</button>
    <button data-page="ov" aria-pressed="false">總覽</button>
  </div>
  <div class="tools">
    <button class="btn" id="btnDraft" aria-pressed="true">草稿</button>
    <button class="samplebadge" id="btnSample" hidden title="清空範例資料">範例資料 · 清空</button>
    <button class="btn" id="btnGit">GitHub 同步</button>
    <button class="btn" id="btnExport">匯出</button>
    <label class="btn" for="fileImport" style="margin:0">匯入</label>
    <input type="file" id="fileImport" accept="application/json,.json" hidden>
    <span class="sync"><span class="dot" id="syncDot"></span><span id="syncText">資料暫存在此瀏覽器</span></span>
  </div>
</header>

<div id="app">
  <aside id="draft">
    <div class="dh"><h2>今日草稿</h2><span class="hint" id="dCount"></span></div>
    <div class="drow">
      <button class="btn sq" data-dd="-1" aria-label="前一天">‹</button>
      <input type="date" id="dDate" aria-label="行情日">
      <span id="dWk"></span>
      <button class="btn sq" data-dd="1" aria-label="後一天">›</button>
      <button class="btn" data-dd="0">今天</button>
    </div>
    <ol id="dList"></ol>
    <div class="dfoot">
      <button class="btn primary wide" id="dMerge" disabled>勾選觀察後整理成觀點</button>
      <div class="dtf" id="dTf"></div>
      <textarea id="dInput" rows="3" placeholder="依序寫下看到的現象。Enter 新增、Shift+Enter 換行。&#10;開頭可加時間，例如：10:15 掃前高後回落"></textarea>
    </div>
  </aside>

  <div id="stage" data-mode="select">
    <div id="world">
      <svg id="svg"><g id="gStrokes"></g><g id="gEdges"></g><path id="tmpEdge" style="display:none"/></svg>
      <div id="nodes"></div>
      <div id="marquee" hidden></div>
    </div>

    <div class="ui tb">
      <div class="grp">
        <button id="tbAdd" data-addbtn title="在畫面中央新增節點">＋ 新增節點</button>
        <button id="tbMerge" disabled title="把選取的觀察整理成一個觀點 (M)">整理選取</button>
        <button id="tbLayout" title="依連線自動排列成心智圖">自動排列</button>
      </div>
      <div class="grp">
        <button id="tbUndo" title="復原 (Ctrl+Z)">復原</button>
        <button id="tbRedo" title="重做 (Ctrl+Shift+Z)">重做</button>
      </div>
    </div>

    <div class="ui zoom">
      <canvas id="mini" aria-label="小地圖"></canvas>
      <div class="grp">
        <button id="zOut" aria-label="縮小">−</button>
        <button id="zoomPct" title="回到 100%">100%</button>
        <button id="zIn" aria-label="放大">＋</button>
        <button id="zFit" title="顯示全部 (F)">全覽</button>
      </div>
    </div>
    <div class="ui hintbar">拖曳空白處平移 · 滾輪縮放 · Shift+拖曳框選 · 雙擊空白新增 · Tab 子節點 · Enter 同層 · Del 刪除</div>
  </div>

  <aside id="insp" hidden></aside>
</div>

<section id="ov" hidden></section>

<div id="addMenu" hidden></div>
<div id="toast" hidden></div>

<div class="overlay" id="gitOverlay" hidden>
  <div class="sheet" role="dialog" aria-labelledby="gitTitle">
    <h3 id="gitTitle">GitHub 同步設定</h3>
    <p class="hint" style="margin:0;font-size:13px">資料以一個 JSON 檔存在你的 repo。Token 請用 Fine-grained token，只給這個 repo 的 Contents 讀寫權限。設定只存在這台電腦的瀏覽器。舊版「假設日誌」的 JSON 也能直接下載，會自動轉成畫布節點。</p>
    <div class="gform">
      <label class="fl">擁有者 (owner)<input id="gOwner" placeholder="your-github-name"></label>
      <label class="fl">Repo 名稱<input id="gRepo" placeholder="nq-journal"></label>
      <label class="fl">分支<input id="gBranch" value="main"></label>
      <label class="fl">檔案路徑<input id="gPath" value="data/nq-canvas.json"></label>
      <label class="fl wide">Personal Access Token<input id="gToken" type="password" placeholder="github_pat_…" autocomplete="off"></label>
      <div class="actions">
        <button class="btn" id="gClose">關閉</button>
        <button class="btn" id="gPull">從 GitHub 下載</button>
        <button class="btn primary" id="gPush">上傳到 GitHub</button>
      </div>
    </div>
    <div class="log" id="gLog"></div>
  </div>
</div>

<script>
/* ================= 常數 ================= */
const KEY='nq-canvas-v3', OLDKEY='nq-hyp-v1', VIEWKEY='nq-canvas-view', GITCFG='nq-canvas-git', OLDGIT='nq-hyp-git';
const STATUS={pending:'待驗證',testing:'驗證中',hold:'成立',partial:'部分成立',reject:'不成立'};
const VERDICT={support:'支持',against:'反駁',neutral:'中性'};
const TFS=['1K','5K','15K','30K','60K','日K'];
const SSTATUS={draft:'草稿',backtest:'回測中',paper:'模擬單',live:'實盤',off:'停用'};
const SORDER=['live','paper','backtest','draft','off'];
const DIR={long:'只做多',short:'只做空',both:'多空皆做'};
const CONTRACT={NQ:20,MNQ:2};
const SESS={asia:'亞盤 18:00–03:00 ET',eu:'歐盤 03:00–09:30 ET',open:'美盤開盤 09:30–10:30 ET',mid:'美盤盤中 10:30–15:00 ET',close:'美盤尾盤 15:00–16:00 ET'};
const SESS_SHORT={asia:'亞盤',eu:'歐盤',open:'美開盤',mid:'美盤中',close:'美尾盤'};
const EVENTS={CPI:'CPI',FOMC:'FOMC',NFP:'非農 NFP',PCE:'PCE',EARN:'權值股財報',ROLL:'換月 / 季底'};
const T={
  day:{n:'日期',d:''},
  obs:{n:'觀察',d:'看到的現象，依序記錄'},
  idea:{n:'整理',d:'把觀察整理成可驗證的觀點'},
  ext:{n:'延伸',d:'延伸想法、疑問、看法'},
  strat:{n:'策略',d:'轉成可執行的交易規則'},
  val:{n:'驗證',d:'用行情日支持或反駁'}};
const ADDABLE=['obs','idea','ext','strat','val'];
const CHILD_MENU={day:['obs'],obs:['idea','ext','obs'],idea:['ext','strat','val','idea'],ext:['ext','strat','val','idea'],strat:['val','ext','strat'],val:['ext','idea','strat']};
const PENS=['#f0c060','#ec8577','#6ea8fe','#5cc494','#e3e8ed'];
const W=n=>n.w||(n.type==='day'?190:n.type==='strat'?300:280);
const MAXW=1800;

/* ================= 工具 ================= */
const $=id=>document.getElementById(id);
const uid=()=>Math.random().toString(36).slice(2,10);
const now=()=>new Date().toISOString();
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const tpe=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Taipei'});
const today=()=>tpe.format(new Date());
const dayOf=iso=>iso?tpe.format(new Date(iso)):'';
const fmt=iso=>{if(!iso)return'—';const p=new Intl.DateTimeFormat('zh-TW',{timeZone:'Asia/Taipei',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false}).formatToParts(new Date(iso));const g=t=>p.find(x=>x.type===t)?.value;return`${g('year')}-${g('month')}-${g('day')} ${g('hour')}:${g('minute')}`};
const addDays=(d,n)=>{const t=new Date(d+'T12:00:00Z');t.setUTCDate(t.getUTCDate()+n);return t.toISOString().slice(0,10)};
const wkd=d=>d?'日一二三四五六'[new Date(d+'T12:00:00Z').getUTCDay()]:'';
const tfSort=a=>TFS.filter(t=>(a||[]).includes(t));
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));

/* ================= 資料模型 ================= */
function defaults(type){return{
  day:{date:today()},
  obs:{date:today(),time:'',tfs:[]},
  idea:{status:'pending',condition:'',tfs:[]},
  ext:{},
  strat:{status:'draft',htf:[],ltf:[],tfNote:'',dir:'both',entry:'',takeProfit:'',stopLoss:'',contract:'MNQ',qty:1,scaleIn:'',scaleOut:'',riskPts:'',dailyLoss:'',maxLosses:'',riskNote:'',sessions:[],avoid:[],maxHold:'',timeNote:''},
  val:{date:today(),verdict:'support'}}[type]||{}}
function mk(type,pos={},extra={}){const t=now();return Object.assign({id:uid(),type,x:Math.round(pos.x||0),y:Math.round(pos.y||0),title:'',text:'',tags:[],createdAt:t,updatedAt:t},structuredClone(defaults(type)),extra)}

function sample(){
  const d={version:3,sample:true,nodes:[],edges:[],strokes:[]};
  const add=(type,ex)=>{const n=mk(type,{},ex);d.nodes.push(n);return n};
  const link=(a,b)=>d.edges.push({id:uid(),from:a.id,to:b.id});
  const day=add('day',{date:'2026-10-02'});
  const o1=add('obs',{date:'2026-10-02',time:'09:45',tfs:['5K'],text:'開盤 15 分鐘內先掃前日高點 25,140，隨即快速回落，量明顯放大。'});
  const o2=add('obs',{date:'2026-10-02',time:'10:20',tfs:['5K','15K'],text:'回落到 OR30 下緣 25,020 附近止跌，連續兩根長下影線。'});
  const o3=add('obs',{date:'2026-10-02',time:'14:30',tfs:['60K'],text:'下午量縮整理，60K 收在前日高點下方，沒有站回。'});
  [o1,o2,o3].forEach(o=>link(day,o));
  const idea=add('idea',{title:'開盤掃前日高點後回落，上午常回測 OR30 下緣',status:'testing',text:'開盤 30 分鐘內掃過前日高點、但 5K 收不上去時，當日上午回測 OR30 下緣的比例 > 60%。',condition:'排除 CPI、FOMC、NFP 當日。',tfs:['5K','15K'],tags:['開盤','假突破']});
  link(o1,idea);link(o2,idea);
  const ext=add('ext',{title:'掃前日低點是否對稱？',text:'反向情境另外記錄，累積 10 筆再看。'});
  const st=add('strat',{title:'掃高回落做空到 OR30 下緣',status:'backtest',htf:['60K'],ltf:['5K'],tfNote:'60K 確認沒站上前日高點；5K 找進場。',dir:'short',entry:'掃前日高點後 5K 收回前高之下，下一根跌破前根低點進場。',takeProfit:'OR30 下緣先出一半，其餘看 15K 前低。',stopLoss:'掃高的最高點上方 2 pt。',contract:'MNQ',qty:2,riskPts:25,dailyLoss:300,maxLosses:2,sessions:['open'],avoid:['CPI','FOMC','NFP'],maxHold:'不留倉',timeNote:'11:00 ET 後不開新倉'});
  const v1=add('val',{date:'2026-10-02',verdict:'support',text:'10:20 回到 OR30 下緣，空單到目標 +118 pt。'});
  const v2=add('val',{date:'2026-09-29',verdict:'against',text:'掃高後橫盤到中午，沒有回測下緣。'});
  link(idea,ext);link(idea,st);link(st,v1);link(st,v2);
  return d;
}
/* 舊版「假設日誌」→ 畫布 */
function fromV2(old){
  const d={version:3,nodes:[],edges:[],strokes:[]};
  const link=(a,b)=>d.edges.push({id:uid(),from:a.id,to:b.id});
  (old.items||[]).forEach(h=>{
    const idea=mk('idea',{},{title:h.title||'',text:h.statement||'',condition:h.condition||'',status:h.status||'pending',tfs:Array.isArray(h.tfs)?h.tfs:[],tags:h.tags||[],code:h.code||'',createdAt:h.createdAt||now(),updatedAt:h.updatedAt||now()});
    d.nodes.push(idea);
    (h.verifies||[]).forEach(v=>{const n=mk('val',{},{date:v.date||'',verdict:v.verdict||'neutral',text:v.text||'',createdAt:v.createdAt||now(),updatedAt:v.updatedAt||now()});d.nodes.push(n);link(idea,n)});
    (h.notes||[]).forEach(v=>{const n=mk('ext',{},{title:v.kind==='view'?'看法':'延伸想法',text:v.text||'',createdAt:v.createdAt||now(),updatedAt:v.updatedAt||now()});d.nodes.push(n);link(idea,n)});
    if(h.strategy){const s=h.strategy;const n=mk('strat',{},Object.assign({},s,{title:(h.title||'')+'｜策略',text:'',createdAt:s.createdAt||now(),updatedAt:s.updatedAt||now()}));d.nodes.push(n);link(idea,n)}
  });
  return d;
}
function norm(d){
  d.nodes=Array.isArray(d.nodes)?d.nodes:[];d.strokes=Array.isArray(d.strokes)?d.strokes:[];
  const ids=new Set(d.nodes.map(n=>n.id));
  d.edges=(Array.isArray(d.edges)?d.edges:[]).filter(e=>ids.has(e.from)&&ids.has(e.to));
  d.nodes.forEach(n=>{const df=defaults(n.type);Object.keys(df).forEach(k=>{if(n[k]===undefined)n[k]=structuredClone(df[k])});n.tags=n.tags||[];n.title=n.title||'';n.text=n.text||''});
  d.version=3;return d;
}
let needLayout=false, migratedMsg='';
function load(){
  try{const s=localStorage.getItem(KEY);if(s){const d=JSON.parse(s);if(Array.isArray(d.nodes))return norm(d)}}catch(e){}
  try{const o=localStorage.getItem(OLDKEY);if(o){const d=JSON.parse(o);if(Array.isArray(d.items)&&d.items.length&&!d.sample){needLayout=true;migratedMsg=`已把舊版假設日誌的 ${d.items.length} 個假設轉成畫布節點`;return norm(fromV2(d))}}}catch(e){}
  needLayout=true;return norm(sample());
}

/* ================= 狀態 ================= */
let db=load();
let view={x:80,y:90,k:1}, sel=new Set(), selEdge=null, mode='select', penColor=PENS[0], page='canvas', draftDate=today(), draftTfs=[], ovAll=false;
const H={};
const U=[],R=[];
const stage=$('stage');

const byId=id=>db.nodes.find(n=>n.id===id);
const outs=id=>db.edges.filter(e=>e.from===id).map(e=>byId(e.to)).filter(Boolean);
const ins=id=>db.edges.filter(e=>e.to===id).map(e=>byId(e.from)).filter(Boolean);
function walk(id,dir){const seen=new Set(),st=[id];while(st.length){const c=st.pop();for(const e of db.edges){const [a,b]=dir?[e.from,e.to]:[e.to,e.from];if(a===c&&!seen.has(b)&&b!==id){seen.add(b);st.push(b)}}}return[...seen].map(byId).filter(Boolean)}
const desc=id=>walk(id,true), anc=id=>walk(id,false);
const tallyOf=vs=>{const t={support:0,against:0,neutral:0};vs.forEach(v=>{if(t[v.verdict]!==undefined)t[v.verdict]++});return t};
const tally=id=>tallyOf(desc(id).filter(n=>n.type==='val'));
const organized=o=>outs(o.id).some(n=>n.type!=='obs'&&n.type!=='day');
const obsOf=date=>db.nodes.filter(n=>n.type==='obs'&&n.date===date).sort((a,b)=>a.createdAt.localeCompare(b.createdAt));
const one=()=>sel.size===1?byId([...sel][0]):null;

/* ================= 儲存 / 復原 ================= */
let saveT,viewT;
function setSync(state,text){$('syncDot').className='dot '+(state||'');$('syncText').textContent=text}
function saveNow(){db.savedAt=now();try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){}}
function saveSoon(){if(db.sample){delete db.sample;$('btnSample').hidden=true}clearTimeout(saveT);saveT=setTimeout(saveNow,250);setSync('dirty','有變更尚未上傳到 GitHub')}
addEventListener('pagehide',saveNow);
const stateStr=()=>JSON.stringify({nodes:db.nodes,edges:db.edges,strokes:db.strokes});
function snap(){U.push(stateStr());if(U.length>120)U.shift();R.length=0;updUndo()}
function undo(){if(!U.length){toast('沒有可以復原的步驟');return}R.push(stateStr());Object.assign(db,JSON.parse(U.pop()));afterHist()}
function redo(){if(!R.length)return;U.push(stateStr());Object.assign(db,JSON.parse(R.pop()));afterHist()}
function afterHist(){sel=new Set([...sel].filter(byId));selEdge=null;saveSoon();renderAll();updUndo()}
function updUndo(){$('tbUndo').disabled=!U.length;$('tbRedo').disabled=!R.length}
function commit(){saveSoon();renderAll()}

/* ================= 卡片 ================= */
function tallyHTML(){return''}
function cardInner(n){
  const tags=(n.tags||[]).map(t=>`<span class="tag">#${esc(t)}</span>`).join('');
  const tfs=a=>tfSort(a).map(t=>`<span class="tf">${t}</span>`).join('');
  const body=n.text?`<div class="nx">${esc(n.text)}</div>`:'';
  const title=n.title?`<div class="nt">${esc(n.title)}</div>`:'';
  const blank=!n.title&&!n.text?'<div class="nx none">點兩下編輯內容</div>':'';
  switch(n.type){
    case 'day':{const c=obsOf(n.date).length;
      return `<div class="nh"><span class="badge">日期</span><span class="r mono">${c} 筆觀察</span></div><div class="dd">${esc(n.date)}</div><div class="dw">星期${wkd(n.date)}${n.date===today()?' · 今天':''}</div>`}
    case 'obs':{const i=obsOf(n.date).indexOf(n)+1;
      return `<div class="nh"><span class="badge">觀察${i?' #'+i:''}</span>${n.time?`<span class="mono">${esc(n.time)} ET</span>`:''}<span class="r">${organized(n)?'<span class="ok">✓ 已整理</span>':''}</span></div>${body||blank}${(tfSort(n.tfs).length||tags)?`<div class="nm">${tfs(n.tfs)}${tags}</div>`:''}`}
    case 'idea':
      return `<div class="nh"><span class="badge">整理</span><span class="status s-${n.status}">${STATUS[n.status]||''}</span></div>${title}${body}${blank}${(tfSort(n.tfs).length||tags)?`<div class="nm">${tfs(n.tfs)}${tags}</div>`:''}${tallyHTML(tally(n.id))}`;
    case 'ext':
      return `<div class="nh"><span class="badge">延伸</span></div>${title}${body}${blank}${tags?`<div class="nm">${tags}</div>`:''}`;
    case 'strat':{const m=CONTRACT[n.contract]||0,risk=(+n.riskPts&&+n.qty)?n.riskPts*m*n.qty:null;const has=v=>v!==''&&v!=null;
      return `<div class="nh"><span class="badge">策略</span><span class="status st-${n.status}">${SSTATUS[n.status]||''}</span></div>${title}${body}${blank}
      <div class="nm"><span class="dir ${n.dir}">${DIR[n.dir]||''}</span>${has(n.qty)?`<span class="mono">${n.qty} 口 ${esc(n.contract)}</span>`:''}</div>
      ${(tfSort(n.htf).length||tfSort(n.ltf).length)?`<div class="nm">${tfs(n.htf)}${tfSort(n.htf).length&&tfSort(n.ltf).length?'<span>→</span>':''}${tfs(n.ltf)}</div>`:''}${tallyHTML(tally(n.id))}`}
    case 'val':
      return `<div class="nh"><span class="badge">驗證</span><span class="vd vd-${n.verdict}">${VERDICT[n.verdict]||''}</span><span class="r mono">${esc(n.date||'')}</span></div>${title}${body}${blank}${tags?`<div class="nm">${tags}</div>`:''}`;
  }
  return '';
}
const nodeCls=n=>`node t-${n.type}${n.type==='val'?' v-'+n.verdict:''}${sel.has(n.id)?' sel':''}`;

/* 方框變寬時，把它右邊延伸出去的節點一起往右推 */

  let x1,x2,s;if(b.x+bw/2>=a.x+aw/2){x1=a.x+aw;x2=b.x;s=1}else{x1=a.x;x2=b.x+bw;s=-1}
  const dx=Math.max(40,Math.abs(x2-x1)/2)*s;
  return{d:`M${x1},${y1} C${x1+dx},${y1} ${x2-dx},${y2} ${x2},${y2}`,mx:(x1+x2)/2,my:(y1+y2)/2,x2,y2};
}

/* ================= 視角 ================= */

  const s={...view},t0=performance.now();
  const step=t=>{const p=Math.min(1,(t-t0)/240),e=1-Math.pow(1-p,3);view={x:s.x+(tx-s.x)*e,y:s.y+(ty-s.y)*e,k:s.k+(tk-s.k)*e};applyView();if(p<1)anim=requestAnimationFrame(step)};
  anim=requestAnimationFrame(step);
}
function center(n){if(!n)return;const k=view.k;animateTo(availW()/2-(n.x+W(n)/2)*k,availH()/2-(n.y+(H[n.id]||70)/2)*k,k)}

function fit(instant){

  const aw=availW(),ah=availH()-60,k=clamp(Math.min(aw/(x1-x0+120),ah/(y1-y0+120)),.12,1.1);

let miniT=null,COL=null;

  const dpr=devicePixelRatio||1,cw=c.clientWidth,ch=c.clientHeight;if(!cw)return;
  c.width=cw*dpr;c.height=ch*dpr;const ctx=c.getContext('2d');ctx.scale(dpr,dpr);
  const r=srect(),vp={x:-view.x/view.k,y:-view.y/view.k,w:r.width/view.k,h:r.height/view.k};

  const pad=40;x0-=pad;y0-=pad;x1+=pad;y1+=pad;
  const s=Math.min(cw/(x1-x0),ch/(y1-y0)),ox=(cw-(x1-x0)*s)/2,oy=(ch-(y1-y0)*s)/2;

    const k=clamp(pinch.k*d/pinch.d,.12,2.5),wx=(pinch.cx-r.left-pinch.vx)/pinch.k,wy=(pinch.cy-r.top-pinch.vy)/pinch.k;

/* 拖曳時，連帶移動「所有父節點都在移動中」的子孫（Alt 只移動自己） */
function moveSet(ids,alt){

  while(ch){ch=false;for(const n of db.nodes){if(M.has(n.id))continue;const p=db.edges.filter(e=>e.to===n.id);if(p.length&&p.every(e=>M.has(e.from))){M.add(n.id);ch=true}}}

document.addEventListener('pointerdown',e=>{if(!$('addMenu').hidden&&!e.target.closest('#addMenu,[data-plus],[data-addbtn],[data-ia="child"]'))$('addMenu').hidden=true});
function childPos(p){

function ensureDay(date){
  let d=db.nodes.find(n=>n.type==='day'&&n.date===date);if(d)return d;
  const days=db.nodes.filter(n=>n.type==='day'),x=days.length?Math.min(...days.map(n=>n.x)):0;

function addObs(date,text,time){const d=ensureDay(date),n=mk('obs',childPos(d),{date,text,time,tfs:[...draftTfs]});db.nodes.push(n);db.edges.push({id:uid(),from:d.id,to:n.id});return n}
function mergeSel(){
  const obs=[...sel].map(byId).filter(n=>n&&n.type==='obs');if(!obs.length)return;snap();
  const x=Math.max(...obs.map(o=>o.x+W(o)))+90,y=Math.round(obs.reduce((a,o)=>a+o.y,0)/obs.length);
  const n=mk('idea',{x,y},{tfs:[...new Set(obs.flatMap(o=>o.tfs||[]))]});db.nodes.push(n);
  obs.forEach(o=>db.edges.push({id:uid(),from:o.id,to:n.id}));
  sel=new Set([n.id]);commit();reveal(n);focusEdit();toast(`已把 ${obs.length} 筆觀察連到新觀點，寫下你整理出的規律`);
}
function delSel(){
  if(selEdge){snap();db.edges=db.edges.filter(x=>x.id!==selEdge);selEdge=null;commit();toast('已刪除連線',true);return}
  if(!sel.size)return;snap();const k=sel.size;
  db.nodes=db.nodes.filter(n=>!sel.has(n.id));db.edges=db.edges.filter(e=>!sel.has(e.from)&&!sel.has(e.to));
  sel.clear();commit();toast(`已刪除 ${k} 個節點`,true);
}
function focusEdit(){setTimeout(()=>{const f=$('insp').querySelector('textarea[data-k],input[data-k]:not([type=date]):not([type=number])');if(f){f.focus();const l=f.value.length;f.setSelectionRange?.(l,l)}},30)}

/* 自動排列：以第一個父節點為主幹，由左到右展開 */
function autoLayout(silent){
  if(!silent)snap();
  if(canvasVisible())document.querySelectorAll('#nodes .node').forEach(el=>H[el.dataset.id]=el.offsetHeight);
  const fp={};db.edges.forEach(e=>{if(!(e.to in fp)&&byId(e.from))fp[e.to]=e.from});
  const kids={};Object.entries(fp).forEach(([c,p])=>(kids[p]=kids[p]||[]).push(c));
  const done=new Set();
  const lay=(id,x,y)=>{done.add(id);const n=byId(id);n.x=x;n.y=y;const h=H[id]||(n.type==='day'?90:110);
    const ks=(kids[id]||[]).map(byId).filter(c=>c&&!done.has(c.id)).sort((a,b)=>a.createdAt.localeCompare(b.createdAt));
    let cy=y;ks.forEach((c,i)=>{cy=lay(c.id,x+W(n)+80,cy)+(i<ks.length-1?24:0)});return Math.max(y+h,cy)};
  const roots=db.nodes.filter(n=>!(n.id in fp)).sort((a,b)=>(a.type==='day'?0:1)-(b.type==='day'?0:1)||(a.date||'').localeCompare(b.date||'')||a.createdAt.localeCompare(b.createdAt));
  let y=0;roots.forEach(r=>{if(!done.has(r.id))y=lay(r.id,0,y)+90});
  db.nodes.forEach(n=>{if(!done.has(n.id))y=lay(n.id,0,y)+90});
  if(silent){saveNow();renderAll()}else commit();
}

/* ================= 檢視器 ================= */
function fields(n){

  const ta=(k,l,ph='',r=3,cls='')=>`<label class="fl">${l}<textarea data-k="${k}" rows="${r}" class="${cls}" placeholder="${esc(ph)}">${esc(v(k))}</textarea></label>`;
  const inp=(k,l,type='text',ph='',a='')=>`<label class="fl">${l}<input data-k="${k}" name="${k}" type="${type}" value="${esc(v(k))}" placeholder="${esc(ph)}" ${a}></label>`;
  const sl=(k,l,map)=>`<label class="fl">${l}<select data-k="${k}">${Object.entries(map).map(([a,b])=>`<option value="${a}" ${n[k]===a?'selected':''}>${b}</option>`).join('')}</select></label>`;
  const tg=(k,l,opts,mono=true)=>{const en=Array.isArray(opts)?opts.map(o=>[o,o]):Object.entries(opts);return `<div class="fl">${l}<div class="tgs">${en.map(([a,b])=>`<button type="button" class="tg${mono?' mono':''}" data-tk="${k}" data-tv="${esc(a)}" aria-pressed="${(n[k]||[]).includes(a)}">${esc(b)}</button>`).join('')}</div></div>`};
  const tags=`<label class="fl">標籤（逗號分隔）<input data-k="tags" value="${esc((n.tags||[]).join(', '))}" placeholder="開盤, 突破"></label>`;
  switch(n.type){
    case 'day':{const os=obsOf(n.date);
      return inp('date','日期','date')+`<div class="src"><b style="font-size:13px">這天的觀察（${os.length}）</b>${os.map((o,i)=>`<button class="lk" data-go="${o.id}"><span class="mono" style="color:var(--c-obs)">${String(i+1).padStart(2,'0')}</span>${esc(o.text.slice(0,60))||'（空白）'}</button>`).join('')||'<span class="hint">還沒有。按 Tab 或左側草稿新增。</span>'}</div>`}
    case 'obs':
      return ta('text','觀察內容','看到了什麼：價位、時間、走勢、量能…',6,'big')+`<div class="row2">${inp('date','行情日','date')}${inp('time','時間 (ET)','text','10:15')}</div>`+tg('tfs','週期',TFS)+tags+srcInfo(n);
    case 'idea':
      return inp('title','觀點標題','text','一句話說清楚整理出的規律')+sl('status','狀態',STATUS)+ta('text','可驗證的陳述','什麼條件下、會發生什麼、機率或幅度多少',4)+ta('condition','適用條件 / 排除','排除哪些日子、需要什麼前提',2)+tg('tfs','觀察週期',TFS)+tags+srcInfo(n);
    case 'ext':
      return inp('title','標題','text','延伸方向、疑問或看法')+ta('text','內容','',6)+tags+srcInfo(n);
    case 'val':
      return `<div class="row2">${inp('date','行情日','date')}${sl('verdict','結果',VERDICT)}</div>`+inp('title','標題（可留空）')+ta('text','驗證內容','價位、時間、走勢，以及為什麼算支持或反駁',6)+tags+srcInfo(n);
    case 'strat':
      return inp('title','策略名稱','text','例如：OR30 突破回測')+sl('status','策略狀態',SSTATUS)+ta('text','概述','',2)
      +`<div class="box g-tf"><div class="gh">大小週期</div>${tg('htf','大週期（看方向）',TFS)}${tg('ltf','小週期（找進場）',TFS)}${ta('tfNote','週期說明','各週期分別用來判斷什麼',2)}</div>`
      +`<div class="box g-io"><div class="gh">進出場</div>${sl('dir','方向',DIR)}${ta('entry','進場條件','觸發條件、確認訊號、進場價位')}${ta('takeProfit','停利出場','目標價、分批出場方式')}${ta('stopLoss','停損出場','停損位置與依據',2)}</div>`
      +`<div class="box g-pos"><div class="gh">部位</div><div class="row2">${sl('contract','合約',{NQ:'NQ（$20/pt）',MNQ:'MNQ（$2/pt）'})}${inp('qty','口數','number','','min="0" step="1"')}</div>${ta('scaleIn','加碼規則','',2)}${ta('scaleOut','減碼規則','',2)}</div>`

}
function riskCalc(s){
  const m=CONTRACT[s.contract]||0,pts=+s.riskPts,q=+s.qty;if(!pts||!q)return'';
  const per=pts*m*q,lim=+s.dailyLoss,k=lim?Math.floor(lim/per):null;
  return `<div class="calc">單筆最大虧損 <b>$${per.toLocaleString()}</b>　= ${pts} pt × $${m} × ${q} 口 ${esc(s.contract)}${k!==null?`<br>每日上限 $${lim.toLocaleString()} 約可承受 <b>${k}</b> 筆全額停損`:''}</div>`;
}
function srcInfo(n){
  const up=ins(n.id).filter(p=>p.type!=='day'),down=outs(n.id),t=tally(n.id),tot=t.support+t.against+t.neutral;
  if(!up.length&&!down.length)return'';
  const lk=x=>`<button class="lk" data-go="${x.id}"><span class="badge t-${x.type}">${T[x.type].n}</span>${esc((x.title||x.text||'（空白）').slice(0,48))}</button>`;
  return `<div class="src">${up.length?`<span class="hint">來自</span>${up.map(lk).join('')}`:''}${down.length?`<span class="hint">延伸出 ${down.length} 個節點</span>${down.map(lk).join('')}`:''}</div>`;
}

function liveUpdate(n,k){

  <div class="grid2">
    <div class="card"><h3>每日紀錄<span class="c">${dl.length} 天</span>${dl.length>14?`<button class="linkb" data-ovall>${ovAll?'只看最近 14 天':'顯示全部'}</button>`:''}</h3>
      ${dl.length?`<div class="tw"><table><thead><tr><th>日期</th><th class="num">觀察</th><th>已整理</th><th class="num">整理</th><th class="num">延伸</th><th class="num">策略</th><th class="num">驗證</th></tr></thead><tbody>${shown.map(drow).join('')}</tbody></table></div>`:'<div class="ovempty">還沒有紀錄</div>'}</div>
    <div class="card"><h3>待整理的觀察<span class="c">${unorg.length}</span></h3>
      ${unorg.length?unorg.slice(0,30).map(o=>`<div class="li" data-go="${o.id}"><span class="d">${esc(o.date)}${o.time?'<br>'+esc(o.time):''}</span><div class="b"><div class="t">${esc(o.text)||'<span class="muted">（空白）</span>'}</div></div></div>`).join(''):'<div class="ovempty">所有觀察都已整理 ✓</div>'}</div>
  </div>
  <div class="card"><h3>整理後的觀點<span class="c">${ideas.length}</span></h3>
    ${ideas.length?`<div class="tw"><table style="min-width:860px"><thead><tr><th>觀點</th><th>狀態</th><th class="num">來源觀察</th><th class="num">延伸</th><th>策略</th><th class="num">驗證</th><th class="num">修改</th></tr></thead><tbody>${ideasS.map(ideaRow).join('')}</tbody></table></div>`:'<div class="ovempty">還沒有整理後的觀點。在草稿點選幾筆觀察，按「整理」。</div>'}</div>
  <div class="card"><h3>策略<span class="c">${strats.length}</span></h3>
    ${strats.length?`<div class="tw"><table style="min-width:760px"><thead><tr><th>策略</th><th>狀態</th><th>方向</th><th>大 → 小週期</th><th class="num">部位</th><th class="num">驗證</th><th class="num">修改</th></tr></thead><tbody>${stratsS.map(stratRow).join('')}</tbody></table></div>`:'<div class="ovempty">還沒有策略。從觀點延伸出「策略」節點。</div>'}</div>
  <div class="card"><h3>最近驗證<span class="c">${vals.length}</span></h3>
    ${rv.length?rv.map(v=>{const p=nearest(v,['strat','idea']);return `<div class="li" data-go="${v.id}"><span class="d">${esc(v.date||'')}</span><div class="b"><div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:2px"><span class="vd vd-${v.verdict}">${VERDICT[v.verdict]}</span>${p?`<span class="sub" style="margin:0">${T[p.type].n}：${esc((p.title||p.text).slice(0,40))}</span>`:''}</div><div class="t">${esc(v.title?v.title+'\n'+v.text:v.text)}</div></div></div>`}).join(''):'<div class="ovempty">還沒有驗證紀錄</div>'}</div>
  </div>`;
}
$('ov').addEventListener('click',e=>{
  if(e.target.closest('[data-ovall]')){ovAll=!ovAll;renderOverview();return}
  const d=e.target.closest('[data-day]');if(d){draftDate=d.dataset.day;const day=db.nodes.find(n=>n.type==='day'&&n.date===draftDate);setPage('canvas');if(day)goTo(day.id);else renderDraft();return}
  const g=e.target.closest('[data-go]');if(g)goTo(g.dataset.go);
});
function goTo(id){
  const n=byId(id);if(!n)return;if(page!=='canvas')setPage('canvas');
  if(n.type==='obs'&&n.date){draftDate=n.date}
  sel=new Set([id]);selEdge=null;refreshSel();drawEdges();renderInspector();renderDraft();
  requestAnimationFrame(()=>center(n));
}

/* ================= 頁面與工具列 ================= */
function renderAll(){renderCanvas();renderInspector();renderDraft();if(page==='ov')renderOverview();$('btnSample').hidden=!db.sample;updUndo()}
function setPage(p){
  page=p;document.querySelectorAll('#pages button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.page===p));
  $('app').hidden=p!=='canvas';$('ov').hidden=p!=='ov';$('btnDraft').hidden=p!=='canvas';
  if(p==='canvas'){renderAll();applyView()}else renderOverview();
}
$('pages').onclick=e=>{const b=e.target.closest('[data-page]');if(b)setPage(b.dataset.page)};
$('btnDraft').onclick=()=>{const d=$('draft'),open=d.hidden;d.hidden=!open;$('btnDraft').setAttribute('aria-pressed',open);drawMini()};
$('btnSample').onclick=()=>{snap();db.nodes=[];db.edges=[];db.strokes=[];sel.clear();delete db.sample;commit();toast('已清空範例資料',true)};
function setMode(m){mode=m;stage.dataset.mode=m}
$('tbAdd').onclick=e=>{const r=e.currentTarget.getBoundingClientRect();openAddMenu(null,{clientX:r.left,clientY:r.bottom+6},null)};
$('tbMerge').onclick=mergeSel;
$('tbLayout').onclick=()=>{autoLayout();requestAnimationFrame(()=>fit());toast('已自動排列',true)};
$('tbUndo').onclick=undo;$('tbRedo').onclick=redo;
$('zIn').onclick=()=>{const r=srect();zoomAt(r.width/2,r.height/2,1.2)};
$('zOut').onclick=()=>{const r=srect();zoomAt(r.width/2,r.height/2,1/1.2)};
$('zoomPct').onclick=()=>{const r=srect();zoomAt(r.width/2,r.height/2,1/view.k)};
$('zFit').onclick=()=>fit();

let toastT;
function toast(msg,undoable){
  const t=$('toast');t.innerHTML=`<span>${esc(msg)}</span>${undoable?'<button class="linkb" id="toastUndo">復原</button>':''}`;t.hidden=false;
  if(undoable)$('toastUndo').onclick=()=>{undo();t.hidden=true};
  clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,4000);
}

addEventListener('keydown',e=>{
  const typing=e.target.closest&&e.target.closest('input,textarea,select,[contenteditable]');
  if(e.key==='Escape'){
    if(!$('addMenu').hidden){$('addMenu').hidden=true;return}
    if(!$('gitOverlay').hidden){$('gitOverlay').hidden=true;return}
    if(typing){e.target.blur();return}
    sel.clear();selEdge=null;refreshSel();drawEdges();renderInspector();renderDraft();return;
  }
  if(typing||page!=='canvas'||!$('gitOverlay').hidden)return;
  const mod=e.metaKey||e.ctrlKey,k=e.key.toLowerCase();
  if(mod&&k==='z'){e.preventDefault();e.shiftKey?redo():undo();return}
  if(mod&&k==='y'){e.preventDefault();redo();return}
  if(mod&&k==='a'){e.preventDefault();sel=new Set(db.nodes.map(n=>n.id));refreshSel();renderInspector();renderDraft();return}
  if(mod||e.altKey)return;
  const n=one();
  if(e.key==='Tab'&&n){e.preventDefault();addChild(n.id,CHILD_MENU[n.type][0]);return}
  if(e.key==='Enter'&&n){e.preventDefault();addSibling(n);return}
  if(e.key==='F2'&&n){e.preventDefault();focusEdit();return}
  if(e.key==='Delete'||e.key==='Backspace'){if(sel.size||selEdge){e.preventDefault();delSel()}return}
  if(k==='f')fit();else if(k==='m'&&sel.size)mergeSel();
  else if(k==='n'){e.preventDefault();$('draft').hidden=false;$('btnDraft').setAttribute('aria-pressed',true);$('dInput').focus()}
});

/* ================= 匯出 / 匯入 ================= */
function ingest(d){
  if(Array.isArray(d.nodes))return{db:norm(d),layout:false};
  if(Array.isArray(d.items))return{db:norm(fromV2(d)),layout:true};
  throw new Error('格式不符');
}
$('btnExport').onclick=()=>{
  saveNow();const blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`nq-canvas-${today()}.json`;a.click();
};
$('fileImport').onchange=async e=>{
  const f=e.target.files[0];if(!f)return;
  try{const r=ingest(JSON.parse(await f.text()));snap();db=r.db;sel.clear();selEdge=null;saveNow();renderAll();
    if(r.layout)autoLayout(true);requestAnimationFrame(()=>fit());setSync('dirty',`已匯入 ${f.name}，尚未上傳到 GitHub`);toast(r.layout?'已把舊版假設日誌轉成畫布':'已匯入',true)}
  catch{setSync('err','匯入失敗：不是本工具或舊版假設日誌的 JSON')}
  e.target.value='';
};

/* ================= GitHub 同步 (Contents API) ================= */
const gFields=['gOwner','gRepo','gBranch','gPath','gToken'];
function loadCfg(){
  let c={};try{c=JSON.parse(localStorage.getItem(GITCFG)||'null')||{}}catch(e){}
  if(!c.gOwner){try{const o=JSON.parse(localStorage.getItem(OLDGIT)||'{}');c=Object.assign({},o,{gPath:'data/nq-canvas.json'})}catch(e){}}
  gFields.forEach(k=>{if(c[k])$(k).value=c[k]});return c;
}
function saveCfg(){const c={};gFields.forEach(k=>c[k]=$(k).value.trim());try{localStorage.setItem(GITCFG,JSON.stringify(c))}catch(e){}return c}
const b64enc=s=>{const b=new TextEncoder().encode(s);let r='';for(let i=0;i<b.length;i+=0x8000)r+=String.fromCharCode(...b.subarray(i,i+0x8000));return btoa(r)};
const b64dec=s=>new TextDecoder().decode(Uint8Array.from(atob(s.replace(/\n/g,'')),c=>c.charCodeAt(0)));
function api(c,method='GET',body){
  const url=`https://api.github.com/repos/${encodeURIComponent(c.gOwner)}/${encodeURIComponent(c.gRepo)}/contents/${c.gPath.split('/').map(encodeURIComponent).join('/')}`+(method==='GET'?`?ref=${encodeURIComponent(c.gBranch)}`:'');
  return fetch(url,{method,headers:{Authorization:`Bearer ${c.gToken}`,Accept:'application/vnd.github+json'},body:body&&JSON.stringify(body)});
}
const glog=t=>$('gLog').textContent=t;
function need(c){if(!c.gOwner||!c.gRepo||!c.gToken){glog('請填寫擁有者、Repo 名稱與 Token。');return false}return true}
$('btnGit').onclick=()=>{loadCfg();$('gitOverlay').hidden=false;$('gOwner').focus()};
$('gClose').onclick=()=>$('gitOverlay').hidden=true;
$('gitOverlay').onclick=e=>{if(e.target.id==='gitOverlay')$('gitOverlay').hidden=true};
$('gPull').onclick=async()=>{
  const c=saveCfg();if(!need(c))return;glog('下載中…');
  try{const r=await api(c);if(r.status===404){glog('Repo 裡還沒有這個檔案，先按「上傳到 GitHub」建立。');return}
    if(!r.ok)throw new Error(`${r.status} ${(await r.json()).message||''}`);
    const j=await r.json(),res=ingest(JSON.parse(b64dec(j.content)));snap();db=res.db;sel.clear();selEdge=null;saveNow();renderAll();
    if(res.layout)autoLayout(true);requestAnimationFrame(()=>fit());
    glog(`已下載 ${db.nodes.length} 個節點${res.layout?'（由舊版格式轉換）':''}。`);setSync('ok',`已與 GitHub 同步 · ${fmt(now())}`);
  }catch(err){glog('下載失敗：'+err.message+'\n請確認 repo、分支、路徑與 Token 權限。');setSync('err','GitHub 下載失敗')}
};
$('gPush').onclick=async()=>{
  const c=saveCfg();if(!need(c))return;glog('上傳中…');saveNow();
  try{let sha;const g=await api(c);if(g.ok)sha=(await g.json()).sha;else if(g.status!==404)throw new Error(`${g.status} ${(await g.json()).message||''}`);
    const r=await api(c,'PUT',{message:`更新 NQ 觀察畫布 ${fmt(now())}`,content:b64enc(JSON.stringify(db,null,2)),branch:c.gBranch,sha});
    if(!r.ok)throw new Error(`${r.status} ${(await r.json()).message||''}`);
    glog(`已上傳到 ${c.gOwner}/${c.gRepo}/${c.gPath}`);setSync('ok',`已與 GitHub 同步 · ${fmt(now())}`);
  }catch(err){glog('上傳失敗：'+err.message+'\n請確認 Token 有 Contents 寫入權限。');setSync('err','GitHub 上傳失敗')}
};

/* ================= 啟動 ================= */
if(narrow()){$('draft').hidden=true;$('btnDraft').setAttribute('aria-pressed',false)}
setMode('select');
renderAll();
if(needLayout)autoLayout(true);
let sv=null;try{sv=JSON.parse(localStorage.getItem(VIEWKEY)||'null')}catch(e){}
if(sv&&!needLayout&&isFinite(sv.k)){view=sv;applyView()}else fit(true);
if(migratedMsg)toast(migratedMsg);
try{if(localStorage.getItem(GITCFG)||localStorage.getItem(OLDGIT))setSync('','已設定 GitHub，有變更時記得上傳')}catch(e){}
</script>
